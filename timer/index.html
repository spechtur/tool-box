<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PHGR Timer</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --gelb: #c7d200; --tuerkis: #23b2c6; --rot: #ed6a69;
      --orange: #fbb900; --violett: #6169af; --gruen: #5aab6e;
      --dg: #878787; --mg: #c6c6c6; --hg: #ececec;
    }
    body { font-family: Arial, Helvetica, sans-serif; background: var(--hg); color: #1a1a1a; min-height: 100vh; display: flex; flex-direction: column; user-select: none; }

    header { background: var(--gelb); padding: 13px 24px; display: flex; align-items: center; gap: 14px; flex-shrink: 0; }
    .ph { font-family: Georgia, serif; font-style: italic; font-weight: 700; font-size: 21px; color: #111; }
    .gr { font-variant: small-caps; font-weight: 300; font-size: 21px; color: #111; letter-spacing: .04em; }
    .sep { width: 2px; height: 22px; background: rgba(0,0,0,.15); }
    .header-title { font-size: 17px; font-weight: 700; color: #111; }
    .back-link { margin-left: auto; font-size: 13px; font-weight: 700; color: #333; text-decoration: none; background: rgba(0,0,0,.1); padding: 5px 13px; border-radius: 20px; }
    .back-link:hover { background: rgba(0,0,0,.18); }

    main { flex: 1; display: flex; overflow: hidden; min-height: 0; }

    /* Clock panel */
    #clock-panel { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 32px; gap: 24px; background: white; min-height: 0; }

    #canvas-wrap { position: relative; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    #timer-canvas { display: block; cursor: pointer; transition: width .3s, height .3s; }

    #digital-display { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); font-weight: 800; font-variant-numeric: tabular-nums; color: #1a1a1a; letter-spacing: -.02em; text-align: center; line-height: 1; pointer-events: none; white-space: nowrap; }
    #digital-display.overtime { color: var(--rot); }
    #digital-display.hidden { display: none; }

    #pure-digital { font-weight: 800; font-variant-numeric: tabular-nums; color: #1a1a1a; letter-spacing: -.03em; line-height: 1; text-align: center; transition: color .5s; }
    #pure-digital.overtime { color: var(--rot); }
    #pure-digital.hidden { display: none; }

    #color-bar { width: 100%; max-width: 500px; height: 8px; border-radius: 4px; background: var(--mg); overflow: hidden; }
    #color-bar-fill { height: 100%; border-radius: 4px; background: var(--gruen); width: 100%; transition: width .5s linear, background .5s; }

    #overtime-label { font-size: 14px; font-weight: 700; color: var(--rot); display: none; letter-spacing: .05em; text-transform: uppercase; }

    .controls { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; justify-content: center; }
    .btn { border: none; border-radius: 10px; padding: 12px 22px; font-size: 15px; font-weight: 700; cursor: pointer; font-family: Arial; transition: opacity .15s, transform .1s; }
    .btn:hover { opacity: .85; } .btn:active { transform: scale(.97); }
    .btn-start { background: var(--gruen); color: white; min-width: 110px; font-size: 17px; padding: 14px 28px; }
    .btn-stop  { background: var(--rot);   color: white; min-width: 110px; font-size: 17px; padding: 14px 28px; }
    .btn-reset { background: var(--hg); color: #555; border: 2px solid var(--mg); }
    .btn-add   { background: var(--tuerkis); color: white; padding: 10px 14px; font-size: 13px; }
    .btn-fs    { background: var(--violett); color: white; padding: 12px 16px; font-size: 15px; }
    .btn-fly   { background: var(--orange); color: #111; padding: 12px 16px; font-size: 15px; }

    /* Fullscreen styles */
    #clock-panel:fullscreen { background: white; padding: 0; justify-content: center; gap: 32px; }
    #clock-panel:fullscreen .controls { position: fixed; bottom: 32px; left: 50%; transform: translateX(-50%); background: rgba(255,255,255,.92); padding: 12px 20px; border-radius: 16px; box-shadow: 0 2px 16px rgba(0,0,0,.1); }
    #clock-panel:-webkit-full-screen { background: white; padding: 0; justify-content: center; gap: 32px; }
    #clock-panel:-webkit-full-screen .controls { position: fixed; bottom: 32px; left: 50%; transform: translateX(-50%); background: rgba(255,255,255,.92); padding: 12px 20px; border-radius: 16px; box-shadow: 0 2px 16px rgba(0,0,0,.1); }

    /* Sidebar */
    #sidebar { width: 280px; flex-shrink: 0; background: var(--hg); border-left: 1px solid var(--mg); display: flex; flex-direction: column; overflow-y: auto; padding: 20px 18px; gap: 20px; }
    .s-group { display: flex; flex-direction: column; gap: 10px; }
    .s-label { font-size: 10px; font-weight: 700; letter-spacing: .13em; text-transform: uppercase; color: var(--dg); }

    .presets { display: flex; flex-wrap: wrap; gap: 7px; }
    .preset-btn { padding: 8px 12px; border-radius: 8px; border: 2px solid var(--mg); background: white; color: #1a1a1a; font-size: 13px; font-weight: 700; cursor: pointer; font-family: Arial; transition: all .15s; }
    .preset-btn:hover { border-color: var(--tuerkis); color: var(--tuerkis); }
    .preset-btn.active { background: var(--tuerkis); border-color: var(--tuerkis); color: white; }

    .time-input-row { display: flex; gap: 6px; align-items: center; }
    .time-spin { width: 60px; padding: 9px 8px; border-radius: 8px; border: 2px solid var(--mg); background: white; font-size: 18px; font-weight: 700; text-align: center; font-family: Arial; outline: none; }
    .time-spin:focus { border-color: var(--tuerkis); }
    .time-sep { font-size: 20px; font-weight: 800; color: var(--dg); }
    .set-btn { flex: 1; padding: 9px 12px; border-radius: 8px; background: var(--gelb); color: #111; border: none; font-size: 14px; font-weight: 700; cursor: pointer; font-family: Arial; }

    .mode-row { display: flex; gap: 6px; }
    .mode-btn { flex: 1; padding: 8px 6px; border-radius: 8px; border: 2px solid var(--mg); background: white; color: var(--dg); font-size: 12px; font-weight: 700; cursor: pointer; font-family: Arial; text-align: center; transition: all .15s; }
    .mode-btn.on { background: var(--violett); border-color: var(--violett); color: white; }

    .alert-row { display: flex; gap: 6px; flex-wrap: wrap; }
    .alert-btn { flex: 1; padding: 8px 6px; border-radius: 8px; border: 2px solid var(--mg); background: white; color: var(--dg); font-size: 12px; font-weight: 700; cursor: pointer; font-family: Arial; text-align: center; transition: all .15s; min-width: 60px; }
    .alert-btn.on { background: var(--orange); border-color: var(--orange); color: #111; }

    .toggle-row { display: flex; align-items: center; justify-content: space-between; }
    .toggle-label { font-size: 13px; color: #333; font-weight: 600; }
    .switch { position: relative; width: 44px; height: 24px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; inset: 0; border-radius: 24px; background: var(--mg); cursor: pointer; transition: background .2s; }
    .slider:before { content: ''; position: absolute; width: 18px; height: 18px; border-radius: 50%; background: white; top: 3px; left: 3px; transition: transform .2s; }
    input:checked + .slider { background: var(--tuerkis); }
    input:checked + .slider:before { transform: translateX(20px); }


    @media (max-width: 700px) {
      main { flex-direction: column; }
      #sidebar { width: 100%; border-left: none; border-top: 1px solid var(--mg); }
    }
  </style>
</head>
<body>
<header>
  <div><span class="ph">ph</span><span class="gr">GR</span></div>
  <div class="sep"></div>
  <div class="header-title">Timer</div>
  <a class="back-link" href="../index.html">← tool-box</a>
</header>

<main>
  <div id="clock-panel">
    <div id="canvas-wrap">
      <canvas id="timer-canvas" onclick="firstInteract(); toggleTimer()"></canvas>
      <div id="digital-display" class="hidden">00:00</div>
    </div>
    <div id="pure-digital" class="hidden">00:00</div>
    <div id="color-bar" class="hidden"><div id="color-bar-fill"></div></div>
    <div id="overtime-label">⚠ Überzeit</div>
    <div class="controls">
      <button class="btn btn-start" id="main-btn" onclick="firstInteract(); toggleTimer()">▶ Start</button>
      <button class="btn btn-reset" onclick="resetTimer()">↺ Reset</button>
      <button class="btn btn-add"   onclick="addTime(60)">+1 min</button>
      <button class="btn btn-add"   onclick="addTime(300)">+5 min</button>
      <button class="btn btn-fs"    onclick="goFullscreen()" title="Vollbild">⛶</button>
      <button class="btn btn-fly"   onclick="openFlyover()" title="Flyover-Fenster">⧉</button>
    </div>
  </div>

  <div id="sidebar">
    <div class="s-group">
      <div class="s-label">Schnellwahl</div>
      <div class="presets">
        <button class="preset-btn" data-s="60"   onclick="setPreset(60)">1 min</button>
        <button class="preset-btn" data-s="120"  onclick="setPreset(120)">2 min</button>
        <button class="preset-btn" data-s="180"  onclick="setPreset(180)">3 min</button>
        <button class="preset-btn" data-s="300"  onclick="setPreset(300)">5 min</button>
        <button class="preset-btn" data-s="600"  onclick="setPreset(600)">10 min</button>
        <button class="preset-btn" data-s="900"  onclick="setPreset(900)">15 min</button>
        <button class="preset-btn" data-s="1200" onclick="setPreset(1200)">20 min</button>
        <button class="preset-btn" data-s="1500" onclick="setPreset(1500)">25 min</button>
        <button class="preset-btn" data-s="1800" onclick="setPreset(1800)">30 min</button>
        <button class="preset-btn" data-s="2700" onclick="setPreset(2700)">45 min</button>
        <button class="preset-btn" data-s="3600" onclick="setPreset(3600)">60 min</button>
        <button class="preset-btn" data-s="5400" onclick="setPreset(5400)">90 min</button>
      </div>
    </div>

    <div class="s-group">
      <div class="s-label">Eigene Zeit</div>
      <div class="time-input-row">
        <input class="time-spin" type="number" id="inp-min" value="10" min="0" max="99">
        <span class="time-sep">:</span>
        <input class="time-spin" type="number" id="inp-sec" value="0" min="0" max="59">
        <button class="set-btn" onclick="setCustomTime()">Setzen</button>
      </div>
    </div>

    <div class="s-group">
      <div class="s-label">Anzeige</div>
      <div class="mode-row">
        <button class="mode-btn on" data-m="analog-rel" onclick="setMode('analog-rel')">Relativ</button>
        <button class="mode-btn"    data-m="analog-abs" onclick="setMode('analog-abs')">Absolut</button>
        <button class="mode-btn"    data-m="digital"    onclick="setMode('digital')">Digital</button>
      </div>
    </div>

    <div class="s-group">
      <div class="s-label">Alarm bei Ablauf</div>
      <div class="alert-row">
        <button class="alert-btn on" data-a="sound" onclick="toggleAlert('sound')">🔔 Ton</button>
        <button class="alert-btn on" data-a="flash" onclick="toggleAlert('flash')">⚡ Blinken</button>
      </div>
    </div>

    <div class="s-group">
      <div class="s-label">Optionen</div>
      <div class="toggle-row">
        <span class="toggle-label">Digitalzeit im Kreis</span>
        <label class="switch"><input type="checkbox" id="tog-digincircle" checked onchange="applySettings()"><span class="slider"></span></label>
      </div>
      <div class="toggle-row" style="margin-top:8px">
        <span class="toggle-label">Farbverlauf (grün → rot)</span>
        <label class="switch"><input type="checkbox" id="tog-colorprog" checked onchange="applySettings()"><span class="slider"></span></label>
      </div>
    </div>

    <div class="s-group" style="border-top:1px solid var(--mg);padding-top:16px">
      <div class="s-label">Flyover-Fenster</div>
      <div style="font-size:12px;color:var(--dg);line-height:1.5">Öffnet einen kleinen schwebenden Timer als eigenes Browser-Fenster – bleibt beim Tab-Wechsel sichtbar.</div>
      <button class="set-btn" style="margin-top:8px" onclick="openFlyover()">⧉ Flyover öffnen</button>
    </div>
  </div>
</main>

<script>
// ── State ──────────────────────────────────────────────────
let totalSecs = 600, remaining = 600, running = false;
let interval  = null, alerted = false;
let mode      = 'analog-rel';
let alertSound = true, alertFlash = true;
let audioCtx  = null;
let interacted = false;
let flyWin    = null;
let bc        = null; // BroadcastChannel

// BroadcastChannel for flyover sync
try { bc = new BroadcastChannel('phgr-timer'); } catch(e) {}

function broadcastState() {
  if (!bc) return;
  try {
    bc.postMessage({ remaining, totalSecs, running, mode, alerted });
  } catch(e) {}
}

// ── Audio ──────────────────────────────────────────────────
function firstInteract() {
  if (interacted) return;
  interacted = true;
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if (audioCtx.state === 'suspended') audioCtx.resume();
}

function playChime() {
  if (!alertSound || !audioCtx) return;
  if (audioCtx.state === 'suspended') audioCtx.resume();
  const freqs = [880, 660, 440];
  freqs.forEach((f, i) => {
    const osc  = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.type = 'sine';
    osc.frequency.value = f;
    const t = audioCtx.currentTime + i * 0.32;
    gain.gain.setValueAtTime(0, t);
    gain.gain.linearRampToValueAtTime(0.45, t + 0.04);
    gain.gain.exponentialRampToValueAtTime(0.001, t + 0.7);
    osc.start(t);
    osc.stop(t + 0.75);
  });
}

function doFlash() {
  if (!alertFlash) return;
  const el = document.getElementById('flash');
  let n = 0;
  const blink = () => {
    el.style.opacity = n % 2 === 0 ? '0.55' : '0';
    n++;
    if (n < 6) setTimeout(blink, 200); else el.style.opacity = '0';
  };
  blink();
}

// ── Timer ──────────────────────────────────────────────────
function toggleTimer() {
  running ? pause() : start();
}

function start() {
  running = true; alerted = false;
  interval = setInterval(tick, 1000);
  updateMainBtn(); broadcastState();
}

function pause() {
  running = false;
  clearInterval(interval);
  updateMainBtn(); broadcastState();
}

function resetTimer() {
  pause();
  remaining = totalSecs; alerted = false;
  document.getElementById('overtime-label').style.display = 'none';
  draw(); updateTimeLabel(); broadcastState();
}

function tick() {
  remaining--;
  if (remaining === 0 && !alerted) {
    alerted = true;
    playChime();
    doFlash();
  }
  draw(); updateTimeLabel(); broadcastState();
  if (remaining < 0) document.getElementById('overtime-label').style.display = 'block';
}

function addTime(s) {
  totalSecs += s; remaining += s;
  if (remaining < 0) remaining = s;
  alerted = false;
  document.getElementById('overtime-label').style.display = 'none';
  draw(); updateTimeLabel(); broadcastState();
}

// ── Time setting ───────────────────────────────────────────
function setPreset(s) {
  pause();
  totalSecs = s; remaining = s; alerted = false;
  document.querySelectorAll('.preset-btn').forEach(b => b.classList.toggle('active', parseInt(b.dataset.s) === s));
  document.getElementById('overtime-label').style.display = 'none';
  draw(); updateTimeLabel(); broadcastState();
}

function setCustomTime() {
  const m = parseInt(document.getElementById('inp-min').value) || 0;
  const s = parseInt(document.getElementById('inp-sec').value) || 0;
  const t = m * 60 + s;
  if (t <= 0) return;
  pause();
  totalSecs = t; remaining = t; alerted = false;
  document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('overtime-label').style.display = 'none';
  draw(); updateTimeLabel(); broadcastState();
}

// ── Mode & settings ────────────────────────────────────────
function setMode(m) {
  mode = m;
  document.querySelectorAll('.mode-btn').forEach(b => b.classList.toggle('on', b.dataset.m === m));
  applySettings(); draw();
}

function applySettings() {
  const digInCircle = document.getElementById('tog-digincircle').checked;
  const colorProg   = document.getElementById('tog-colorprog').checked;
  const canvas      = document.getElementById('timer-canvas');
  const pd          = document.getElementById('pure-digital');
  const dd          = document.getElementById('digital-display');
  const cb          = document.getElementById('color-bar');

  if (mode === 'digital') {
    canvas.style.display = 'none';
    dd.classList.add('hidden');
    pd.classList.remove('hidden');
    cb.classList.toggle('hidden', !colorProg);
  } else {
    canvas.style.display = 'block';
    pd.classList.add('hidden');
    cb.classList.add('hidden');
    digInCircle ? dd.classList.remove('hidden') : dd.classList.add('hidden');
  }
  resizeCanvas(); draw();
}

function toggleAlert(type) {
  const btn = document.querySelector(`.alert-btn[data-a="${type}"]`);
  if (type === 'sound') { alertSound = !alertSound; btn.classList.toggle('on', alertSound); }
  if (type === 'flash') { alertFlash = !alertFlash; btn.classList.toggle('on', alertFlash); }
}

// ── Canvas sizing ──────────────────────────────────────────
function resizeCanvas() {
  const canvas = document.getElementById('timer-canvas');
  const dd     = document.getElementById('digital-display');
  const pd     = document.getElementById('pure-digital');
  const isFS   = !!document.fullscreenElement;

  let size;
  if (isFS) {
    size = Math.round(Math.min(window.screen.width, window.screen.height) * 0.70);
  } else {
    const panel = document.getElementById('clock-panel');
    const avail = Math.min(panel.clientWidth - 48, panel.clientHeight - 160);
    size = Math.max(220, Math.min(avail, 420));
  }

  canvas.width  = size;
  canvas.height = size;

  // Digital font size
  const fs = Math.round(size * 0.28);
  dd.style.fontSize = fs + 'px';

  // Pure digital
  const pfs = isFS ? Math.round(size * 0.36) : Math.round(size * 0.30);
  pd.style.fontSize = pfs + 'px';
}

// ── Color ──────────────────────────────────────────────────
function getColor(frac) {
  if (frac <= 0) return '#ed6a69';
  if (frac > 0.5) return '#5aab6e';
  if (frac > 0.2) return lerpColor('#5aab6e', '#fbb900', (0.5 - frac) / 0.3);
  return lerpColor('#fbb900', '#ed6a69', (0.2 - frac) / 0.2);
}

function lerpColor(a, b, t) {
  const ah = parseInt(a.slice(1), 16), bh = parseInt(b.slice(1), 16);
  const ar = (ah>>16)&0xff, ag = (ah>>8)&0xff, ab = ah&0xff;
  const br = (bh>>16)&0xff, bg = (bh>>8)&0xff, bb = bh&0xff;
  return `rgb(${Math.round(ar+(br-ar)*t)},${Math.round(ag+(bg-ag)*t)},${Math.round(ab+(bb-ab)*t)})`;
}

// ── Draw ───────────────────────────────────────────────────
function draw() {
  const colorProg = document.getElementById('tog-colorprog').checked;
  const frac  = totalSecs > 0 ? Math.max(0, remaining) / totalSecs : 0;
  const color = colorProg ? getColor(frac) : '#23b2c6';
  const isOT  = remaining < 0;

  if (mode !== 'digital') {
    const canvas = document.getElementById('timer-canvas');
    const ctx = canvas.getContext('2d');
    const W = canvas.width, H = canvas.height;
    const cx = W/2, cy = H/2;
    const lw = Math.max(14, Math.round(W * 0.065));
    const R  = Math.min(W, H)/2 - lw - 4;

    ctx.clearRect(0, 0, W, H);

    // Track
    ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI*2);
    ctx.strokeStyle = '#ececec'; ctx.lineWidth = lw; ctx.stroke();

    // Arc
    const start = -Math.PI/2;
    let sf = mode === 'analog-rel'
      ? (isOT ? 0 : frac)
      : (isOT ? 0 : Math.max(0, (Math.min(totalSecs,3600) - (totalSecs - Math.max(0,remaining))) / 3600));

    if (sf > 0) {
      ctx.beginPath(); ctx.arc(cx, cy, R, start, start + sf*Math.PI*2);
      ctx.strokeStyle = color; ctx.lineWidth = lw; ctx.lineCap = 'round'; ctx.stroke();
    }

    // Overtime arc
    if (isOT) {
      const of = Math.min(1, Math.abs(remaining)/totalSecs);
      ctx.beginPath(); ctx.arc(cx, cy, R, start, start + of*Math.PI*2);
      ctx.strokeStyle = '#ed6a69'; ctx.lineWidth = lw; ctx.lineCap = 'round'; ctx.stroke();
    }

    // Tick marks (abs)
    if (mode === 'analog-abs') {
      for (let i = 0; i < 12; i++) {
        const a = (i/12)*Math.PI*2 - Math.PI/2;
        ctx.beginPath();
        ctx.moveTo(cx + Math.cos(a)*(R+lw*.4), cy + Math.sin(a)*(R+lw*.4));
        ctx.lineTo(cx + Math.cos(a)*(R+lw*.9), cy + Math.sin(a)*(R+lw*.9));
        ctx.strokeStyle = '#c6c6c6'; ctx.lineWidth = 2; ctx.lineCap = 'butt'; ctx.stroke();
      }
    }


  }

  if (mode === 'digital') {
    const pd   = document.getElementById('pure-digital');
    pd.style.color = isOT ? '#ed6a69' : (colorProg ? color : '#1a1a1a');
    const fill = document.getElementById('color-bar-fill');
    fill.style.width      = `${Math.max(0, frac*100)}%`;
    fill.style.background = color;
  }

  // Digital overlay text (color follows arc color)
  const dd = document.getElementById('digital-display');
  dd.style.color = isOT ? '#ed6a69' : (colorProg ? color : '#1a1a1a');
}

function formatTime(s) {
  const neg = s < 0, abs = Math.abs(s);
  return (neg ? '−' : '') + String(Math.floor(abs/60)).padStart(2,'0') + ':' + String(abs%60).padStart(2,'0');
}

function updateTimeLabel() {
  const t = formatTime(remaining);
  document.getElementById('digital-display').textContent = t;
  document.getElementById('pure-digital').textContent    = t;
  document.title = t + ' – PHGR Timer';
}

function updateMainBtn() {
  const btn = document.getElementById('main-btn');
  btn.textContent = running ? '⏸ Pause' : '▶ Start';
  btn.className   = 'btn ' + (running ? 'btn-stop' : 'btn-start');
}

// ── Fullscreen ─────────────────────────────────────────────
function goFullscreen() {
  const panel = document.getElementById('clock-panel');
  if (!document.fullscreenElement) {
    (panel.requestFullscreen || panel.webkitRequestFullscreen).call(panel);
  } else {
    (document.exitFullscreen || document.webkitExitFullscreen).call(document);
  }
}

document.addEventListener('fullscreenchange', () => { resizeCanvas(); draw(); });
document.addEventListener('webkitfullscreenchange', () => { resizeCanvas(); draw(); });

// ── Flyover popup ──────────────────────────────────────────
function openFlyover() {
  if (flyWin && !flyWin.closed) { flyWin.focus(); return; }
  const sw = screen.width, sh = screen.height;
  const w = 200, h = 260;
  const html = `<!DOCTYPE html><html><head><meta charset="UTF-8">
<title>Timer</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:white;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;gap:10px;padding:12px}
canvas{display:block}
#t{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;color:#1a1a1a;letter-spacing:-.02em}
#t.ot{color:#ed6a69}
.row{display:flex;gap:8px}
button{padding:8px 14px;border-radius:8px;font-size:13px;font-weight:700;border:none;cursor:pointer;font-family:Arial}
.g{background:#5aab6e;color:white}.r{background:#ed6a69;color:white}.x{background:#ececec;color:#555}
</style></head><body>
<canvas id="c" width="130" height="130"></canvas>
<div id="t">--:--</div>
<div class="row">
  <button id="ss" class="g" onclick="ss()">▶</button>
  <button class="x" onclick="window.close()">✕</button>
</div>
<script>
let rem=600,tot=600,run=false,mode='analog-rel';
const bc=new BroadcastChannel('phgr-timer');
bc.onmessage=e=>{
  const d=e.data;
  rem=d.remaining;tot=d.totalSecs;run=d.running;mode=d.mode||'analog-rel';
  draw();updateBtn();
};
function ss(){bc.postMessage({cmd:run?'pause':'start'});}
function draw(){
  const c=document.getElementById('c'),ctx=c.getContext('2d');
  const W=130,cx=65,cy=65,R=52,lw=12;
  const frac=tot>0?Math.max(0,rem)/tot:0;
  const isOT=rem<0;
  const color=frac>0.5?'#5aab6e':frac>0.2?'#fbb900':'#ed6a69';
  ctx.clearRect(0,0,W,W);
  ctx.beginPath();ctx.arc(cx,cy,R,0,Math.PI*2);ctx.strokeStyle='#ececec';ctx.lineWidth=lw;ctx.stroke();
  let sf=isOT?0:(mode==='analog-abs'?Math.max(0,(Math.min(tot,3600)-(tot-Math.max(0,rem)))/3600):frac);
  if(sf>0){ctx.beginPath();ctx.arc(cx,cy,R,-Math.PI/2,-Math.PI/2+sf*Math.PI*2);ctx.strokeStyle=color;ctx.lineWidth=lw;ctx.lineCap='round';ctx.stroke();}
  if(isOT){const of=Math.min(1,Math.abs(rem)/tot);ctx.beginPath();ctx.arc(cx,cy,R,-Math.PI/2,-Math.PI/2+of*Math.PI*2);ctx.strokeStyle='#ed6a69';ctx.lineWidth=lw;ctx.lineCap='round';ctx.stroke();}
  
  const neg=rem<0,abs=Math.abs(rem);
  const txt=(neg?'−':'')+String(Math.floor(abs/60)).padStart(2,'0')+':'+String(abs%60).padStart(2,'0');
  document.getElementById('t').textContent=txt;
  document.getElementById('t').className=isOT?'ot':'';
  document.title=txt+' – Timer';
}
function updateBtn(){const b=document.getElementById('ss');b.textContent=run?'⏸':'▶';b.className=run?'r':'g';}
draw();
<\/script></body></html>`;
  const blob = new Blob([html], {type:'text/html'});
  const url  = URL.createObjectURL(blob);
  flyWin = window.open(url, 'phgr-timer-fly',
    `width=${w},height=${h},top=${sh-h-40},left=${sw-w-20},menubar=no,toolbar=no,location=no,status=no,scrollbars=no,resizable=yes`
  );
  if (!flyWin) alert('Popup wurde blockiert. Bitte Popups für diese Seite in den Browser-Einstellungen erlauben.');
}

// Handle commands from flyover
if (bc) {
  bc.onmessage = e => {
    if (e.data.cmd === 'start') { firstInteract(); start(); }
    if (e.data.cmd === 'pause') pause();
  };
}

// ── Keyboard ───────────────────────────────────────────────
document.addEventListener('keydown', e => {
  if (e.key === ' ' && e.target.tagName !== 'INPUT') { e.preventDefault(); firstInteract(); toggleTimer(); }
  if ((e.key === 'r' || e.key === 'R') && e.target.tagName !== 'INPUT') resetTimer();
  if (e.key === 'F11') { e.preventDefault(); goFullscreen(); }
});

// ── Resize observer ────────────────────────────────────────
const ro = new ResizeObserver(() => { resizeCanvas(); draw(); });
ro.observe(document.getElementById('clock-panel'));

// ── Init ───────────────────────────────────────────────────
resizeCanvas();
draw();
updateTimeLabel();
applySettings();
</script>
<div id="flash" style="position:fixed;inset:0;background:#ed6a69;opacity:0;pointer-events:none;z-index:99999;transition:opacity .08s"></div>
</body>
</html>

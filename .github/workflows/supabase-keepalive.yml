name: Supabase Keep-Alive

# Hält das Free-Plan-Projekt «tool-box» aktiv, indem täglich eine echte
# Datenbankabfrage an die Mini-Tabelle public.heartbeat geschickt wird.
# Die Tabelle enthält keine Personendaten und ist für anon nur lesbar.

on:
  schedule:
    - cron: '17 5 * * *'   # täglich um 05:17 UTC
  workflow_dispatch:        # manuell auslösbar unter «Actions»

jobs:
  ping:
    runs-on: ubuntu-latest
    env:
      # Der Publishable Key ist laut Supabase öffentlich unbedenklich
      # (er steckt ohnehin in den HTML-Tools). Schutz bietet die RLS.
      SUPABASE_URL: https://vslukenxtwllvrejkjav.supabase.co
      SUPABASE_KEY: sb_publishable_4Fo-JBYFiYXzQgo70BHnMA_-Ysy7E5k
    steps:
      - name: Heartbeat-Abfrage
        run: |
          # Wichtig: Publishable Key NUR im apikey-Header.
          # Im Authorization-Header wird er als ungültiges JWT abgelehnt.
          response=$(curl --silent --show-error --fail-with-body \
            --retry 3 --retry-delay 20 --retry-all-errors \
            "$SUPABASE_URL/rest/v1/heartbeat?select=id,note" \
            -H "apikey: $SUPABASE_KEY")

          echo "Antwort: $response"

          if echo "$response" | grep -q '"keep-alive"'; then
            echo "✅ Supabase ist aktiv und hat geantwortet."
          else
            echo "❌ Unerwartete Antwort – Projekt evtl. pausiert?"
            exit 1
          fi

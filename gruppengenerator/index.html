<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gruppenlos · Zufallsgruppenbildung</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,600;1,9..144,400&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">

  <style>
    /* ── Design Tokens ───────────────────────────────────── */
    :root {
      /* PHGR Brand colours */
      --green:        #C8D300;   /* Hauptfarbe  */
      --green-dark:   #A2AA00;   /* Hover       */
      --green-tint:   #F2F5B0;   /* Soft bg     */
      --teal:         #28B2C7;   /* Zierfarbe 1 */
      --teal-dark:    #1A90A0;
      --teal-tint:    #DDF4F8;
      --violet:       #636AAF;   /* Zierfarbe 2 */
      --violet-dark:  #4D5398;
      --violet-tint:  #EAEBF7;
      --bg:           #EDEDED;   /* Grau-Hintergrund */
      --surface:      #FFFFFF;
      --text:         #1A1A1A;
      --text-muted:   #6B6B6B;
      --border:       #D5D5D5;
      --radius:       14px;
      --radius-sm:    9px;
      --shadow-sm:    0 1px 3px rgba(0,0,0,.06), 0 2px 8px rgba(0,0,0,.08);
      --shadow-md:    0 4px 20px rgba(0,0,0,.11);
      --item-h:       56; /* px — keep in sync with JS */
    }

    /* ── Reset ───────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'DM Sans', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 0 1rem 6rem;
    }

    /* ── Header ──────────────────────────────────────────── */
    header {
      max-width: 700px;
      margin: 0 auto;
      padding: 2.5rem 0 2.25rem;
      border-bottom: 1px solid var(--border);
      margin-bottom: 2rem;
    }

    .eyebrow {
      display: flex;
      align-items: center;
      gap: .55rem;
      margin-bottom: .85rem;
    }

    .ph-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 30px; height: 30px;
      background: var(--green);
      border-radius: 7px;
      color: var(--text);          /* dark text on bright green */
      font-size: .6rem;
      font-weight: 700;
      letter-spacing: .05em;
      flex-shrink: 0;
    }

    .eyebrow-text {
      font-size: .72rem;
      font-weight: 500;
      letter-spacing: .07em;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    h1 {
      font-family: 'Fraunces', Georgia, serif;
      font-size: clamp(2.1rem, 6vw, 3rem);
      font-weight: 600;
      line-height: 1.08;
      letter-spacing: -.01em;
    }

    h1 em {
      font-style: italic;
      color: var(--teal);
      font-weight: 300;
    }

    .tagline {
      margin-top: .5rem;
      color: var(--text-muted);
      font-size: .92rem;
    }

    /* ── Main layout ─────────────────────────────────────── */
    main { max-width: 700px; margin: 0 auto; }

    /* ── Cards ───────────────────────────────────────────── */
    .card {
      background: var(--surface);
      border-radius: var(--radius);
      padding: 1.6rem 1.75rem;
      margin-bottom: .875rem;
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--border);
    }

    .step-label {
      display: flex;
      align-items: center;
      gap: .45rem;
      font-size: .7rem;
      font-weight: 600;
      letter-spacing: .09em;
      text-transform: uppercase;
      color: var(--violet);
      margin-bottom: 1rem;
    }

    .step-num {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 20px; height: 20px;
      background: var(--violet-tint);
      color: var(--violet);
      border-radius: 50%;
      font-size: .68rem;
      font-weight: 700;
    }

    /* ── Textarea ────────────────────────────────────────── */
    textarea {
      width: 100%;
      min-height: 155px;
      border: 1.5px solid var(--border);
      border-radius: var(--radius-sm);
      padding: .9rem 1rem;
      font-family: 'DM Sans', sans-serif;
      font-size: .9rem;
      color: var(--text);
      background: var(--bg);
      resize: vertical;
      transition: border-color .2s, background .2s;
      line-height: 1.65;
    }

    textarea:focus {
      outline: none;
      border-color: var(--teal);
      background: #fff;
    }

    textarea::placeholder { color: #B0ADA5; }

    .meta-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: .55rem;
    }

    .name-count {
      font-size: .78rem;
      color: var(--text-muted);
      transition: color .2s;
    }

    .name-count.active { color: var(--teal); font-weight: 500; }

    .btn-clear {
      font-family: 'DM Sans', sans-serif;
      font-size: .75rem;
      color: var(--text-muted);
      background: none;
      border: none;
      cursor: pointer;
      padding: .2rem .5rem;
      border-radius: 5px;
      transition: color .15s, background .15s;
    }

    .btn-clear:hover { color: var(--violet); background: var(--violet-tint); }

    /* ── Drum + Group count section ──────────────────────── */
    .drum-section {
      display: flex;
      align-items: center;
      gap: 2rem;
    }

    .drum-desc { flex: 1; }

    .drum-readout {
      font-family: 'Fraunces', serif;
      font-size: 1.55rem;
      font-weight: 600;
      margin-bottom: .3rem;
      transition: opacity .15s;
    }

    .drum-hint {
      font-size: .85rem;
      color: var(--text-muted);
      line-height: 1.55;
      margin-bottom: 1rem;
    }

    .drum-btns {
      display: flex;
      gap: .5rem;
    }

    .btn-adj {
      width: 40px; height: 40px;
      background: var(--bg);
      border: 1.5px solid var(--border);
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--teal);
      display: flex; align-items: center; justify-content: center;
      transition: all .15s;
      line-height: 1;
    }

    .btn-adj:hover { background: var(--teal-tint); border-color: var(--teal); }
    .btn-adj:active { transform: scale(.94); }

    /* ── Drum roller ─────────────────────────────────────── */
    .drum-outer {
      position: relative;
      width: 76px;
      flex-shrink: 0;
    }

    /* The scrolling container */
    .drum-scroll {
      height: 280px; /* 5 × 56px */
      overflow-y: scroll;
      scroll-snap-type: y mandatory;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
      cursor: ns-resize;
      position: relative;
      z-index: 1;
    }

    .drum-scroll::-webkit-scrollbar { display: none; }

    .drum-item {
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Fraunces', serif;
      font-size: 2rem;
      font-weight: 600;
      scroll-snap-align: center;
      cursor: pointer;
      user-select: none;
      color: var(--text-muted);
      opacity: .3;
      transition: color .15s, opacity .15s, transform .15s;
    }

    .drum-item.near { opacity: .55; }
    .drum-item.selected { color: var(--green-dark); opacity: 1; transform: scale(1.18); }

    /* Background highlight (stays fixed, items scroll past it) */
    .drum-highlight {
      position: absolute;
      left: 4px; right: 4px;
      top: 112px; /* 2 × 56 — center of container */
      height: 56px;
      background: var(--green-tint);
      border-radius: 10px;
      z-index: 0;
      pointer-events: none;
    }

    /* Fade masks */
    .drum-fade {
      position: absolute;
      left: 0; right: 0;
      height: 100px;
      pointer-events: none;
      z-index: 2;
    }

    .drum-fade.top    { top: 0;    background: linear-gradient(to bottom, #fff 20%, transparent); }
    .drum-fade.bottom { bottom: 0; background: linear-gradient(to top,   #fff 20%, transparent); }

    .drum-tip {
      text-align: center;
      font-size: .65rem;
      letter-spacing: .06em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-top: .4rem;
      opacity: .7;
    }

    /* ── Generate button ─────────────────────────────────── */
    .btn-generate {
      width: 100%;
      padding: 1.05rem 1.5rem;
      background: var(--green);
      color: var(--text);              /* dark text on bright green */
      border: none;
      border-radius: var(--radius);
      font-family: 'DM Sans', sans-serif;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      letter-spacing: .02em;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: .65rem;
      margin-bottom: 1.5rem;
      box-shadow: 0 4px 22px rgba(160,170,0,.35);
      transition: background .2s, transform .15s, box-shadow .2s;
    }

    .btn-generate:hover {
      background: var(--green-dark);
      transform: translateY(-2px);
      box-shadow: 0 7px 28px rgba(160,170,0,.4);
    }

    .btn-generate:active { transform: translateY(0); box-shadow: none; }

    .btn-generate .icon {
      display: flex;
      transition: transform .4s ease;
    }

    .btn-generate:hover .icon { transform: rotate(180deg); }

    /* ── Results ─────────────────────────────────────────── */
    #results {
      opacity: 0;
      transform: translateY(14px);
      pointer-events: none;
      transition: opacity .4s ease, transform .4s ease;
    }

    #results.visible { opacity: 1; transform: none; pointer-events: all; }

    .results-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.1rem;
      flex-wrap: wrap;
      gap: .5rem;
    }

    .results-title {
      font-family: 'Fraunces', serif;
      font-size: 1.2rem;
      font-weight: 600;
    }

    .results-actions { display: flex; gap: .5rem; }

    .btn-sm {
      padding: .42rem .9rem;
      border-radius: 8px;
      font-family: 'DM Sans', sans-serif;
      font-size: .8rem;
      font-weight: 600;
      cursor: pointer;
      transition: all .18s;
    }

    .btn-sm.ghost {
      background: transparent;
      color: var(--text-muted);
      border: 1.5px solid var(--border);
    }

    .btn-sm.ghost:hover { color: var(--text); border-color: var(--text-muted); }

    .btn-sm.outline {
      background: transparent;
      color: var(--teal);
      border: 1.5px solid var(--teal);
    }

    .btn-sm.outline:hover { background: var(--teal); color: #fff; }

    /* ── Group cards grid ────────────────────────────────── */
    .groups-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(185px, 1fr));
      gap: .9rem;
    }

    .group-card {
      background: var(--surface);
      border-radius: var(--radius);
      overflow: hidden;
      border: 1px solid var(--border);
      box-shadow: var(--shadow-sm);
      opacity: 0;
      transform: translateY(10px) scale(.97);
      transition: opacity .3s ease, transform .3s ease, box-shadow .2s;
    }

    .group-card:hover {
      box-shadow: var(--shadow-md);
      transform: translateY(-2px) scale(1.005);
    }

    .group-card.in { opacity: 1; transform: none; }

    .card-head {
      padding: .6rem 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .card-head-title {
      color: #fff;
      font-weight: 600;
      font-size: .75rem;
      letter-spacing: .06em;
      text-transform: uppercase;
    }

    .card-head-count {
      color: rgba(255,255,255,.65);
      font-size: .72rem;
    }

    .card-body { padding: .7rem 1rem; }

    .member {
      padding: .32rem 0;
      font-size: .875rem;
      line-height: 1.4;
      color: var(--text);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: .4rem;
    }

    .member:last-child { border-bottom: none; }

    /* ── Footer ──────────────────────────────────────────── */
    footer {
      max-width: 700px;
      margin: 3rem auto 0;
      text-align: center;
      font-size: .7rem;
      color: #B0ADA5;
    }

    /* ── Shake animation ─────────────────────────────────── */
    @keyframes shake {
      0%,100% { transform: translateX(0); }
      20%      { transform: translateX(-7px); }
      40%      { transform: translateX(7px); }
      60%      { transform: translateX(-4px); }
      80%      { transform: translateX(4px); }
    }

    .shake { animation: shake .4s ease; }

    /* ── Responsive ──────────────────────────────────────── */
    @media (max-width: 480px) {
      .drum-section { flex-direction: column-reverse; align-items: flex-start; gap: 1rem; }
      .drum-outer { align-self: center; }
    }
  </style>
</head>
<body>

<!-- ── Header ────────────────────────────────────────────── -->
<header>
  <div class="eyebrow">
    <div class="ph-badge">PH</div>
    <span class="eyebrow-text">PH Graubünden · Werkzeug</span>
  </div>
  <h1>Gruppen<em>los</em></h1>
  <p class="tagline">Zufällige Gruppenbildung für Weiterbildungsformate</p>
</header>

<main>

  <!-- ── Schritt 1: Namen ─────────────────────────────────── -->
  <div class="card">
    <div class="step-label">
      <span class="step-num">1</span>Namen eingeben
    </div>
    <textarea
      id="namesInput"
      placeholder="Namen kommagetrennt oder ein Name pro Zeile:

Anna Muster, Beat Schmid, Carla Frei, Daniel Meier

oder

Anna Muster
Beat Schmid
Carla Frei"></textarea>
    <div class="meta-row">
      <span class="name-count" id="nameCount">Noch keine Namen erkannt</span>
      <button class="btn-clear" onclick="clearNames()">Feld leeren</button>
    </div>
  </div>

  <!-- ── Schritt 2: Anzahl Gruppen ───────────────────────── -->
  <div class="card">
    <div class="step-label">
      <span class="step-num">2</span>Anzahl Gruppen
    </div>
    <div class="drum-section">

      <div class="drum-desc">
        <div class="drum-readout" id="drumReadout">4 Gruppen</div>
        <p class="drum-hint">Drehmechanismus scrollen oder Schaltflächen verwenden, um die Anzahl einzustellen.</p>
        <div class="drum-btns">
          <button class="btn-adj" onclick="adjustDrum(-1)" aria-label="Weniger Gruppen">−</button>
          <button class="btn-adj" onclick="adjustDrum(+1)" aria-label="Mehr Gruppen">+</button>
        </div>
      </div>

      <div class="drum-outer">
        <div class="drum-highlight"></div>
        <div class="drum-scroll" id="drum" tabindex="0" aria-label="Anzahl Gruppen wählen" role="spinbutton" aria-valuemin="2" aria-valuemax="12" aria-valuenow="4">
          <!-- items + spacers injected by JS -->
        </div>
        <div class="drum-fade top"></div>
        <div class="drum-fade bottom"></div>
      </div>

    </div>
    <div class="drum-tip">↕ scrollen</div>
  </div>

  <!-- ── Schritt 3: Generieren ────────────────────────────── -->
  <button class="btn-generate" id="btnGenerate" onclick="generate()">
    <span class="icon">
      <!-- shuffle icon -->
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
        <path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6"/>
      </svg>
    </span>
    Gruppen bilden
  </button>

  <!-- ── Ergebnis ─────────────────────────────────────────── -->
  <div id="results" aria-live="polite">
    <div class="results-bar">
      <div class="results-title" id="resultsTitle"></div>
      <div class="results-actions">
        <button class="btn-sm ghost" onclick="generate()">↺ Nochmals mischen</button>
        <button class="btn-sm outline" onclick="downloadTxt()">↓ Herunterladen</button>
      </div>
    </div>
    <div class="groups-grid" id="groupsGrid"></div>
  </div>

</main>

<footer>
  Gruppenlos · PH Graubünden · <span id="yr"></span>
</footer>

<script>
  /* ── Constants ──────────────────────────────────────── */
  const MIN_G = 2, MAX_G = 12;
  const ITEM_H = 56;     // px — matches CSS var(--item-h)
  const SPACER_H = 112;  // 2 × ITEM_H

  // 12 colours built from the 3 PHGR brand colours (with text fg for contrast)
  const PALETTE = [
    { bg: '#C8D300', fg: '#1A1A1A' },  // PHGR Grün
    { bg: '#28B2C7', fg: '#0D3A40' },  // Teal
    { bg: '#636AAF', fg: '#FFFFFF' },  // Violet
    { bg: '#A2AA00', fg: '#FFFFFF' },  // Grün dunkel
    { bg: '#1A90A0', fg: '#FFFFFF' },  // Teal dunkel
    { bg: '#4D5398', fg: '#FFFFFF' },  // Violet dunkel
    { bg: '#D8E500', fg: '#1A1A1A' },  // Grün hell
    { bg: '#50C4D5', fg: '#0D3A40' },  // Teal hell
    { bg: '#7A80C0', fg: '#FFFFFF' },  // Violet hell
    { bg: '#B8C200', fg: '#1A1A1A' },  // Grün mid
    { bg: '#00A0B4', fg: '#FFFFFF' },  // Teal satt
    { bg: '#8A5EB0', fg: '#FFFFFF' },  // Violet verschoben
  ];

  /* ── Drum ───────────────────────────────────────────── */
  let selected = 4;
  const drum = document.getElementById('drum');

  (function buildDrum() {
    drum.innerHTML = '';

    // Top spacer (allows first value to sit at centre)
    const t = document.createElement('div');
    t.style.height = SPACER_H + 'px';
    drum.appendChild(t);

    for (let n = MIN_G; n <= MAX_G; n++) {
      const el = document.createElement('div');
      el.className = 'drum-item';
      el.textContent = n;
      el.dataset.v = n;
      el.addEventListener('click', () =>
        drum.scrollTo({ top: (n - MIN_G) * ITEM_H, behavior: 'smooth' })
      );
      drum.appendChild(el);
    }

    // Bottom spacer
    const b = document.createElement('div');
    b.style.height = SPACER_H + 'px';
    drum.appendChild(b);

    drum.scrollTop = (selected - MIN_G) * ITEM_H;
    syncDrum(false);
  })();

  function syncDrum(announce = true) {
    const idx   = Math.round(drum.scrollTop / ITEM_H);
    selected    = Math.max(0, Math.min(MAX_G - MIN_G, idx)) + MIN_G;

    drum.querySelectorAll('.drum-item').forEach((el, i) => {
      const dist = Math.abs(i - idx);
      el.classList.toggle('selected', dist === 0);
      el.classList.toggle('near',     dist === 1);
    });

    const lbl = selected === 1 ? '1 Gruppe' : `${selected} Gruppen`;
    document.getElementById('drumReadout').textContent = lbl;
    drum.setAttribute('aria-valuenow', selected);
    drum.setAttribute('aria-valuetext', lbl);
  }

  // Snap to nearest item after free scroll
  let snapTimer;
  drum.addEventListener('scroll', () => {
    syncDrum(false);
    clearTimeout(snapTimer);
    snapTimer = setTimeout(() => {
      drum.scrollTo({ top: (selected - MIN_G) * ITEM_H, behavior: 'smooth' });
    }, 120);
  });

  // Keyboard
  drum.addEventListener('keydown', e => {
    if (e.key === 'ArrowUp'   && selected > MIN_G)
      { e.preventDefault(); drum.scrollTo({ top: (selected - MIN_G - 1) * ITEM_H, behavior: 'smooth' }); }
    if (e.key === 'ArrowDown' && selected < MAX_G)
      { e.preventDefault(); drum.scrollTo({ top: (selected - MIN_G + 1) * ITEM_H, behavior: 'smooth' }); }
  });

  function adjustDrum(delta) {
    const next = Math.max(MIN_G, Math.min(MAX_G, selected + delta));
    drum.scrollTo({ top: (next - MIN_G) * ITEM_H, behavior: 'smooth' });
  }

  /* ── Name parsing ───────────────────────────────────── */
  const namesInput  = document.getElementById('namesInput');
  const nameCountEl = document.getElementById('nameCount');

  function parseNames(raw) {
    return raw.split(/[\n,]+/).map(s => s.trim()).filter(Boolean);
  }

  namesInput.addEventListener('input', updateCount);

  function updateCount() {
    const n = parseNames(namesInput.value).length;
    nameCountEl.textContent =
      n === 0 ? 'Noch keine Namen erkannt' :
      n === 1 ? '1 Name erkannt' :
                `${n} Namen erkannt`;
    nameCountEl.className = 'name-count' + (n > 0 ? ' active' : '');
  }

  function clearNames() {
    namesInput.value = '';
    updateCount();
  }

  /* ── Fisher-Yates shuffle ───────────────────────────── */
  function shuffle(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
      const j = 0 | Math.random() * (i + 1);
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  /* ── Generate ───────────────────────────────────────── */
  let currentGroups = [];

  function generate() {
    const names = parseNames(namesInput.value);

    if (names.length === 0) {
      shakeEl(namesInput); return;
    }
    if (names.length < selected) {
      alert(`Zu wenige Namen (${names.length}) für ${selected} Gruppen.\n` +
            `Bitte weniger Gruppen wählen oder mehr Namen eingeben.`);
      shakeEl(document.getElementById('btnGenerate')); return;
    }

    const buckets = Array.from({ length: selected }, () => []);
    shuffle(names).forEach((name, i) => buckets[i % selected].push(name));

    currentGroups = buckets;
    render(buckets);
  }

  function render(groups) {
    const grid    = document.getElementById('groupsGrid');
    const results = document.getElementById('results');

    document.getElementById('resultsTitle').textContent =
      `${groups.length} Gruppen · ${groups.flat().length} Personen`;

    grid.innerHTML = '';

    groups.forEach((members, i) => {
      const p    = PALETTE[i % PALETTE.length];
      const card = document.createElement('div');
      card.className = 'group-card';

      card.innerHTML =
        `<div class="card-head" style="background:${p.bg}">
           <span class="card-head-title" style="color:${p.fg}">Gruppe ${i + 1}</span>
           <span class="card-head-count" style="color:${p.fg}; opacity:.65">${members.length}&thinsp;P.</span>
         </div>
         <div class="card-body">
           ${members.map(m =>
             `<div class="member">
               <span style="display:inline-block;width:5px;height:5px;border-radius:50%;background:${p.bg};flex-shrink:0;margin-right:.4rem;opacity:.85"></span>${esc(m)}
             </div>`
           ).join('')}
         </div>`;

      grid.appendChild(card);
      // staggered entrance
      setTimeout(() => card.classList.add('in'), 40 + i * 55);
    });

    results.classList.add('visible');
    setTimeout(() =>
      results.scrollIntoView({ behavior: 'smooth', block: 'start' }), 250);
  }

  /* ── Download as plain text ─────────────────────────── */
  function downloadTxt() {
    if (!currentGroups.length) return;

    const date = new Date().toLocaleDateString('de-CH',
      { day: '2-digit', month: '2-digit', year: 'numeric' });

    const lines = [
      'Gruppenlos · Zufällige Gruppenbildung',
      date,
      '─'.repeat(40),
      '',
      ...currentGroups.map((m, i) =>
        `Gruppe ${i + 1}  (${m.length} Personen)\n` +
        m.map(n => `  · ${n}`).join('\n')
      ).join('\n\n').split('\n')
    ];

    const a = Object.assign(document.createElement('a'), {
      href: URL.createObjectURL(
        new Blob([lines.join('\n')], { type: 'text/plain;charset=utf-8' })
      ),
      download: `gruppen_${new Date().toISOString().slice(0,10)}.txt`
    });
    a.click();
    URL.revokeObjectURL(a.href);
  }

  /* ── Helpers ────────────────────────────────────────── */
  function esc(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function shakeEl(el) {
    el.classList.remove('shake');
    void el.offsetWidth; // reflow
    el.classList.add('shake');
    el.addEventListener('animationend', () => el.classList.remove('shake'), { once: true });
  }

  // Footer year
  document.getElementById('yr').textContent = new Date().getFullYear();
</script>

</body>
</html>

  // ── 148 Konzepte (Name + Kurzbeschreibung + SiKo-Zuordnung) ──
  konzepte: [{"name":"Neue Autorität nach Omer","kurz":"Als Antwort auf Autoritätsprobleme in der heutigen Erziehung entwickelte Haim Omer gemeinsam mit Arist von Schlippe ein Konzept elterlicher Autorität durch Beziehung und ohne Gewalt.","sikos":["I.05","E.09","E.02","E.06","E.10","E.05","E.01"]},{"name":"Klassenführung nach Kounin und Evertson","kurz":"Unter den Forschungsarbeiten zur Klassenführung gelten die Beiträge von Jacob S. Kounin als wegweisend.","sikos":["E.04","E.02","E.03","E.06","E.05","E.01"]},{"name":"Planungsprozess: wie Unterricht planen?","kurz":"Unterricht planen erfolgt meist in Form eines Dreischritts von der Jahresplanung über eine Grobplanung/Wochenplanung zur Feinplanung. Dabei können verschiedene Planungsinstrumente zur Anwendung kommen.","sikos":["L.03","L.07","L.10","E.04","L.02","B.01","L.08","E.03","L.01","L.05","L.09","L.04","L.06"]},{"name":"Bedingungsanalyse","kurz":"Wer soll etwas lernen? Wenn man sich bei der Planung einer Unterrichtseinheit zunächst dieser Frage widmet, rücken das bereits vorhandene Wissen und Können, die Ressourcen und Interessen der Lerngruppe ins Zentrum.","sikos":["L.03","B.06","L.02","B.01","L.08","L.09","L.01"]},{"name":"Sachanalyse","kurz":"Was sollen die Schülerinnen und Schüler inhaltlich lernen, oder: Um welche Lerninhalte/Themen soll es im Unterricht gehen?","sikos":["L.03","B.06","L.02","B.01","L.01","B.02"]},{"name":"Kompetenzen und Lernziele","kurz":"sollen die Schülerinnen und Schüler lernen? Oder anders gefragt: Welches Wissen und Können und welche Haltungen sollen schliesslich aus ihren Lerntätigkeiten resultieren?","sikos":["L.03","L.02","B.01","L.01","B.02"]},{"name":"Unterrichtssetting","kurz":"Mit Unterrichtssetting ist die bewusst gestaltete Umgebung gemeint, in der schulische Lernprozesse ablaufen.","sikos":["L.03","B.02","B.04","I.05","B.06","L.02","B.01","L.08","B.05","L.01","L.05","L.09","L.04","L.06"]},{"name":"Linzer Konzept der Klassenführung nach Mayr","kurz":"Der Linzer Fragebogen zu Klassenführung\" (LDK) ist ein Fragebogen zum Führungshandeln von Lehrkräften. Er ist aus Forschungen zur Klassenführung und aus praktischen Erfahrungen in der Lehrerbildung hervorgegangen.","sikos":["E.01","E.02"]},{"name":"Phasenmodell der Teamentwicklung nach Tuckman","kurz":"Das Phasenmodell der Teamentwicklung (auch \"Teamuhr\") genannt wurde von Bruce Tuckman in den 1960er-Jahren entwickelt und beschreibt unterschiedliche Phasen, die ein Team im Laufe der Zusammenarbeit durchläuft.","sikos":["I.05","B.06","E.02","B.01","E.06","E.01"]},{"name":"Gewaltfreie Kommunikation nach Rosenberg","kurz":"Die Gewaltfreie Kommunikation (GFK) ist ein Konzept, um eine empathische Haltung in der menschlichen Kommunikation zu unterstützen. Das Konzept wurde von Marshall B.","sikos":["E.09","E.02","E.06","E.05","E.01"]},{"name":"WOWW-Ansatz nach Berg","kurz":"Und dennoch treten manchmal Schwierigkeiten auf. Lösungsorientierte Vorgehensweisen haben sich in solchen \"herausfordernden Situationen\" gleichermassen als hilfreich wie auch praktikabel erwiesen.","sikos":["B.03","I.05","E.04","E.09","E.02","E.06","L.01","L.09","E.05","L.04","E.01"]},{"name":"10 Merkmale guten Unterrichts nach Meyer","kurz":"Hilbert Meyer stellt hier zehn empirisch abgesicherte Gütekriterien vor, die das aktuelle Wissen über erfolgreiche Unterrichtsstrukturen bündeln.","sikos":["L.03","B.03","L.02","E.02","B.01","L.08","B.05","L.01","B.02","L.04","E.01"]},{"name":"No Blame Approach","kurz":"Der NO BLAME APPROACH (Ansatz ohne Schuldzuweisung) hat enormen Bekanntheitsgrad erreicht und auf einfachen, unkomplizierten Wegen Einzug in die Schullandschaft gehalten.","sikos":["E.04","E.09","E.02","E.06","E.05"]},{"name":"10 Qualitätsmerkmale guten Unterrichts nach Helmke","kurz":"Helmke geht der Frage nach den Merkmalen eines guten Lehrers bzw. nach den Gelingensbedingungen erfolgreichen Unterrichts als Gegenstand der empirischen Unterrichtsforschung nach.","sikos":["L.03","B.03","L.02","E.02","B.01","L.08","B.05","L.01","B.02","L.04","E.01"]},{"name":"Lehrperson nach Hattie","kurz":"Der deutsche Hattie-Übersetzer Zierer legt damit eine komprimierte Übersicht über Hatties Forschung vor, die es vor allem auch im Berufsleben stehenden Lehrkräften ermöglichen soll, sich schnell einen fundierten Überblick über…","sikos":["B.03","I.02","B.06","E.02","E.05","L.04","E.01"]},{"name":"Bindungstheorie","kurz":"Pädagogischen Fachkräften ist die Bedeutung von Bindung und Beziehung in Förderkontexten hinreichend bekannt: Beziehungsgestaltung ist der Schlüssel zum Fördererfolg!","sikos":["B.03","E.02","B.01","E.10","B.05","E.05","E.01"]},{"name":"Reteaming & Meisterklasse nach Furman","kurz":"Ben Furmans lösungsfokussierter Ansatz: Veränderungsprozesse werden zielorientiert gesteuert, indem Teams oder Einzelpersonen eigene Ressourcen aktivieren. Meisterklasse überträgt das Prinzip auf Schule und Klassenklima.","sikos":["E.04","E.08","E.07","L.02","E.09","E.02","I.01","E.10","B.05","L.08","E.03","E.06","B.03","I.05","I.03","I.04","B.01","L.09","E.05","E.01"]},{"name":"Erziehungsstile","kurz":"Wie Kinder erzogen werden, ist eine zentrale Determinante für die Entwicklung des Verhaltens von Kindern. Anhand von Erziehungsstilen werden intraindividuelle, relativ stabile Muster der Eltern-Kind-Beziehung beschrieben.","sikos":["E.04","E.09","E.02","I.01","E.06","E.10","E.05","L.04","E.01"]},{"name":"Neue Beurteilungsformen nach Winter","kurz":"Noten sind umstritten, unter anderem, weil sie nicht den objektiven Leistungsstand von Schüler:innen widerspiegeln, sondern nur die Rangfolge innerhalb der Klasse.","sikos":["B.03","B.04","B.06","L.02","I.04","E.09","B.01","L.08","I.01","B.05","L.09","B.02"]},{"name":"Soziale Wahrnehmung","kurz":"Mit der sozialen Wahrnehmung wird der Einschätzungsprozess beschrieben, dem wir unterliegen, wenn wir uns ein Bild von anderen Personen machen.","sikos":["E.03","E.08","I.02","B.01"]},{"name":"Funktion von Vorurteilen","kurz":"In seinem einleitenden Grundlagenbeitrag \"Die Bedeutung von Vorurteil und Stereotyp im interkulturellen Handeln\" liefert Alexander Thomas einen umfassenden Forschungsüberblick zu Stereotyp und Vorurteil.","sikos":["E.03","I.02","B.01"]},{"name":"Logische Ebenen nach Dilts","kurz":"Die Pyramide von Robert Dilts wird auch \"Modell der logischen Ebenen\" genannt und ist ein Erklärungsansatz für die positive Gestaltung von Veränderungen in sozialen Systemen und Organisationen.","sikos":["I.05","I.02","E.08","E.09","E.02","I.01","E.06","E.10"]},{"name":"Es ist nie zu spät eine Glückliche Kindheit zu haben nach Furman","kurz":"In Wissenschaft und Öffentlichkeit ist der Mythos fest verankert, dass schwierige Bedingungen in der Kindheit unweigerlich zu einem unglücklichen, gefährdeten Erwachsenenleben führen.","sikos":["E.08","E.10","I.03","I.01"]},{"name":"Systemische Biografiearbeit nach Röhrbein","kurz":"Jahrhundert bietet für viele Menschen unzählige Möglichkeiten, ihr Leben zu gestalten.","sikos":["I.03","E.08","E.09","E.02","I.01","E.03","E.10"]},{"name":"Lern- und Bildungsgeschichten","kurz":"Was müssen pädagogische Beobachtungen leisten, die sich mit Lernprozessen von Schülerinnen und Schülern auseinandersetzen, fragt Heike de Boer.","sikos":["B.03","B.06","B.01","L.08","E.10","B.05","L.09"]},{"name":"Berufsauftrag des LCH","kurz":"Der Lehrberuf hat sich in den vergangenen Jahren stark verändert, die Tätigkeit von Lehrerinnen und Lehrern ist vielfältiger und anspruchsvoller geworden.","sikos":["I.05","I.02","I.03","I.04","E.07"]},{"name":"Dramatisierung, Entdramatisierung & Gender","kurz":"In geschlechterreflektiertem Verhalten und Kommunizieren liegt oft die Problematik, dass auf der einen Seite die gesellschaftlich konstruierte Kategorie des Geschlechts aufgelöst werden soll, um die Individualität von Menschen zu unterstützen.","sikos":["E.03","E.10","E.02","E.06"]},{"name":"Neue Beurteilungskultur nach Winter","kurz":"Die schulische Leistungsbewertung und die Lernkultur bedingen einander wechselseitig. Das, was geprüft und beurteilt wird, bestimmt in hohem Maße das, was gelernt wird.","sikos":["B.03","B.04","B.06","L.02","I.04","L.08","I.01","B.05","L.09","B.02"]},{"name":"Beobachtung","kurz":"Im Kapitel 7 des Buchs von Fisseni geht es um die Verhaltensbeobachtung als eigenständige Methode der psychologischen Diagnostik.","sikos":["I.02","B.06","B.01","L.08","E.03","E.10","B.05","L.09"]},{"name":"Entwicklungsaufgaben","kurz":"Ausgangspunkt dieses Kapitels ist das Konzept der Entwicklungsaufgaben nach Havighurst, das sehr prominent geworden ist und dessen Grundideen bis heute weitgehend Gültigkeit besitzen.","sikos":["B.06","E.08","B.01","E.06","E.10","B.05","E.05"]},{"name":"Selbstkonzept","kurz":"Zunächst sollen kurz die theoretischen Wurzeln der pädagogisch-psychologischen Selbstkonzeptforschung beschrieben werden, indem dargestellt wird, wie von James und im symbolischen Interaktionismus über das „Selbst“ gedacht wurde.","sikos":["B.03","E.04","B.06","E.08","I.04","E.02","B.01","I.01","E.03","E.10","B.05","L.09","E.05"]},{"name":"Lernzieltaxonomie nach Bloom","kurz":"Die Lernziel-Taxonomie nach Bloom (1973; resp. Bloom et al., 1956) ist ein bekanntes und bewährtes Modell, um kognitive Leistungen zu klassifizieren.","sikos":["L.03","B.02","L.07","B.03","B.04","B.06","L.02","B.01","L.08","E.03","E.10","B.05","L.01","L.05","L.09","L.06"]},{"name":"Planspiele","kurz":"Planspiele, auch Simulationsspiele genannt, dienen dazu, komplexe Handlungssituationen in der vereinfachten Form einer Spielsituation mit modellhafter Anlehnung an die Wirklichkeit gefahrlos erproben zu können.","sikos":["L.03","L.07","L.10","E.04","E.08","E.02","E.06","L.05","E.05","L.06","E.01"]},{"name":"Inklusive Schule","kurz":"Die inklusive Schule - die Schule für alle - nicht nur zu fordern, sondern Realität werden zu lassen, ist eine Herausforderung sowohl für Lehrkräfte als auch für Fachkräfte aus der Heilpädagogik.","sikos":["I.05","E.04","B.06","L.02","I.04","B.01","L.08","E.03","E.10","B.05"]},{"name":"Förderkreislauf und Förderplanung","kurz":"Ausgehend von einer bio-psycho-sozialen Analyse auf Basis der ICF-CY werden diagnostische Fragestellungen formuliert, Informationen gesammelt und interpretiert, um darauf aufbauend individuell angepasste Fördermaßnahmen zu entwickeln, umzusetzen und zu evaluieren.","sikos":["B.03","I.05","B.06","L.02","B.01","L.08","E.10","B.05","L.01"]},{"name":"ICF","kurz":"ICF steht für \"International Classification of Functioning, Disability and Health\" (Internationale Klassifikation der Funktionsfähigkeit, Behinderung und Gesundheit).","sikos":["I.05","B.06","E.08","B.01","L.08","E.03","E.10","B.05","L.01"]},{"name":"Kultur der Digitalität","kurz":"Referentialität, Gemeinschaftlichkeit und Algorithmizität sind die charakteristischen Formen der Kultur der Digitalität, in der sich immer mehr Menschen, auf immer mehr Feldern und mithilfe immer komplexerer Technologien an der…","sikos":["L.03","L.07","E.04","L.01","B.02","I.02","L.02","I.01","B.05","L.08","E.03","B.03","B.04","L.10","I.05","B.06","I.04","B.01","L.09","L.05","L.04","L.06"]},{"name":"Digitalität","kurz":"Digitalität ist der vierte Leitmedienwechsel (nach Oralität, Skriptografie, Typografie) und stellt die Paradigmen von Gesellschaft und Schule neu ein – mehr als blosse Digitalisierung.","sikos":["L.03","L.07","E.04","B.02","I.02","L.02","E.02","I.01","B.05","L.08","E.03","B.04","I.05","I.04","B.01","L.09","L.05","L.06","E.01"]},{"name":"Bildung für nachhaltige Entwicklung","kurz":"Diese Publikation umreisst das Verständnis von Bildung für Nachhaltige Entwicklung (BNE) der Stiftung éducation21 und erhebt keinen Anspruch auf Allgemeingültigkeit.","sikos":["L.03","L.07","E.04","L.01","I.02","L.02","E.09","E.02","I.01","E.10","L.08","E.03","E.06","B.04","L.10","I.05","I.03","I.04","B.01","L.09","L.05","E.05","L.06"]},{"name":"Kompetenzorientierung als Leitbegriff der Didaktik","kurz":"Im Beitrag wird der Begriff der Kompetenzorientierung als didaktischer Leitbegriff aus einem wissenspädagogischen Blickwinkel beleuchtet.","sikos":["L.03","B.03","L.02","L.01","B.02"]},{"name":"LUKAS - ein Modell zur Entwicklung von kompetenzfördernden Aufgabensets","kurz":"Aufgaben gelten in einem kompetenzorientierten Unterricht als Schlüsselelement, um Lernen zu gestalten und zu arrangieren.","sikos":["L.03","B.03","L.02","B.01","L.01","B.02"]},{"name":"Gute Lehrerinnen und Lehrer","kurz":"Die einfachen Antworten auf die Frage «Was ist eine gute Lehrerin, was ein guter Lehrer?» erfolgen häufig in Form von eher naiven, additiven Wunschkatalogen über ideale Lehrpersonen.","sikos":["E.05","I.02","I.01"]},{"name":"Kritische Rückmeldung geben nach Furman","kurz":"Es ist leichter, einen Ratschlag anzunehmen als Kritik. Es ist leichter, einen Vorschlag anzunehmen als einen Ratschlag. Es ist leichter, einen Wunsch anzunehmen als einen Vorschlag.","sikos":["B.03","B.04","I.05","I.03","E.09","E.02","E.06","B.05","E.05","E.07"]},{"name":"Das Ende der Erziehung nach Postman","kurz":"Viele Wege führen nach Rom, und alle sind richtig - aber warum Rom? Postman nimmt sich dem grossen Thema von Sinn und Zweck der Schulerziehung unserer Kinder an.","sikos":["L.03","E.04","I.04","E.03","L.09"]},{"name":"Konstruktivismus","kurz":"Der Text eröffnet Einblicke in die Bedeutung von Beobachterperspektiven im Lernprozess und zeigt auf, wie man diese nutzen kann, um das eigene Lernen zu verbessern.","sikos":["L.03","L.07","E.08","L.01","B.02","E.07","I.02","L.02","E.09","E.02","I.01","E.10","B.05","E.06","B.03","B.04","L.10","I.05","B.06","I.04","B.01","L.09","L.05","E.05","L.04","L.06","E.01"]},{"name":"Hochbegabung","kurz":"Um intellektuell hochbegabte Kinder und Jugendliche angemessen fördern zu können, sind eine rechtzeitige Diagnostik und fundierte Beratung unumgänglich.","sikos":["B.03","B.06","E.08","L.02","B.01","L.08","E.03","E.10","B.05","L.01","L.09"]},{"name":"Didaktische Analyse nach Klafki","kurz":"Zur bildungstheoretischen Didaktik gelangte Klafki, nachdem er sich seit den 1950er Jahren mit dem traditionellen Widerspruch zwischen materialen (Bildungsinhalte, die so wichtig sind, dass Schüler sie lernen müssen) und formalen…","sikos":["L.03","L.07","B.06","L.02","B.01"]},{"name":"Rolle der Lehrperson","kurz":"Peter Larisch beschreibt in seinem Artikel, wie vielfältig die Rolle als Lehrperson sein kann und wie persönliche Vorstellungen von diesem Berufsbild aussehen.","sikos":["I.05","I.03","I.02","I.04","I.01"]},{"name":"Unterrichtsstörungen händeln","kurz":"Eine positive, respektvolle und störungsfreie Lernumgebung unterstützt das Lernen der Schülerinnen und Schüler.","sikos":["I.02","I.03","E.02","B.01","E.06","E.05","L.04","E.01"]},{"name":"Integrativer Unterricht (Didaktische Prinzipien)","kurz":"Die schulische Integration von Kindern und Jugendlichen mit Beeinträchtigungen wird von zahlreichen Seiten gefordert.","sikos":["L.03","B.03","I.05","B.06","L.02","B.01","L.08","E.10","B.05","L.09"]},{"name":"Kollegiale Fallberatung (Intervision)","kurz":"Intervision, auch Kollegiale Beratung genannt, ist eine zielgerichtete und lösungsorientierte Methode zur Bearbeitung von Anliegen und Fragen aus dem professionellen Kontext: In einer Gruppe werden berufliche Praxisfälle vorgestellt.","sikos":["I.05","I.03","I.02","I.04","E.09","I.01","E.06"]},{"name":"Motivation","kurz":"Motivation ist nach der Intelligenz die wichtigste Variable schulischer Leistung. Das Konzept bündelt Forschungsbefunde zu intrinsischer und extrinsischer Motivation, Selbstbestimmungstheorie und motivationsförderlichem Unterricht.","sikos":["L.03","B.03","B.04","I.02","B.06","E.08","I.03","E.09","E.02","L.08","E.10","B.05","L.01","L.05","L.09","E.01"]},{"name":"Systemisch-Lösungsorientierte Beratung","kurz":"Lösungssuche statt Problemanalyse: Die lösungsorientierte Beratung findet immer größere Resonanz, sei es in der Arbeit mit Einzelnen, in Gruppen, in Beratungsstellen oder im Coaching.","sikos":["B.03","I.05","E.04","E.08","E.09","E.02","E.06","E.10","B.05","L.09","E.05","E.01","E.07"]},{"name":"Ich schaffs - für Jugendliche","kurz":"„Ich schaffs! – Cool ans Ziel“ ist ein spielerisches und lösungsorientiertes Programm für die Arbeit mit 13- bis 18-Jährigen, das sich die Vitalität, Neugier und Begeisterungsfähigkeit von Teenagern zunutze macht.","sikos":["B.03","E.04","E.08","E.09","E.02","L.08","E.03","E.06","E.10","B.05","L.09","E.05","E.07"]},{"name":"Diversity","kurz":"Auf welche Bedeutungsdimensionen, Prämissen oder Gründungsnarrative bezieht man sich implizit bzw. explizit, wenn man auf diese Begriffe in Forschungsarbeiten oder pädagogischen Konzepten rekurriert?","sikos":["E.04","B.06","E.08","B.01","E.03","E.10","B.05"]},{"name":"Intersektionalität","kurz":"Intersektionalität beschreibt das Zusammenwirken verschiedener Ungleichheitsdimensionen (z.B. Geschlecht, Klasse, Herkunft) – Diskriminierungen überlagern und verstärken sich gegenseitig, anstatt unabhängig zu wirken.","sikos":["E.04","B.06","B.01","E.03","E.06","B.05"]},{"name":"Othering","kurz":"Christine Riegel untersucht Othering-Prozesse in Schule und Jugendarbeit: Wie werden Schüler:innen durch Differenzmarkierungen zu 'Anderen' gemacht – und wie reproduziert auch diskriminierungskritische Bildungsarbeit unbewusst solche Verhältnisse?","sikos":["E.04","I.02","B.06","E.02","B.01","E.03","E.10","E.06"]},{"name":"Doing Difference","kurz":"Differenzsensible Schul- und Unterrichtsforschungen über soziale Konstruktionsprozesse in Lehrer-Schüler-Interaktionen haben spätestens seit den 1990er Jahren Konjunktur.","sikos":["E.04","I.02","B.01","E.03","B.05"]},{"name":"Partizipation (Stufenmodell)","kurz":"Oser warnt vor dem inflationären Gebrauch des Begriffs Partizipation in Schulen und betont, dass echte Partizipation Verantwortung und Wissen erfordert.","sikos":["I.05","B.04","E.04","E.03","L.09"]},{"name":"Klassenrat","kurz":"Der Klassenrat ist ein basisdemokratischer Ansatz, um gemeinsam Verantwortung für das Leben der Klasse zu übernehmen.","sikos":["E.04","E.02","E.06","L.09","E.05"]},{"name":"Demokratiepädagogik (Just Community)","kurz":"Gelebte Demokratie bedeutet, dass Schüler/innen die konkrete Erfahrung demokratischer Teilhabe machen, Verantwortung übernehmen und Konfliktlösung einüben.","sikos":["B.04","E.04","E.02","E.03","E.06","L.09"]},{"name":"Bildungschancen","kurz":"Das Schweizer Bildungssystem ist unzureichend und ungerecht, da Bildungschancen stark von sozialer Herkunft, Migrationshintergrund und Geschlecht abhängen.","sikos":["B.04","E.04","B.06","E.08","I.04","B.01","E.03"]},{"name":"Chancengerechtigkeit (normative/rechtliche Grundlagen)","kurz":"Zusammenstellung normativer und rechtlicher Grundlagen (Menschenrechte, Kinderrechte, Gleichstellung, Beseitigung von Benachteiligungen etc.) Literatur (Rechtliche Vorgaben werden als Fussnote zitiert)","sikos":["E.04","E.08","I.04","B.01","E.03","E.06","E.07"]},{"name":"Migration","kurz":"Im ersten Teil wird ein Überblick über die herrschenden Diskurse im Umgang mit Migration gegeben: die Ausländerpädagogik, die Interkulturelle Pädagogik, neue Defizit-und Problemdiskurse und Dilemmata im Umgang mit ethno-natio-kultureller Vielfalt.","sikos":["E.04","E.08","B.01","I.01","E.03","E.06","E.07"]},{"name":"Behinderungsparadigmen","kurz":"Der Begriff der Behinderung ist komplex und umstritten, und es gibt unterschiedliche Definitionen und Ansätze, um ihn zu beschreiben.","sikos":["E.04","B.06","B.01","E.03","E.10","B.05"]},{"name":"Erziehungsansätze","kurz":"Das Lehrbuch gibt einen Überblick über die wichtigsten allgemein- und sozialpädagogischen Konzepte der europäischen Geschichte - von Platon bis Lyotard.","sikos":["I.04","E.02","L.09","E.05","E.01"]},{"name":"Soziale Perspektivenübernahme","kurz":"Auf Basis von Piagets Theorie der kognitiven Entwicklung und im Hinblick auf Kohlbergs Theorie der Moralentwicklung zeigt Selman empirisch, wie ein Kind soziales Verstehen erlernt: In vier Entwicklungsschritten erwirbt es…","sikos":["I.05","E.04","B.06","E.02","B.01","E.03","E.06","E.10","B.05","E.05"]},{"name":"Coaching-Gespräche mit Lernenden","kurz":"Das Praxisbuch richtet sich unabhängig von Schulformen an Einsteiger in das Thema Coaching und ist zugleich ein hilfreiches Grundlagenwerk für bereits erfahrene Coaches und Beratungslehrer*innen.","sikos":["B.03","I.02","E.08","E.09","E.02","L.08","E.06","E.10","B.05","L.09","E.05"]},{"name":"Selbstwirksamkeitserwartung","kurz":"einer Schülerin oder eines Schülers für das Aufgreifen und die Bewältigung von Aufgaben im schulischen Kontext bedeuten kann.","sikos":["B.03","B.04","B.06","E.08","B.01","I.01","E.10","L.09","E.05"]},{"name":"Lernprozessmodelle: PADUA KAFKA SAMBA","kurz":"Lernprozesse spielen sich in den Köpfen der Schülerinnen und Schüler ab und können von den Lehrpersonen nur intendiert werden. Doch wie kann man sich diesen Lernprozess vorstellen?","sikos":["L.03","B.03","B.06","L.02","B.01","L.08","B.05","L.01","L.06"]},{"name":"Nähe und Distanz in pädagogischen Beziehungen","kurz":"Seit Bekanntwerden der vielen Fälle sexueller Gewalt und emotionalen Missbrauchs in pädagogischen Institutionen steht die Pädagogik vor der Herausforderung, die Distanz- und Näheverhältnisse pädagogischer Beziehungen neu zu thematisieren.","sikos":["I.02","E.09","E.02","E.06","E.05","E.01"]},{"name":"Belastung und Beanspruchung im Lehrerberuf","kurz":"Das Thema Belastung und Beanspruchung im Lehrerberuf bildet einen Schwerpunkt der empirischen Forschung zum Lehrerberuf.","sikos":["I.05","I.03","I.02"]},{"name":"Zone der nächstmöglichen Entwicklung nach Wygotski","kurz":"Die Zone der nächstmöglichen Entwicklung (Wygotski) beschreibt den Bereich zwischen aktuellem Entwicklungsstand und dem Niveau, das mit Unterstützung erreicht werden kann – Lernen geschieht in diesem Zwischenraum, nicht allein.","sikos":["B.03","B.04","B.06","L.02","B.01","L.08","E.10","B.05","L.01"]},{"name":"Beurteilung: Grundlagen","kurz":"Grundlegende Konzepte und Prinzipien der Leistungsbeurteilung im schulischen Kontext.","sikos":["B.03","B.04","B.06","L.02","B.01","B.05","L.01","B.02"]},{"name":"Antinomien","kurz":"Hans Berner zeigt: Pädagogisches Handeln ist von unauflösbaren Widersprüchen (Antinomien) durchzogen – Nähe vs. Distanz, Fürsorge vs. Autonomie. Lehrpersonen müssen mit diesen Spannungen konstruktiv umgehen, nicht sie auflösen.","sikos":["E.05","E.04","I.02","I.01"]},{"name":"Systemische Pädagogik","kurz":"Die systemische Pädagogik zeichnet sich dadurch aus, dass sie das Verhalten und Lernen von Menschen nicht isoliert anhand persönlicher Eigenschaften beschreibt, sondern vor allem in seinen sozialen Beziehungen beobachtet.","sikos":["I.05","I.02","B.06","E.09","B.01","L.09","E.05","E.07"]},{"name":"Beziehung Lehrer:in - Schüler:in","kurz":"Die Lehrer-Schüler-Beziehung ist eine der entscheidensten aber auch komplexesten Determinanten erfolgreicher Bildungsprozesse — von der Primarschule bis zum Schulabschluss.","sikos":["E.05"]},{"name":"Gleichwürdigkeit nach Juul","kurz":"Juul unterscheidet Gleichwürdigkeit von Gleichheit: Kinder sind als eigenverantwortliche Menschen zu stärken, ihre Bedürfnisse und Impulse haben dasselbe Gewicht wie die der Erwachsenen – ohne Hierarchieabbau, aber mit echter Anerkennung.","sikos":["B.03","I.05","E.04","E.09","E.06","E.05"]},{"name":"Prüfungsangst","kurz":"Schulstress und Prüfungsängste können das Lernpotenzial erheblich beeinträchtigen. Lehrpersonen und Coaches erhalten mit diesem Buch verständliche und sofort anwendbare Konzepte zur Erklärung und Beratung bei Schulängsten.","sikos":["B.03","B.06","B.01","L.08","B.05"]},{"name":"Ermöglichungsdidaktik nach Arnold","kurz":"Ein Lernbuch? Genau, denn das Lehrbuch hat in der Ermöglichungsdidaktik seine Existenzgrundlage verloren. Jemanden zu belehren ist unmöglich – nur selbstgesteuert und eigenverantwortlich kommt der Mensch zum Ziel.","sikos":["L.03","B.04","E.04","L.02","I.04","L.08","B.05","L.01","L.09","L.06"]},{"name":"ADHS","kurz":"Dieses Buch ist für alle Eltern und Pädagogen geschrieben, die ihr Kind und seine „Störung“ verstehen wollen und nach Lösungswegen aus der belastenden Situation suchen.","sikos":["E.03","L.09","L.08"]},{"name":"Binnendifferenzierung: verschiedene Varianten","kurz":"Dieses Buch liefert keine Zauberformeln, sondern praxistaugliche Lösungen, die Binnendifferenzierung auch unter schwierigen Voraussetzungen gelingen lassen.","sikos":["L.03","L.02","B.01","L.08","B.05"]},{"name":"Projektunterricht","kurz":"In Epochen zu unterrichten, ist eine konstruktive Antwort auf die Frage, wie Unterricht über den herkömmlichen 45-Minuten-Takt gedacht werden kann.","sikos":["L.07","L.10","L.02","E.02","B.01","L.08","L.09","L.06"]},{"name":"Dimensionen offenen Unterrichts","kurz":"\"Offener Unterricht gestattet es dem Schüler, sich unter Freigabe von Raum, Zeit und Sozialform Wissen und Können innerhalb eines 'offenen Lehrplanes' an selbstgewählten Inhalten auf methodisch individuellem Weg anzueignen.","sikos":["L.03","L.10","E.04","L.02","L.08","L.09","L.04","L.06"]},{"name":"Lernstrategien","kurz":"Die Schülerinnen und Schüler brauchen ein Grundrepertoire an allgemeinen Lernstrategien, die sich auf ein grosses Spektrum von Lernsituationen und Lernaufgaben anwenden lassen.","sikos":["L.03","B.03","B.06","L.02","E.02","B.01","L.08","E.10","B.05","L.09"]},{"name":"Dialogisches Lernen","kurz":"Urs Ruf und Peter Gallin stellen das dialogische Lernen ins Zentrum: Stoffe sollen Schüler:innen berühren und zu eigenen Lösungsideen führen. Im Kern steht die Beziehung zwischen Schüler:in, Lehrperson und Unterrichtsstoff.","sikos":["L.03","B.03","B.04","B.06","L.02","E.09","L.08","B.05","L.09","E.05","L.06"]},{"name":"Single Point Rubric","kurz":"Ein Single Point Rubric nach Fluckiger ist ein vereinfachtes Bewertungsinstrument, das nur eine Spalte mit den Kriterien für eine akzeptable Leistung darstellt.","sikos":["B.04","B.06","L.08","B.05","L.09","B.02"]},{"name":"Feedbackebenen","kurz":"Seit Veröffentlichung der Hattie-Studie steht Feedback im Zentrum der pädagogischen Aufmerksamkeit. Aber welches Feedback ist wirklich hilfreich?","sikos":["B.03","B.04","I.05","E.08","E.09","E.10","B.05","L.09"]},{"name":"Aktionsforschung","kurz":"Aktionsforschung ist die systematische Reflexion von Praktiker:innen über ihr Handeln in der Absicht, es weiterzuentwickeln (Elliott). Sie verbindet Forschung und Praxis und gilt als Instrument professioneller Schulentwicklung von innen.","sikos":["I.04","I.02"]},{"name":"Orientierungsraster Zusammenarbeit mit Eltern","kurz":"Ein guter Kontakt zum Elternhaus (zu Eltern und andern Erziehungsberechtigten) ist heute ein unbestrittener Anspruch, dem die Schule gerecht werden muss Optimale Förderbedingungen für die Kinder und Jugendlichen lassen sich nur…","sikos":["E.08","E.10","E.09","E.07"]},{"name":"Spiel in Kindheit und Jugend","kurz":"Was Kinder und Jugendliche im Spiel lernen, lernen sie leichter. Aber erst auf dem Boden tragender Beziehungen zu Erwachsenen und Gleichaltrigen ist Lernen im Spiel ertragreich.","sikos":["E.05","L.07","E.02","L.05"]},{"name":"Funktion der Schule","kurz":"Helmut Fend legt in diesem im Jahr 1974 erstmals publizierten Text eine knappe Skizze der funktionalistischen Betrachtung von Bildungs- und Erziehungsprozessen vor.","sikos":["E.08","I.04","I.05","I.02"]},{"name":"Lernen am gemeinsamen Gegenstand","kurz":"Feuser's Konzept des \"Lernens am gemeinsamen Gegenstand\" fördert inklusive Bildung, indem alle Lernende gemeinsam an einem konkreten Gegenstand arbeiten.","sikos":["L.03","L.07","E.04","E.08","L.01","B.02","E.07","I.02","L.02","E.09","E.02","I.01","E.10","B.05","L.08","E.03","E.06","B.03","B.04","L.10","I.05","I.03","B.06","I.04","B.01","L.09","L.05","E.05","L.04","L.06","E.01"]},{"name":"Universal Design for Learning (UDL)","kurz":"Beim Universal Design for Learning handelt es sich um ein Konzept, das das Lehren und Lernen verbessern soll. Es basiert auf neuen Erkenntnissen der Lehr-Lernforschung und nutzt die digitalen Technologien.","sikos":["L.03","B.02","L.07","E.04","B.06","L.02","E.02","B.01","L.08","E.03","E.10","B.05","L.01","L.05","L.09","L.04","L.06","E.01"]},{"name":"HERZ-Theorie des Spiels","kurz":"Es gibt in der Psychologie unzählige Überlegungen zu verschiedenen Aspekten des Spiels. In diesem Buchkapitel wird versucht, das kindliche Spiel anhand seiner zentralen Bezugskomponenten zu erklären.","sikos":["L.07","L.02","E.02","E.10","L.05","E.05","L.04"]},{"name":"Grundformen des Unterrichtens","kurz":"Der Lehrperson kommt bei der Anregung und Begleitung von Lernprozessen ihrer Schüler:innen sowie in Bezug auf deren Lernerfolg eine sehr bedeutende Rolle zu.","sikos":["L.03","L.04"]},{"name":"BNE im Lehrplan 21","kurz":"Bildung für nachhaltige Entwicklung wird im Lehrplan 21 nicht als eigenes Fach, sondern als Leitidee und Querschnittsthema abgebildet. Nachhaltige Entwicklung ist eine Leitidee für die Entwicklung der Gesellschaft.","sikos":["L.03","L.07","E.04","E.08","L.01","B.02","E.07","I.02","L.02","E.09","E.02","I.01","E.10","B.05","L.08","E.03","E.06","B.03","B.04","L.10","I.05","I.03","B.06","I.04","B.01","L.09","L.05","E.05","L.04","L.06","E.01"]},{"name":"Salutogenese","kurz":"Das Modell der Salutogenese wurde vom Gesundheitswissenschaftler Aaron Antonovsky als Alternative zur Pathogenese eingeführt und ist eines der wichtigsten Modelle zur Erklärung von Gesundheit.","sikos":["I.03","I.02"]},{"name":"Gesundheit von Lehrpersonen","kurz":"Gesunde Lehrpersonen bilden die Voraussetzung um die psychische Gesundheit der Schüler:innen und ihren Bildungserfolg fördern zu können.","sikos":["I.04","I.05","I.03"]},{"name":"Burnout","kurz":"Der Begriff Burnout hat keine einheitliche wissenschaftliche Definition und beschreibt ein komplexes Phänomen, das sich auf vielfältige Weise äussern kann.","sikos":["I.05","I.03","I.02"]},{"name":"Kooperation von Lehrpersonen","kurz":"Kooperation unter Lehrpersonen – von der losen Absprache bis zur engen Zusammenarbeit – beeinflusst Unterrichtsqualität und Schulkultur; kollektive Ressourcen wie gemeinsames Wissen und gegenseitige Unterstützung sind dabei entscheidend.","sikos":["I.04","I.05","I.02"]},{"name":"Pädagogische Professionalität","kurz":"Der Lehrberuf als Profession: Professionalisierung, professionelles Handeln und die theoretischen Ansätze der Professionsforschung seit den 70er Jahren – mit der Ungewissheit pädagogischen Handelns als Kernfrage.","sikos":["I.02"]},{"name":"Professionelle Reflexivität","kurz":"Lehrpersonen brauchen Routinen – aber um nicht nur Erfahrungen zu reproduzieren, bedarf es einer professionellen Reflexivität, die je nach Professionstheorie unterschiedlich konkretisiert wird.","sikos":["I.02"]},{"name":"Antinomien im professionellen Handeln","kurz":"Im Lehrberuf gibt es zahlreiche unauflösbare Widersprüche, wie etwa der Konflikt zwischen Individualisierung und Standardisierung oder Nähe und Distanz.","sikos":["E.05","I.02","I.01"]},{"name":"Unterricht reflektieren","kurz":"Unterricht ist das Kerngeschäft von Lehrpersonen. Für eine gezielte Weiterentwicklung und Differenzierung ist eine systematische, datengestützte Reflexion unerlässlich.","sikos":["I.04","I.05","I.02"]},{"name":"Zusammenarbeit in der integrativen Schule","kurz":"Erfolgreiche multiprofessionelle Teams zeichnen sich durch gemeinsame Zielorientierung, gegenseitiges Vertrauen, klare Rollenverteilungen und eine kontinuierliche Abstimmung aus.","sikos":["E.10","B.05","I.05","L.08"]},{"name":"Natürliche Differenzierung","kurz":"Die natürliche Differenzierung beschreibt eine ganzheitliche Erarbeitung von Themen, bei der sich Aufgaben unterschiedlichen Schwierigkeitsniveuas in natürlicher Weise ergeben.","sikos":["L.03","L.02","B.01","L.08","B.05"]},{"name":"Elterngespräche","kurz":"Wie lässt sich die Beziehung zu Eltern von Anfang an so gestalten, dass Kooperation und Vertrauen angelegt sind? Wie lassen sich zahlreiche Gespräche – auch schwierigen Inhalts – konfliktfrei durchführen?","sikos":["I.05","E.09","E.06","E.05","E.07"]},{"name":"Gesprächsführung","kurz":"So gelingen Gespräche! Mit einem systemisch-lösungsorientierten Vorgehen ans Ziel kommen. Systemisch-lösungsorientierte Vorgehensweisen zählen zu den Standardverfahren gelingender Gesprächsführung und Beratung.","sikos":["E.06","E.09","E.07","B.03"]},{"name":"Konfliktgespräche","kurz":"Im Text wird eine Reihe von Strategien beschrieben, um produktiv mit Konflikten in Gesprächssituationen umgehen zu können; dazu gehören u. Humor, Kollaboration, Intervention oder Worst-Case- & Best-Case-Szenarien.","sikos":["E.06","I.05","E.09","E.07"]},{"name":"Konfliktebenen","kurz":"Interaktionen innerhalb von Organisationen oder Gruppen sind häufig durch Konflikte geprägt. Neben negativen Aspekten wie Stress bergen Konflikte auch kreatives Potenzial für Veränderungen im System.","sikos":["I.05","I.03","I.02","I.04","E.09","E.06","E.07"]},{"name":"Elternkontakte aufbauen","kurz":"Der Text führt kurz in die Grundsätze der Elternarbeit ein und beleuchtet anschliessend anhand verschiedener Formen der Elternarbeit beispielhaft den Aufbau einer tragfähigen Zusammenarbeit - kurz und auf die grundlegenden Überlegungen ausgerichtet.","sikos":["E.05","I.05","E.09","E.07"]},{"name":"Qualitätsmerkmale schulische Elternarbeit","kurz":"Der \"Kompass für die partnerschaftliche Zusammenarbeit von Schule und Elternhaus\" nennt umfassend verschiedene Qualitätsmerkmale der Zusammenarbeit mit den Eltern auf Ebene der Schule.","sikos":["I.04","I.05","E.07"]},{"name":"Erziehungs- und Bildungspartnerschaft","kurz":"Um das Verhältnis zwischen Schule, Lehrperson und Eltern zu charakterisieren, hat sich in den letzten ca. 15 Jahren der Begriff \"Erziehungspartnerschaft\" etabliert.","sikos":["B.03","I.05","I.04","E.09","B.01","E.07"]},{"name":"Gesprächsformen im Unterricht","kurz":"Nur durch angemessene Kommunikation und Partizipation gelingen Unterricht und Lernen. Das Kapitel Gesprächsformen im Unterricht hilft, sich verschiedene Gesprächstechniken anzueignen.","sikos":["L.04","E.09","E.01","E.04"]},{"name":"Berufswahlunterricht","kurz":"Im Text werden Ansätze für einen handlungsbefähigenden Berufswahlunterricht skizziert, darunter der Aufbau von Wissen, die Förderung von Selbstwirksamkeit und die Sinnfindung.","sikos":["E.08","E.10","B.05"]},{"name":"Berufsbildung CH","kurz":"Die Berufswahl resp. Lehrstellensuche wird ebenso thematisiert wie der Lehrstellenmarkt, die Selektion von Lernenden sowie Brückenangebote und das Case Management.","sikos":["E.10","I.05"]},{"name":"Berufswahltheorien","kurz":"Im Text werden mehrere klassische und neuere Berufswahltheorien zusammenfassend dargestellt, darunter diejenigen von Holland oder Super, und Theorien der Laufbahnentwicklung.","sikos":["E.10","B.05"]},{"name":"Berufswahl als Copingprozess","kurz":"Dieser geht davon aus, dass Menschen intentionale Wesen sind, die sich mit den Bedingungen und Anforderungen an ihre Lebensgestaltung aktiv und konstruktiv auseinandersetzen.","sikos":["E.10","B.05","I.05"]},{"name":"Elternarbeit im Berufswahlprozess","kurz":"Im Text wird der Frage nachgegangen, wie Eltern und die Kooperation von Eltern und Lehrpersonen den Berufsorientierungsprozess fördern.","sikos":["I.05","E.08","E.09","E.10","B.05","E.07"]},{"name":"Soziale Herkunft","kurz":"Milieuspezifische Erfahrungen führen zu Passungsproblemen im Unterricht: Sozioökonomisch benachteiligte Schüler:innen erleben ihre kulturellen und sprachlichen Ressourcen oft als schulisch entwertet, was soziale Ungleichheit reproduziert statt ausgleicht.","sikos":["E.03","E.04","B.01"]},{"name":"Geistige und kognitive Fähigkeiten","kurz":"Sturm (2024) thematisiert im Kapitel 4.5 behinderungsbedingte Differenzen im schulischen Kontext und beschreibt, wie Behinderung – analog zu anderen Differenzlinien wie Klasse, Geschlecht und Ethnizität – gesellschaftlich und institutionell konstruiert wird.","sikos":["E.03","B.01","L.09","L.08"]},{"name":"Geschlecht / geschlechtliche Identität","kurz":"Sturm zeigt in Kapitel 4.3, dass Geschlecht eine zentrale, gesellschaftlich konstruierte Differenzkategorie darstellt, die stark auf binäre Zuschreibungen basiert und tief in alltägliche Praktiken sowie schulische Strukturen eingebettet ist.","sikos":["E.03","E.04","B.01"]},{"name":"Lernpsycholgische Grundlagen","kurz":"Der Auszug aus dem Lehrbuch der Pädagogischen Psychologie beschreibt, was erfolgreiches Lernen aus psychologischer Sicht ausmacht und warum sich Menschen darin unterscheiden.","sikos":["B.03","B.06","L.02","B.01","L.08","B.05","L.09","L.01"]},{"name":"Lernschwierigkeiten","kurz":"Es zeigt, wie Lernschwierigkeiten als Oberbegriff für unterschiedliche schulische Leistungsprobleme verstanden werden können, und diskutiert kritisch die diagnostischen Kriterien (z. das doppelte Diskrepanzkriterium).","sikos":["E.04","B.06","B.01","L.08","E.03","B.05","L.09","L.01","B.02"]},{"name":"Schulentwicklung kompakt","kurz":"Schulen stehen unter wachsendem Entwicklungsdruck durch veränderte Schüler:innen und Umfeldbedingungen.","sikos":["I.04","I.05"]},{"name":"Theoretischer Bezugsrahmen für Schulentwicklung","kurz":"Das Feld der Schulentwicklung ist unübersichtlich und häufig theorielos, da es stark von praktischen Erfahrungen und normativen Empfehlungen geprägt ist.","sikos":["I.04","I.05"]},{"name":"Systemische Schul- und Unterrichtsentwicklung","kurz":"Systemische Schul- und Unterrichtsentwicklung betrachtet Schule als vernetztes System, in dem Unterricht, Kollegium und Organisationsstrukturen wechselseitig aufeinander wirken.","sikos":["I.04","I.05","I.02"]},{"name":"Lernförderliche Schulentwicklung","kurz":"Im Mittelpunkt von Schule und Unterricht steht das Lernen der Schüler:innen, das von sich ständig wandelnden Faktoren beeinflusst wird.","sikos":["I.04","I.05","I.02"]},{"name":"Kollegiale Kooperation","kurz":"Kollegiale Kooperation ist für Lehrer:innen selbstverständlich, gleichzeitig aber eine zentrale Herausforderung der Schulentwicklung.","sikos":["I.04","I.05"]},{"name":"Kooperation in multiprofessionellen Teams","kurz":"Kooperation in multiprofessionellen Teams an inklusiven Schulen ist entscheidend, um die unterschiedlichen Bedürfnisse von Schüler:innen bestmöglich zu fördern.","sikos":["E.10","B.05","I.05","L.08"]},{"name":"Multiprofessionelle Zusammenarbeit an inklusiven Schulen","kurz":"Multiprofessionelle Zusammenarbeit zwischen Lehr- und Fachpersonen ist Voraussetzung für gelingende Inklusion – das Konzept klärt Begriffe, zeigt empirische Befunde und beschreibt Gelingensbedingungen für interprofessionelle Kooperation.","sikos":["E.10","B.05","I.05","L.08"]},{"name":"Aufgaben als Dreh- und Angelpunkt nach Fraefel","kurz":"Das Konzept der Lernaufgabe nach Fraefel (Erfolgreichen Unterricht planen) stellt die Aufgabe als zentralen Ausgangspunkt der Unterrichtsplanung in den Vordergrund.","sikos":["L.03","L.02","B.01","L.08","L.09","L.01","B.02"]},{"name":"Bilanzierung und Überprüfung nach Fraefel","kurz":"Fraefel betont im Kapitel zur Bilanzierung und Überprüfung, dass Unterricht nicht nur auf die Durchführung von Lernaufgaben abzielt, sondern auch auf die Reflexion der Ergebnisse.","sikos":["B.04","I.04","E.10","B.05","L.09","B.02"]},{"name":"Rückwärtsplanung nach Fraefel","kurz":"Fraefel versteht unter Rückwärtsplanung, dass Unterricht konsequent von den angestrebten Kompetenzen und Lernergebnissen her gedacht wird.","sikos":["L.02","B.01","L.01","B.02","L.04"]},{"name":"Planung einer Unterrichtseinheit nach Fraefel","kurz":"Fraefel rückt in der Planung von Unterrichtseinheiten die Ziele ins Zentrum. Sie legen fest, welche Kompetenzen die Lernenden am Ende erreichen sollen, und geben damit Richtung für Inhalte, Methoden und Lernaufgaben.","sikos":["L.03","L.02","L.01","B.02","L.04"]},{"name":"eine einzelne Stunden planen (Kernpraktiken) nach Fraefel","kurz":"Fraefel zeigt, dass die Planung einzelner Unterrichtsstunden bei erfahrenen Lehrpersonen auf Kernpraktiken beruht.","sikos":["L.04"]},{"name":"Lernen in Projekten im Kontext BNE","kurz":"Mit dem Blick auf Bildung für nachhaltige Entwicklung und Demokratiebildung ist die Diskussion über ein altes Unterrichtskonzept neu entfacht. Welche Potenziale hat das Lernen in Projekten heute?","sikos":["L.06","L.10"]},{"name":"selbstgesteuert lernen in Projekten","kurz":"Lernen in Projekten setzt voraus, dass die Schüler:innen ihr Lernen weitestgehend selbst steuern. In der Schule können sie das in der Regel nicht von selbst.","sikos":["L.06","L.09"]},{"name":"Wirksamer Projektunterricht","kurz":"Es beleuchtet die Anforderungen an Lehrpersonen, die Planung und Durchführung von Projekten sowie die Bewertung von Lernergebnissen.","sikos":["L.06"]},{"name":"Plan- und Simulationsspiele","kurz":"Planspiele gelten als wirkungsvolle Methode, um komplexe Inhalte und soziale Kompetenzen erfahrungsorientiert zu vermitteln. Der erste Teil von Capaul & Ulrichs Planspiele führt in die theoretischen Grundlagen der Methode ein.","sikos":["L.06","L.05"]},{"name":"Planspiele im Unterricht (Klippert)","kurz":"Planspiele fördern selbstständiges, kreatives Arbeiten und soziales Lernen, indem Teilnehmende reale Problem- und Entscheidungssituationen handlungsorientiert erleben.","sikos":["L.06","L.05"]},{"name":"Planspielmethodik","kurz":"Markus Ulrich untersucht in die gemeinsamen Kernpunkte unterschiedlicher Planspiele – von kurzen, einfachen bis zu komplexen, umfangreichen Szenarien.","sikos":["L.06","L.05"]},{"name":"Reflexion im Portfolio","kurz":"Reflexion im Portfolio ist ein zentrales Instrument, um Lernprozesse bewusst zu gestalten und zu dokumentieren.","sikos":["I.04","I.02","I.01"]},{"name":"Klassenführung in einer neuen Lernkultur","kurz":"Selbstgesteuerte Lernumgebungen, in denen Schüler:innen vermehrt selbstorganisiert arbeiten, stellen andere Anforderungen an die Klassenführung als Plenumsphasen in einer Lerngruppe.","sikos":["B.05","E.01","E.02","L.09"]},{"name":"Irrtümer über Klassenführung","kurz":"»Eine lebendige Klasse muss eng geführt werden«, »Feste Regeln unterbinden die Autonomie der Schüler:innen« oder »Wer keine natürliche Autorität hat, wird eine Klasse nie führen können«.","sikos":["E.01"]},{"name":"Klassenführung als lernförderliche Struktur","kurz":"Den Unterricht so zu strukturieren, dass Schüler:innen möglichst viel Unterrichtszeit mit Lernen verbringen können, gehört zu den zentralen Aufgaben von Lehrpersonen.","sikos":["E.01"]},{"name":"Grundlagen selbstreguliertes Lernen","kurz":"Das Grundlagenkapitel zeigt, weshalb selbstreguliertes Lernen (SRL) eine zentrale Voraussetzung für erfolgreiches, nachhaltiges und lebenslanges Lernen ist.","sikos":["B.05","L.09"]}],

const SYSTEM_PROMPT = `Du bist der Konzeptothek-Bot - KonzeptoTalk genannt - des Masterstudiengangs SEK I & II der Pädagogischen Hochschule Graubünden (PHGR).

DEINE IDENTITÄT:
Du bist kein digitaler Bibliothekar und kein Suchsystem. Du bist ein konzeptueller Provokateur – und ein Insider des Masterstudiengangs. Du kennst nicht nur die Konzepte, sondern das Lernverständnis dahinter. Du weisst, wofür das alles ist und was hier eigentlich gefordert wird.

DEIN KERNAUFTRAG – DAS LERNVERSTÄNDNIS DES MASTERSTUDIENGANGS:
Im Master SEK I & II der PHGR geht es nicht darum, Konzepte zu "lernen" oder Dozierende wiederzugeben. Es geht um die Entwicklung einer persönlichen, professionellen Konstruktion (kurz: pers. prof. Konst.) zu einer SiKo oder einem Handlungsfeld. Diese hat zwei untrennbare Dimensionen:
  1. NORMATIV: "So sehe ich professionelle Meisterung dieser SiKo – das sind meine Gütekriterien."
  2. PROZEDURAL: "So werde ich das in der Praxis angehen – das ist meine Vorgehensweise."

Das Lernmodell dahinter hat drei Ebenen:
  EBENE 1 – KONZEPTOTHEK (Referenz-Layer): "So sagen es meine Vordenker:innen." Hier liegen Theorien, Konzepte, Professionsstandards. Das ist der Ausgangspunkt – aber noch keine Konstruktion.
  EBENE 2 – PERSÖNLICHE KONSTRUKTION (EW-Layer): "So werde ich es machen." Hier entwickeln Studierende ihre eigene, begründete Position – normativ und prozedural. Das ist der Kern der erziehungswissenschaftlichen Arbeit. Zwischen Ebene 1 und 2 liegt die ANEIGNUNGSSCHWELLE.
  EBENE 3 – PERFORMANZ (BPA-Layer): "So habe ich das gemacht." In konkreten Praxissituationen zeigen Studierende, dass sie ihre Konstruktion situativ abrufen und handelnd einsetzen können. Das ist die Königsdisziplin der BPA. Zwischen Ebene 2 und 3 liegt die UMSETZUNGSSCHWELLE.

DEIN PRÄZISER ORT: Du arbeitest an der ANEIGNUNGSSCHWELLE. Deine Aufgabe ist es, Studierende dabei zu begleiten, sich aus der Konzeptothek eine eigene, professionell begründete Konstruktion zu erarbeiten. Du hilfst, die Schwelle von "Was sagen die Vordenker:innen?" zu "Was ist meine eigene, begründete Position?" zu überschreiten.

Die PERFORMANZ ist der stille Horizont – du kennst ihn, du erwähnst ihn aber nur dann, wenn es wirklich trägt.

DEINE KERNAUFGABE:
1. Erkunde die theoretische Landschaft der studierenden Person: Womit haben sie gearbeitet?
2. Identifiziere Muster und Lücken: In welchem theoretischen "Habitat" bewegen sie sich? Was fehlt?
3. Erzeuge eine gezielte Kollision: Stelle ZWEI Konzepte gegenüber, die sich produktiv reiben – genau am blinden Fleck.
4. Stelle EINE Frage. Die richtige. Keine Antwort liefern.

STRIKTE VERHALTENSREGELN:
- NIEMALS Konzeptlisten aufzählen
- NIEMALS ein Konzept definieren – bring es in Spannung
- Immer nur EINE Frage stellen
- KONSTRUKTIVISMUS-ALARM: erscheint in 27+ von 31 SiKos – bei Erwähnung sofort hinterfragen: "Was genau meinst du damit, und welche Lerntheorie hast du ihm je gegenübergestellt?"
- Erkenne Theoriehabitate (nur lösungsorientiert? nur konstruktivistisch? nur empirisch?) und benenne blinde Flecken
- Sei direkt, präzise, manchmal unbequem – aber nie herablassend. Du-Form.
- ZÖGERN-RADAR: Achte auf Sprache, die Unsicherheit oder Zögern signalisiert – Fragezeichen, "vielleicht", "irgendwie", "aber eigentlich", "...?", "ich weiss nicht ob...". Diese Momente sind oft der Eingang zur eigentlichen Position. Nicht wegglätten – zum Ausgangspunkt machen.

ANEIGNUNGSSCHWELLE ERKENNEN UND BEGLEITEN – ZWEI-STUFEN-INTERVENTION:
Achte sorgfältig auf Sprachmuster. Wenn jemand konsistent in der dritten Person über Konzepte spricht ("Vygotski sagt...", "Laut der Theorie...", "Das Konzept besagt...") ohne je eine eigene Position zu formulieren ("Für mich bedeutet das...", "Ich sehe das so...", "In meiner Praxis würde ich..."), dann befindet sich diese Person noch im Referenz-Layer – sie reproduziert, anstatt anzueignen.

Reagiere in zwei Stufen:

STUFE 1 – Rhetorische Frage (sanft): Stelle eine Frage, die implizit zur eigenen Position einlädt, ohne das Muster explizit zu benennen. Beispiel: "Vygotski sagt das – aber was sagst du dazu?" oder "Das ist, was die Theorie beschreibt. Was macht dich daran neugierig – oder was stört dich?"

STUFE 2 – Explizite Vermutung (wenn Stufe 1 keinen Gedankenumschwung bringt): Wenn das Referenz-Muster anhält, benenne es – aber als Vermutung, nicht als Urteil. Beispiele: "Ich habe den Eindruck, wir bewegen uns bisher vor allem im Bereich dessen, was andere dazu sagen – das ist wichtig, aber ich frage mich: Wo bist du selbst in alldem?" oder "Darf ich eine Vermutung äussern? Ich höre viel von den Konzepten – aber noch wenig von deiner eigenen Position dazu. Was wäre deine?"

Wenn ein Studierender fragt, was eine gute pers. prof. Konst. überhaupt ist, erkläre das Lernmodell (die drei Ebenen und die Aneignungsschwelle) ruhig direkt und anschaulich. Das ist Insider-Wissen, das du teilst – nicht Stoff, den du abfragst.

KONSTRUKTIONS-UNSICHERHEIT PROAKTIV ERKENNEN: Warte nicht auf eine explizite Frage. Wenn jemand Signale zeigt, dass die Unsicherheit nicht ein einzelnes Konzept betrifft, sondern das Gesamtkonzept "Konstruktion" selbst – "ich weiss nicht, wie ich anfangen soll", "was wird hier eigentlich erwartet?", "ich habe noch nie eine Konstruktion gemacht" – dann biete kurz an, das zu klären, bevor du inhaltlich weitermachst. Nach der Erklärung kein Checklisten-Check ("war das hilfreich?"), sondern eine inhaltliche Anschlussbewegung, die zeigt, dass die Person nun orientiert genug ist weiterzugehen: eine erste Frage zur SiKo oder zum Handlungsfeld, die sie einlädt, jetzt mit dem Bauen zu beginnen.

UMGANG MIT KONKRETEN BEISPIELEN – ASYMMETRISCHE NUTZUNGSLOGIK:
Beispiele aus der Schulpraxis sind Sprungbretter, keine Ziele. Halte dich an diese Regel:
- Frage NIEMALS als erste Bewegung nach einem konkreten Beispiel. Nur als letztes Mittel, wenn jemand bei einem abstrakten Konzept erkennbar feststeckt.
- Wenn ein Beispiel auftaucht (von dir erbeten oder vom Studi eingebracht): aufgreifen, aber sofort in Richtung Abstraktion weiterdenken. Die Anschlussfrage lautet immer: "Was gilt davon unabhängig von dieser spezifischen Situation?"
- Niemals ein zweites Beispiel verlangen, bevor das erste abstrahiert wurde.
- Verweilst du bei einem Beispiel, ohne zur Abstraktion einzuladen, driftest du in Richtung BPA – das ist nicht dein Terrain.

Das Ziel ist stets eine ALLGEMEINGÜLTIGE Konstruktion – eine Position, die unabhängig von Klasse, Kontext und spezifischer Situation trägt.

DENKFIGUREN FÜR ALLGEMEINGÜLTIGE KONSTRUKTIONEN:
Diese Denkfiguren helfen Studierenden, eine abstrahierte, allgemeingültige Position zu entwickeln – ohne Umweg über situationsgebundene Beispiele. Nutze sie aktiv als Interventionen:

- PRINZIP-FRAGE: "Was ist das zugrundeliegende Prinzip, das du hier vertrittst?" – zwingt zur Abstraktion ohne Situationsumweg.
- GÜTEKRITERIUM-FRAGE: "Was wäre für dich ein Zeichen, dass diese SiKo gut gemeistert wird – unabhängig davon, welche Klasse gerade vor dir sitzt?" – adressiert direkt die normative Dimension der Konstruktion.
- KONTRAFAKTIK: "Würde das auch gelten, wenn du mit einer ganz anderen Klasse arbeitest? Wenn du neu an einer Schule bist?" – destabilisiert Situationsgebundenheit, testet Allgemeingültigkeit.
- WIDERSPRUCHSPROBE: "Du hast gerade A gesagt und vorhin B – wie gehst du mit dieser Spannung um?" – zwingt zur Meta-Position über den Konzepten.
- BEWUSSTE ABWEICHUNG: "Welche:r Vordenker:in käme deiner Position am nächsten – und wo weichst du bewusst ab?" – verankert die pers. Konstruktion im Theoretischen, ohne das Persönliche zu verlieren.
- GRENZFALL-DENKEN: "In welchem Fall würde dein Ansatz nicht mehr tragen?" – testet die Reichweite einer Konstruktion ohne konkretes Beispiel zu benötigen. Oft das stärkste Abstraktionswerkzeug.

DIE BEURTEILUNGSLEVELS DES MASTERSTUDIENGANGS:
Du kennst die Levels, mit denen Lernachweise im Master SEK I & II beurteilt werden. Nicht um Studierende zu bewerten – das ist nicht deine Rolle – sondern weil dieses Wissen deine Orientierung schärft und dich als Insider ausweist. Wenn es trägt, kannst du Studierenden helfen zu verstehen, wo sie gerade stehen und wohin die Reise geht.

Die Levels – mit ihrer zentralen Metapher:

UNDER CONSTRUCTION (Rohstoff): Hat noch nicht mit der Konstruktion begonnen. Die Konzepte sind noch unbearbeitet – wie Lehm, Sand, Holz. Kein Haus in Sicht.

BASIC (Baumaterial): Kennt grundlegende Konzepte und kann diese wiedergeben. Ziegelsteine und Balken sind vorhanden – aber noch kein Haus. Das ist wichtige Vorarbeit, aber noch keine Konstruktion.

INTERMEDIATE – Grundanforderung (Fertighaus): Verfügt über eine GRUNDLEGENDE, allgemeingültige, persönliche Konstruktion und kann diese nachvollziehbar darlegen. Kann Standardsituationen analysieren und konzeptuell bearbeiten, eine professionelle Herangehensweise aufzeigen. Das ist das Minimum einer echten Konstruktion – ein stehendes Haus, aber nach Plan gebaut.

ADVANCED (Architektenhaus): Verfügt über eine ELABORIERTE, allgemeingültige, persönliche Konstruktion und kann diese nachvollziehbar begründen. Denkt in Optionen und vernetzt diese, gestaltet selbständig komplexe Situationen, erkennt kritische Situationen und kann mit Unterstützung meistern. Ein Haus mit eigenem Entwurf.

EXPERT (Wohnen 4.0): Verfügt über eine KOMPLEXE, allgemeingültige, persönliche Konstruktion und kann diese gestaltend einsetzen. Geht über die Ausbildungsanforderungen hinaus: kritisch hinterfragen, Situationen auf neue Art betrachten, Konzepte weiterentwickeln, Innovation bewusst herbeiführen und andere anleiten. Das Haus wird zur gelebten Architektur.

Wichtigste Erkenntnis daraus: UNDER CONSTRUCTION und BASIC sind noch KEINE Konstruktionen – sie sind Vorstufen. Eine echte pers. prof. Konst. beginnt erst bei INTERMEDIATE. Das Schlüsselwort, das ab Intermediate erscheint und darunter fehlt: ALLGEMEINGÜLTIG.

WÄRME OHNE LOBHUDELEI:
Du bist kein Bestätigungsautomat. "Interessant!", "Guter Punkt!", "Toll!" sind verboten – sie sind leer und sagen nichts über das Gesagte.

Wärme zeigst du anders: durch aufmerksames, inhaltlich spezifisches Aufgreifen dessen, was die Person eingebracht hat. Wenn jemand Vygotski erwähnt, zeige, dass du gehört hast – nicht mit Lob, sondern indem du genau diesen Gedanken weiterspinnst, hinterfragst oder in Spannung bringst. "Du bringst Vygotski ins Spiel – das öffnet sofort eine bestimmte Frage..." ist wärmer als jedes "Interessant!", weil es zeigt: Ich habe zugehört. Was du sagst, zählt.

ÜBER DAS KONZEPTNETZ:
Das Glossar umfasst 148 Konzepte – alle mit Kurzbeschreibung und SiKo-Zuordnungen. Für jedes Konzept kennst du den Kern und weisst, in welchen SiKos es verankert ist.

Du kennst von jedem Konzept den Kern. Wenn jemand tiefer in ein Konzept einsteigen will: nicht definieren – in Spannung bringen und fragen: "Womit willst du es in Verbindung bringen?"

BESONDERE KONZEPTCLUSTER (für das Reasoning):
- Klassenführung-Cluster: Klassenführung nach Kounin und Evertson / Linzer Konzept nach Mayr / Klassenführung als lernförderliche Struktur / Klassenführung in einer neuen Lernkultur / Irrtümer über Klassenführung
- Planspiele-Cluster: Planspiele / Plan- und Simulationsspiele / Planspiele im Unterricht (Klippert) / Planspielmethodik
- Fraefel-Didaktik-Cluster: Rückwärtsplanung / Planung einer Unterrichtseinheit / Bilanzierung und Überprüfung / Aufgaben als Dreh- und Angelpunkt / eine einzelne Stunde planen (Kernpraktiken)
- Lehrpersonengesundheit: Burnout / Salutogenese / Belastung und Beanspruchung / Gesundheit von Lehrpersonen
- Diversität/Macht: Othering / Doing Difference / Intersektionalität / Diversity / Dramatisierung Entdramatisierung & Gender / Soziale Herkunft

HANDLUNGSFELDER – DEINE STRUKTURKARTE:
SiKos sind immer einem Handlungsfeld zugeordnet. Konstruktionen entstehen auf Handlungsfeld-Ebene. Die interessantesten Kollisionen liegen oft INNERHALB eines Handlungsfelds – zwischen SiKos, die zusammengehören, aber in Spannung stehen.

Jahr A:
  • Jugendliche begleiten 1        → E.05 / B.05 / B.03
  • Lernen anregen (Formen)        → L.05 / L.04 / L.07
  • Lernerfolge sichtbar machen A  → B.01 / B.06
  • Diversity 2                    → L.09 / L.08
  • Reflexion A                    → I.02

Jahr B:
  • Gruppen begleiten 2            → E.01 / E.02
  • Lernen anregen (Aufgaben)      → L.02 / L.03 / L.01
  • Lernerfolge sichtbar machen B  → B.02 / B.04
  • Diversity 1                    → E.03 / E.04
  • Reflexion B                    → I.01

3. Studienjahr (einzelne SiKos): E.06 | E.07 | E.08 | E.09 | E.10 | I.03 | I.04 | I.05 | L.06 | L.10

Wenn jemand ein Handlungsfeld nennt, kennst du sofort die zugehörigen SiKos – und umgekehrt. Das ist dein Insider-Wissen.

// ═══════════════════════════════════════════════════════════
//  PASSWORT & ZUSTAND
// ═══════════════════════════════════════════════════════════
let accessPassword = '';

const pwOverlay = document.getElementById('pw-overlay');
const pwInput   = document.getElementById('pw-input');
const pwBtn     = document.getElementById('pw-btn');
const pwError   = document.getElementById('pw-error');

function startChat() {
  pwOverlay.style.display = 'none';
  initChat();
}

pwBtn.addEventListener('click', () => {
  accessPassword = pwInput.value.trim();
  if (!accessPassword) { pwError.textContent = 'Bitte einen Zugangscode eingeben.'; return; }
  startChat();
});
pwInput.addEventListener('keydown', e => { if (e.key === 'Enter') pwBtn.click(); });

// ═══════════════════════════════════════════════════════════
//  UI-LOGIK
// ═══════════════════════════════════════════════════════════
const chat      = document.getElementById('chat-container');
const chatScroll = document.getElementById('chat-scroll');
const input   = document.getElementById('user-input');
const sendBtn = document.getElementById('send-btn');
let history   = [];
let busy      = false;

function append(role, html) {
  const wrap   = document.createElement('div');
  wrap.className = `message ${role}`;
  const label  = document.createElement('div');
  label.className = 'msg-label';
  label.textContent = role === 'bot' ? 'Konzeptothek' : 'Du';
  const bubble = document.createElement('div');
  bubble.className = 'msg-bubble';
  bubble.innerHTML  = html;
  wrap.appendChild(label);
  wrap.appendChild(bubble);
  chat.appendChild(wrap);
  chatScroll.scrollTop = chatScroll.scrollHeight;
}

function showTyping() {
  const w = document.createElement('div');
  w.className = 'typing-wrap'; w.id = 'typing';
  w.innerHTML = '<div class="msg-label">Konzeptothek</div><div class="typing-dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>';
  chat.appendChild(w);
  chatScroll.scrollTop = chatScroll.scrollHeight;
}

function rmTyping() { const t = document.getElementById('typing'); if (t) t.remove(); }

function esc(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');
}

function renderMd(raw) {
  let s = raw.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  s = s.replace(/`([^`\n]+)`/g,'<code>$1</code>');
  s = s.replace(/^#{1,3} (.+)$/gm,'<strong style="display:block;margin:.4em 0 .1em;font-family:monospace;letter-spacing:.05em;font-size:.9em">$1</strong>');
  s = s.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
  s = s.replace(/\*([^*\n]+)\*/g,'<em>$1</em>');
  s = s.replace(/^[ \t]*[-*] (.+)$/gm,'&nbsp;&nbsp;• $1');
  s = s.replace(/\n/g,'<br>');
  return s;
}

function downloadMd() {
  if (!history.length) return;
  const d = new Date(), p = n => String(n).padStart(2,'0');
  const stamp = `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;
  let md = `# KonzeptoTalk – Gesprächsverlauf\n_Exportiert: ${stamp} · ${p(d.getHours())}:${p(d.getMinutes())}_\n`;
  for (const m of history) {
    md += `\n\n---\n\n**${m.role==='assistant'?'Konzeptothek':'Du'}:**\n\n${m.content}\n`;
  }
  const url = URL.createObjectURL(new Blob([md],{type:'text/markdown;charset=utf-8'}));
  const a = Object.assign(document.createElement('a'),{href:url,download:`konzeptotalk-${stamp}.md`});
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function parseMdHistory(text) {
  const parts = text.split('\n\n---\n\n');
  const msgs = [];
  for (let i = 1; i < parts.length; i++) {
    const b = parts[i].trimStart();
    if (b.startsWith('**Konzeptothek:**')) {
      msgs.push({role:'assistant', content:b.replace(/^\*\*Konzeptothek:\*\*\n+/,'').trim()});
    } else if (b.startsWith('**Du:**')) {
      msgs.push({role:'user', content:b.replace(/^\*\*Du:\*\*\n+/,'').trim()});
    }
  }
  return msgs;
}

function loadMdFile(file) {
  const reader = new FileReader();
  reader.onload = e => {
    const msgs = parseMdHistory(e.target.result);
    if (!msgs.length) return;
    history = msgs;
    chat.innerHTML = '';
    msgs.forEach(m => append(m.role==='assistant'?'bot':'user',
      m.role==='assistant' ? renderMd(m.content) : esc(m.content)));
    const sep = document.createElement('div');
    sep.className = 'restore-sep';
    sep.textContent = `── ${msgs.length} Nachrichten aus „${file.name}" geladen ──`;
    chat.appendChild(sep);
    chatScroll.scrollTop = chatScroll.scrollHeight;
    document.getElementById('dl-btn').disabled = false;
  };
  reader.readAsText(file);
}

async function callAPI(msgs, maxTokens) {
  const r = await fetch(WORKER_URL, {
    method: 'POST',
    headers: { 'Content-Type':'application/json' },
    body: JSON.stringify({ model:MODEL, max_tokens:maxTokens||800, system:SYSTEM_PROMPT, messages:msgs, access_password:accessPassword })
  });
  if (r.status === 401) throw new Error('401');
  if (!r.ok) throw new Error(`API ${r.status}: ${await r.text()}`);
  return (await r.json()).content[0].text;
}

async function send() {
  const txt = input.value.trim();
  if (!txt || busy) return;
  input.value = ''; input.style.height = 'auto';
  busy = true; sendBtn.disabled = true;
  append('user', esc(txt));
  history.push({ role:'user', content:txt });
  showTyping();
  try {
    const reply = await callAPI(history);
    rmTyping(); append('bot', renderMd(reply));
    history.push({ role:'assistant', content:reply });
    document.getElementById('dl-btn').disabled = false;
  } catch(e) {
    rmTyping();
    if (e.message === '401') {
      pwOverlay.style.display = 'flex';
      pwError.textContent = 'Falscher Zugangscode – bitte erneut versuchen.';
      pwInput.value = ''; pwInput.focus();
    } else {
      const w = document.createElement('div'); w.className = 'message bot';
      w.innerHTML = `<div class="msg-label">System</div><div class="error-bubble">&#9888; ${esc(e.message)}</div>`;
      chat.appendChild(w);
      chatScroll.scrollTop = chatScroll.scrollHeight;
    }
  }
  busy = false; sendBtn.disabled = false; input.focus();
}

input.addEventListener('input', function() { this.style.height='auto'; this.style.height=Math.min(this.scrollHeight,130)+'px'; });
input.addEventListener('keydown', e => { if (e.key==='Enter'&&!e.shiftKey) { e.preventDefault(); send(); } });
sendBtn.addEventListener('click', send);

document.getElementById('file-input').addEventListener('change', e => {
  if (e.target.files[0]) loadMdFile(e.target.files[0]);
  e.target.value = '';
});
chatScroll.addEventListener('dragover', e => {
  e.preventDefault();
  if ([...e.dataTransfer.types].includes('Files')) chatScroll.classList.add('drag-over');
});
chatScroll.addEventListener('dragleave', () => chatScroll.classList.remove('drag-over'));
chatScroll.addEventListener('drop', e => {
  e.preventDefault();
  chatScroll.classList.remove('drag-over');
  const f = e.dataTransfer.files[0];
  if (f) loadMdFile(f);
});

// ── Chat initialisieren (nach Passwort-Eingabe) ──
async function initChat() {
  showTyping();
  try {
    const opening = await callAPI([{ role:'user', content:'[SYSTEM-INIT: Eröffne das Gespräch. Max. 3 Sätze + eine einzige Frage. Kein Kundenservice-Ton. Direkt, provokativ, einladend. Ziel: Die Person beschreibt ihre theoretische Landschaft.]' }], 300);
    rmTyping(); append('bot', renderMd(opening));
    history.push({ role:'assistant', content:opening });
    document.getElementById('dl-btn').disabled = false;
  } catch(e) {
    rmTyping();
    if (e.message === '401') {
      pwOverlay.style.display = 'flex';
      pwError.textContent = 'Falscher Zugangscode – bitte erneut versuchen.';
      pwInput.value = ''; pwInput.focus();
    } else {
      const fb = 'Du bist in der Konzeptothek. 147 Konzepte, 31 SiKos – und die Verbindungen, auch die widersprüchlichen.\n\nMit welchen Theorien oder Konzepten bist du gerade unterwegs?';
      append('bot', renderMd(fb));
      history.push({ role:'assistant', content:fb });
    }
  }
  input.focus();
}

<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PHGR Methodensammlung</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --gelb:    #c7d200;
      --tuerkis: #23b2c6;
      --rot:     #ed6a69;
      --orange:  #fbb900;
      --violett: #6169af;
      --gruen:   #5aab6e;
      --dg:      #878787;
      --mg:      #c6c6c6;
      --hg:      #ececec;
    }
    body { font-family: Arial, Helvetica, sans-serif; background: var(--hg); color: #1a1a1a; min-height: 100vh; display: flex; flex-direction: column; }
    header { background: var(--gelb); padding: 14px 32px; display: flex; align-items: center; gap: 16px; flex-shrink: 0; }
    .ph { font-family: Georgia, serif; font-style: italic; font-weight: 700; font-size: 22px; color: #111; }
    .gr { font-variant: small-caps; font-weight: 300; font-size: 22px; color: #111; letter-spacing: .04em; }
    .sep { width: 2px; height: 24px; background: rgba(0,0,0,.15); }
    .header-title { font-size: 18px; font-weight: 700; color: #111; }
    .back-link { margin-left: auto; font-size: 13px; font-weight: 700; color: #333; text-decoration: none; background: rgba(0,0,0,.1); padding: 6px 14px; border-radius: 20px; }
    .back-link:hover { background: rgba(0,0,0,.18); }
    .hero { background: white; border-bottom: 3px solid var(--gelb); padding: 36px 32px 30px; }
    .hero h1 { font-size: 26px; font-weight: 800; margin-bottom: 8px; }
    .hero p  { font-size: 15px; color: var(--dg); max-width: 560px; line-height: 1.6; }
    main { flex: 1; padding: 36px 32px; max-width: 900px; width: 100%; margin: 0 auto; }
    .section-label { font-size: 11px; font-weight: 700; letter-spacing: .13em; text-transform: uppercase; color: var(--dg); margin-bottom: 16px; }
    .tags { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 28px; }
    .tag-btn { padding: 6px 16px; border-radius: 20px; border: 2px solid var(--mg); background: white; color: var(--dg); font-size: 13px; font-weight: 700; cursor: pointer; font-family: Arial; transition: all .15s; }
    .tag-btn:hover { border-color: var(--tuerkis); color: var(--tuerkis); }
    .tag-btn.active { color: white; }
    .accordion { display: flex; flex-direction: column; gap: 10px; }
    .item { background: white; border-radius: 14px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,.06); border-left: 5px solid var(--tuerkis); transition: box-shadow .2s; }
    .item:hover { box-shadow: 0 4px 16px rgba(0,0,0,.1); }
    .item.hidden { display: none; }
    .item[data-tag="aktivierung"]  { border-left-color: var(--tuerkis); }
    .item[data-tag="diskussion"]   { border-left-color: var(--violett); }
    .item[data-tag="reflexion"]    { border-left-color: var(--orange); }
    .item[data-tag="kooperation"]  { border-left-color: var(--rot); }
    .item[data-tag="kreativität"]  { border-left-color: var(--gruen); }
    .item[data-tag="organisation"] { border-left-color: var(--dg); }
    .item[data-tag="präsentation"] { border-left-color: var(--gelb); border-left-width: 6px; }
    .item-header { display: flex; align-items: center; gap: 14px; padding: 18px 22px; cursor: pointer; user-select: none; }
    .item-icon   { font-size: 22px; flex-shrink: 0; }
    .item-info   { flex: 1; min-width: 0; }
    .item-title  { font-size: 17px; font-weight: 800; color: #1a1a1a; }
    .item-meta   { display: flex; gap: 8px; margin-top: 4px; flex-wrap: wrap; }
    .tag-pill    { font-size: 11px; font-weight: 700; padding: 2px 10px; border-radius: 12px; background: var(--hg); color: var(--dg); }
    .time-pill   { font-size: 11px; color: var(--mg); padding: 2px 0; }
    .chevron     { font-size: 18px; color: var(--mg); transition: transform .25s; flex-shrink: 0; }
    .item.open .chevron { transform: rotate(180deg); }
    .item-body   { display: none; padding: 0 22px 22px; border-top: 1px solid var(--hg); }
    .item.open .item-body { display: block; }
    .desc-label  { font-size: 10px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--dg); margin: 16px 0 8px; }
    .desc-text   { font-size: 14px; color: #333; line-height: 1.65; }
    .show-btn    { margin-top: 16px; display: inline-flex; align-items: center; gap: 8px; background: var(--gelb); color: #111; border: none; border-radius: 8px; padding: 10px 20px; font-size: 14px; font-weight: 700; cursor: pointer; font-family: Arial; transition: opacity .15s; }
    .show-btn:hover { opacity: .85; }
    #overlay { display: none; position: fixed; inset: 0; background: white; z-index: 999; flex-direction: column; }
    #overlay.open { display: flex; }
    .ov-header { background: var(--gelb); padding: 14px 28px; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
    .ov-title  { font-size: 24px; font-weight: 800; color: #111; }
    .ov-close  { background: rgba(0,0,0,.12); border: none; border-radius: 8px; padding: 10px 22px; font-size: 16px; font-weight: 700; cursor: pointer; font-family: Arial; color: #111; }
    .ov-body   { flex: 1; overflow-y: auto; padding: 56px 8vw; display: flex; flex-direction: column; justify-content: flex-start; }
    .ov-step   { display: flex; gap: 24px; margin-bottom: 36px; align-items: flex-start; }
    .ov-num    { width: 48px; height: 48px; border-radius: 50%; background: var(--gelb); color: #111; font-weight: 800; font-size: 20px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; margin-top: 2px; }
    .ov-step-text { font-size: clamp(19px, 2.4vw, 26px); line-height: 1.7; color: #1a1a1a; }
    .ov-hint   { font-size: 17px; color: var(--dg); margin-top: 48px; padding-top: 24px; border-top: 1px solid var(--hg); }
    footer { background: white; border-top: 1px solid var(--mg); padding: 16px 32px; display: flex; align-items: center; justify-content: space-between; }
    footer p { font-size: 12px; color: var(--mg); }
    footer a { color: var(--tuerkis); font-size: 12px; text-decoration: none; }
    @media (max-width: 600px) {
      header, .hero, main, footer { padding-left: 16px; padding-right: 16px; }
      .ov-body { padding: 32px 6vw; }
    }
  </style>
</head>
<body>

<header>
  <div><span class="ph">ph</span><span class="gr">GR</span></div>
  <div class="sep"></div>
  <div class="header-title">Methodensammlung</div>
  <a class="back-link" href="../index.html">← tool-box</a>
</header>

<div class="hero">
  <h1>Hochschuldidaktische Methoden</h1>
  <p>Aktivierende Methoden für Seminare und Weiterbildungen – mit Kurzinfo für Dozierende und direkter Anleitung für Teilnehmende.</p>
</div>

<div id="overlay">
  <div class="ov-header">
    <div class="ov-title" id="ov-title"></div>
    <button class="ov-close" onclick="closeOverlay()">✕ Schliessen</button>
  </div>
  <div class="ov-body" id="ov-body"></div>
</div>

<main>
  <div class="section-label">Filter nach Kategorie</div>
  <div class="tags" id="tags"></div>
  <div class="section-label" style="margin-top:8px">Methoden <span id="count" style="font-weight:400;text-transform:none;letter-spacing:0;color:var(--mg)"></span></div>
  <div class="accordion" id="accordion"></div>
</main>

<footer>
  <div><span class="ph">ph</span><span class="gr">GR</span><span style="font-size:12px;color:var(--mg);margin-left:8px">Methodensammlung</span></div>
  <p><a href="../index.html">tool-box</a></p>
</footer>

<script>
const METHODEN = [
  // ── Aktivierung ──────────────────────────────────────────
  {
    titel: '3×3×3',
    icon: '🔢', tag: 'aktivierung', dauer: '10–15 min',
    beschreibung: 'Strukturiertes Denk- und Austauschformat in drei Phasen à drei Minuten. Startet als Einzelarbeit, öffnet sich schrittweise zur Gruppe. Ideal als Einstieg oder zur Aktivierung von Vorwissen. Die Zeitstruktur schützt ruhigere Personen.',
    anleitung: [
      { schritt: 'Einzelarbeit (3 min)', text: 'Notiert still für euch: Was wisst ihr bereits zum Thema? Schreibt mindestens 3 Punkte auf.' },
      { schritt: 'Austausch zu zweit (3 min)', text: 'Tauscht euch mit der Person neben euch aus. Welche Punkte überschneiden sich? Was überrascht euch?' },
      { schritt: 'Runde zu sechst (3 min)', text: 'Zwei Paare finden sich zusammen. Haltet eure drei wichtigsten gemeinsamen Erkenntnisse fest.' },
    ],
    hinweis: 'Ergebnisse können danach im Plenum geteilt werden.'
  },
  {
    titel: '3×3',
    icon: '📝', tag: 'aktivierung', dauer: '5–8 min',
    beschreibung: 'Komprimierte Reflexions- oder Aktivierungsmethode: Jede Person nennt zu einem Thema drei Aspekte in drei Minuten. Einfach, schnell, ohne Vorbereitung einsetzbar. Gut für kurze Einstiegs- oder Abschlussphasen.',
    anleitung: [
      { schritt: 'Aufgabe klären', text: 'Die dozierende Person stellt eine Frage oder gibt einen Impuls: z.B. "Nennt 3 Dinge, die ihr heute gelernt habt."' },
      { schritt: 'Einzelarbeit (3 min)', text: 'Jede Person schreibt still 3 Antworten auf – auf Papier oder digital. Keine Absprache.' },
      { schritt: 'Blitzrunde', text: 'Jede Person nennt einen ihrer drei Punkte – reihum, ohne Wiederholung. Optional: Punkte werden gesammelt und sichtbar gemacht.' },
    ],
    hinweis: 'Variante: 3 Stärken, 3 Fragen, 3 Wünsche – je nach Kontext.'
  },
  {
    titel: 'Murmelrunde',
    icon: '🗣️', tag: 'aktivierung', dauer: '3–5 min',
    beschreibung: 'Kurzer, spontaner Austausch in Paaren oder Dreiergruppen ohne formale Struktur. Senkt die Hemmschwelle vor Plenumsdiskussionen, aktiviert alle gleichzeitig und bringt Bewegung ins Gespräch. Ideal als kurze Aktivierungsphase zwischendurch.',
    anleitung: [
      { schritt: 'Signal', text: 'Die Lehrperson stellt eine kurze Frage oder gibt einen Impuls – z.B. "Tauscht euch 2 Minuten lang aus: Was habt ihr gerade verstanden, was noch nicht?"' },
      { schritt: 'Murmelphase (2–3 min)', text: 'Dreht euch zur Nachbarperson. Redet frei, ohne Protokoll, ohne feste Rollen. Beide kommen zu Wort.' },
      { schritt: 'Optional: Rückmeldung', text: 'Eine Frage ins Plenum: "Was habt ihr besprochen?" – 2–3 Stimmen reichen.' },
    ],
    hinweis: 'Bewusst kurz halten – Murmelrunden verlieren ihre Kraft wenn sie zu lange dauern.'
  },
  {
    titel: 'Schneeballschlacht',
    icon: '❄️', tag: 'aktivierung', dauer: '10–15 min',
    beschreibung: 'Alle schreiben eine Idee oder Antwort auf ein Blatt, zerknüllen es zu einer "Schneeball" und werfen es in die Mitte. Dann nimmt jede Person einen fremden Zettel, liest ihn und ergänzt ihn. Anonym, spielerisch, energetisierend – ideal für Brainstorming oder Einstieg.',
    anleitung: [
      { schritt: 'Schreiben (2 min)', text: 'Jede Person schreibt ihre Antwort oder Idee zur gestellten Frage auf ein Blatt Papier – gross und leserlich.' },
      { schritt: 'Werfen', text: 'Das Blatt wird zerknüllt und auf Signal in die Raummitte geworfen.' },
      { schritt: 'Aufnehmen und ergänzen (3 min)', text: 'Jede Person nimmt einen fremden Schneeball, glättet ihn, liest die Antwort und ergänzt mit einem Kommentar, einer Frage oder einem weiteren Gedanken.' },
      { schritt: 'Auswertung', text: 'Einige Blätter werden vorgelesen. Was überrascht? Was wiederholt sich? Was ist besonders interessant?' },
    ],
    hinweis: 'Methode eignet sich gut für kontroverse oder kreative Fragen.'
  },
  {
    titel: 'Zettelwald',
    icon: '🌿', tag: 'aktivierung', dauer: '10–20 min',
    beschreibung: 'Alle schreiben Ideen, Fragen oder Thesen auf Zettel und hängen diese an die Wand oder auf einen Tisch. Die entstehende Sammlung wird gemeinsam betrachtet, geclustert und ausgewertet. Macht implizites Wissen einer Gruppe sichtbar.',
    anleitung: [
      { schritt: 'Schreiben (5 min)', text: 'Jede Person schreibt ihre Gedanken auf Moderationskarten – ein Gedanke pro Karte, gross und lesbar. So viele Karten wie nötig.' },
      { schritt: 'Aufhängen', text: 'Alle Karten werden gleichzeitig und still an die Wand oder einen Tisch gelegt – kein Kommentar, noch kein Austausch.' },
      { schritt: 'Stilles Lesen (3 min)', text: 'Alle gehen durch den entstandenen "Zettelwald" und lesen still, was andere geschrieben haben.' },
      { schritt: 'Clustern und auswerten', text: 'Gemeinsam werden ähnliche Karten zusammengeführt. Welche Themen tauchen besonders häufig auf? Was überrascht?' },
    ],
    hinweis: 'Gut mit Klebezettern oder Moderationswänden. Variante: farbige Zettel für unterschiedliche Kategorien.'
  },

  // ── Diskussion ───────────────────────────────────────────
  {
    titel: 'Fishbowl',
    icon: '🐠', tag: 'diskussion', dauer: '20–40 min',
    beschreibung: 'Diskussionsformat mit Innen- und Aussenkreis. Ein kleiner Innenkreis diskutiert aktiv, der Aussenkreis beobachtet. Ein freier Stuhl im Innenkreis kann jederzeit besetzt werden. Fördert konzentriertes Zuhören und strukturierte Diskussionskultur.',
    anleitung: [
      { schritt: 'Aufstellung', text: 'Stellt zwei Kreise auf: 4–6 Stühle innen, alle anderen aussen. Im Innenkreis ist ein Stuhl frei ("Fischstuhl").' },
      { schritt: 'Diskussion', text: 'Nur wer im Innenkreis sitzt, spricht. Der freie Stuhl kann jederzeit von einer Person aus dem Aussenkreis besetzt werden – dann verlässt jemand anderes den Innenkreis.' },
      { schritt: 'Beobachtung', text: 'Aussenkreis: Hört aktiv zu. Welche Argumente überzeugen euch? Was fehlt in der Diskussion?' },
      { schritt: 'Abschluss-Plenum', text: 'Aussenkreis gibt Rückmeldung: Was habt ihr beobachtet? Was nehmt ihr mit?' },
    ],
    hinweis: 'Thema und Diskussionsfrage vorher klar kommunizieren. Zeitwächter bestimmen.'
  },
  {
    titel: 'Schreibgespräch',
    icon: '✍️', tag: 'diskussion', dauer: '10–20 min',
    beschreibung: 'Ein Gespräch, das vollständig schriftlich und schweigend geführt wird. Auf grossen Papieren oder Tischdecken schreiben Personen Gedanken, die anderen kommentieren und ergänzen – ohne zu sprechen. Fördert Nachdenklichkeit, Gleichberechtigung und entschleunigtes Denken.',
    anleitung: [
      { schritt: 'Vorbereitung', text: 'Grosses Papier auf dem Tisch, jede Person hat einen Stift. Die Ausgangsfrage steht in der Mitte.' },
      { schritt: 'Schreibphase (8–12 min)', text: 'Alle schreiben still ihre Gedanken auf das Papier. Auf Gedanken anderer kann direkt geantwortet oder weitergeschrieben werden – aber keine Worte sprechen.' },
      { schritt: 'Lesen und vertiefen', text: 'Noch 2–3 Minuten: Lest alle Beiträge, ergänzt oder markiert, was euch besonders anspricht.' },
      { schritt: 'Auswertungsgespräch', text: 'Jetzt darf gesprochen werden: Was habt ihr geschrieben? Was überrascht euch in der Sammlung?' },
    ],
    hinweis: 'Das Schweigen bewusst halten – es entsteht eine besondere Konzentration.'
  },
  {
    titel: 'Troika-Consulting',
    icon: '🔺', tag: 'diskussion', dauer: '20–30 min',
    beschreibung: '3er-Gruppen in drei Rollen: Eine Person bringt eine echte Frage oder Herausforderung ein, die anderen zwei beraten als "Konsultierende". Wechsel nach jeder Runde. Niedrigschwellige Peer-Beratung mit klarer Struktur – funktioniert auch bei heterogenen Gruppen sehr gut.',
    anleitung: [
      { schritt: 'Gruppen bilden', text: 'Bildet Dreiergruppen. Entscheidet, wer zuerst die Rolle der ratsuchenden Person übernimmt.' },
      { schritt: 'Frage formulieren (2 min)', text: 'Die ratsuchende Person beschreibt ihre Frage oder Herausforderung kurz. Die anderen hören zu, ohne zu unterbrechen.' },
      { schritt: 'Rücken drehen', text: 'Die ratsuchende Person dreht sich weg oder schliesst die Augen. Die zwei Beratenden besprechen die Frage – laut, sodass die ratsuchende Person zuhören kann.' },
      { schritt: 'Feedback (2 min)', text: 'Die ratsuchende Person dreht sich zurück und teilt mit, was sie gehört hat, was hilfreich war.' },
      { schritt: 'Rollenwechsel', text: 'Alle drei Personen nehmen reihum die ratsuchende Rolle ein.' },
    ],
    hinweis: 'Echte, aktuelle Fragen wählen – die Methode entfaltet nur mit echtem Beratungsbedarf ihre Wirkung.'
  },

  // ── Reflexion ────────────────────────────────────────────
  {
    titel: 'Galerie-Rundgang',
    icon: '🖼️', tag: 'reflexion', dauer: '20–30 min',
    beschreibung: 'Arbeitsergebnisse werden wie in einer Galerie im Raum aufgehängt. Alle betrachten sie still und können mit Punkten oder Kommentaren reagieren. Fördert gegenseitige Wertschätzung, ruhige Auseinandersetzung und das Vergleichen verschiedener Lösungsansätze.',
    anleitung: [
      { schritt: 'Vorbereitung', text: 'Alle hängen ihre Ergebnisse sichtbar im Raum auf – verteilt, sodass Abstand zwischen den Exponaten bleibt.' },
      { schritt: 'Stiller Rundgang (7–10 min)', text: 'Geht allein und still durch den Raum. Macht kurze Notizen: Was beeindruckt euch? Was überrascht euch?' },
      { schritt: 'Feedback geben', text: 'Klebt Punkte oder Post-its an Exponate, die euch besonders ansprechen.' },
      { schritt: 'Auswertung', text: 'Im Plenum: Welche Exponate erhielten viele Rückmeldungen? Jede Gruppe kommentiert kurz ihr Ergebnis.' },
    ],
    hinweis: 'Drei Farben für Klebepunkte: grün = überzeugend, gelb = interessant, blau = Frage dazu.'
  },
  {
    titel: 'Freeze-Bild',
    icon: '🎭', tag: 'reflexion', dauer: '15–25 min',
    beschreibung: 'Gruppen erarbeiten ein Standbild (Tableau vivant) zu einem Begriff, einer Situation oder einem Konzept – mit dem eigenen Körper, ohne Sprache. Das Bild wird "eingefroren" und vom Plenum interpretiert. Öffnet Zugänge zu Themen jenseits von Sprache und Abstraktion.',
    anleitung: [
      { schritt: 'Auftrag', text: 'Jede Gruppe erhält ein Thema oder einen Begriff, z.B. "Macht", "Gerechtigkeit" oder eine konkrete Situation.' },
      { schritt: 'Vorbereitung (5 min)', text: 'Baut gemeinsam ein Standbild mit euren Körpern – kein Sprechen, keine Requisiten. Alle sind Teil des Bildes.' },
      { schritt: 'Einfrieren und zeigen', text: 'Das Standbild wird dem Plenum präsentiert – alle in der Gruppe bleiben reglos (gefroren).' },
      { schritt: 'Interpretation', text: 'Das Plenum beschreibt, was es sieht: Beziehungen, Emotionen, Machtverhältnisse. Danach erklärt die Gruppe ihre Absicht.' },
    ],
    hinweis: 'Variante "Auftauen": Eine Person im Bild bewegt sich langsam und beschreibt, was sie in dieser Position fühlt.'
  },
  {
    titel: 'Aufstellungen',
    icon: '🧭', tag: 'reflexion', dauer: '10–20 min',
    beschreibung: 'Meinungen oder Einschätzungen werden räumlich sichtbar gemacht: Personen positionieren sich im Raum auf imaginären Skalen oder um Symbole herum. Sofort sichtbar, körperbezogen, ohne Sprachhürde. Eignet sich gut als Einstieg oder zur Bestandsaufnahme.',
    anleitung: [
      { schritt: 'Skala definieren', text: 'Die Lehrperson definiert die zwei Pole: z.B. "Stimme voll zu" ← → "Stimme gar nicht zu" oder zwei gegenüberliegende Wände als Optionen.' },
      { schritt: 'Positionieren', text: 'Alle stellen sich still auf die Skala – so, wie sie die Aussage einschätzen. Keine Absprache vorher.' },
      { schritt: 'Begründen', text: 'Einige Personen erklären kurz, warum sie an dieser Position stehen. Unterschiedliche Positionen gezielt befragen.' },
      { schritt: 'Zweite Runde (optional)', text: 'Neue Aussage oder Frage – hat sich durch das Zuhören etwas verändert? Neupositionierung möglich.' },

    hinweis: 'Niemand muss eine Position begründen, wenn er/sie das nicht möchte.'
  },
  {
    titel: 'Forschungsaufgabe als Lernprinzip',
    icon: '🔬', tag: 'reflexion', dauer: 'variabel',
    beschreibung: 'Studierende untersuchen eine echte, offene Frage – nicht zur Überprüfung von Wissen, sondern zur Erzeugung neuer Erkenntnis. Fördert wissenschaftliches Denken, Selbstverantwortung und intrinsische Motivation. Gut einsetzbar als längere Lernphase oder als Semesteraufgabe.',
    anleitung: [
      { schritt: 'Forschungsfrage entwickeln', text: 'Formuliert eine Frage, auf die ihr noch keine Antwort habt. Sie soll offen, bearbeitbar und für euch relevant sein.' },
      { schritt: 'Methode wählen', text: 'Wie wollt ihr die Frage untersuchen? Interview, Beobachtung, Literatur, Experiment? Begründet eure Wahl.' },
      { schritt: 'Untersuchen', text: 'Führt die Untersuchung durch. Haltet den Prozess fest – auch Sackgassen und Überraschungen gehören dazu.' },
      { schritt: 'Ergebnis präsentieren', text: 'Teilt eure Erkenntnisse mit der Gruppe – inkl. der Frage, was offen geblieben ist und was ihr anders machen würdet.' },
    ],
    hinweis: 'Die Frage muss wirklich offen sein – keine versteckten Erwartungen an das Ergebnis.'
  },
  {
    titel: 'Scaffolding',
    icon: '🏗️', tag: 'reflexion', dauer: 'variabel',
    beschreibung: 'Kein klassisches Aktivierungsformat, sondern ein Planungsprinzip: Lernende erhalten gestufte Unterstützung, die schrittweise zurückgezogen wird. Jede Aufgabe liegt in der "Zone der nächsten Entwicklung". Bewusst eingesetzt macht Scaffolding Lernstufen sichtbar und förderbar.',
    anleitung: [
      { schritt: 'Ziel klären', text: 'Was sollen die Studierenden am Ende selbstständig können? Dieses Ziel definiert, welche Unterstützung nötig ist.' },
      { schritt: 'Stufen planen', text: 'Welche Hilfestellungen braucht es zu Beginn? Beispiele, Vorlagen, Leitfragen, Feedback – und welche fallen wann weg?' },
      { schritt: 'Unterstützung graduell reduzieren', text: 'Beginnt mit maximaler Unterstützung. In jeder weiteren Aufgabe wird eine Stütze entfernt, bis die Studierenden allein arbeiten.' },

// ── Tag-Farben ────────────────────────────────────────────
const TAG_COLORS = {
  aktivierung:  '#23b2c6',
  diskussion:   '#6169af',
  reflexion:    '#fbb900',
  kooperation:  '#ed6a69',
  kreativität:  '#5aab6e',
  organisation: '#878787',
  präsentation: '#c7d200',
};

// ── Tags und Filter ───────────────────────────────────────
const allTags = [...new Set(METHODEN.map(m => m.tag))];
let activeTag = null;

function buildTags() {
  const container = document.getElementById('tags');
  const allBtn = document.createElement('button');
  allBtn.className = 'tag-btn active';
  allBtn.style.borderColor = '#1a1a1a';
  allBtn.style.background  = '#1a1a1a';
  allBtn.style.color       = 'white';
  allBtn.textContent = `Alle (${METHODEN.length})`;
  allBtn.onclick = () => filterTag(null);
  container.appendChild(allBtn);

  allTags.forEach(tag => {
    const count = METHODEN.filter(m => m.tag === tag).length;
    const col = TAG_COLORS[tag];
    const b = document.createElement('button');
    b.className   = 'tag-btn';
    b.textContent = `${tag.charAt(0).toUpperCase() + tag.slice(1)} (${count})`;
    b.dataset.tag = tag;
    b.style.background  = col + '22';
    b.style.borderColor = col + '88';
    b.style.color       = col;
    b.onclick = () => filterTag(tag);
    container.appendChild(b);
  });
}

function filterTag(tag) {
  activeTag = tag;
  const color = tag ? TAG_COLORS[tag] : '#1a1a1a';
  document.querySelectorAll('.tag-btn').forEach(b => {
    const isActive = tag === null
      ? b.textContent.startsWith('Alle')
      : b.dataset.tag === tag;
    b.classList.toggle('active', isActive);
    if (isActive) {
      b.style.background  = color;
      b.style.borderColor = color;
      b.style.color       = (tag === 'präsentation') ? '#111' : 'white';
    } else {
      if (b.dataset.tag) {
        const c = TAG_COLORS[b.dataset.tag];
        b.style.background  = c + '22';
        b.style.borderColor = c + '88';
        b.style.color       = c;
      } else {
        b.style.background  = '';
        b.style.borderColor = '';
        b.style.color       = '';
      }
    }
  });

  let visible = 0;
  document.querySelectorAll('.item').forEach(el => {
    const hide = tag !== null && el.dataset.tag !== tag;
    el.classList.toggle('hidden', hide);
    if (!hide) visible++;
  });
  document.getElementById('count').textContent = `(${visible} angezeigt)`;
}

// ── Accordion ─────────────────────────────────────────────
function buildAccordion() {
  const container = document.getElementById('accordion');
  METHODEN.forEach((m, i) => {
    const item = document.createElement('div');
    item.className  = 'item';
    item.dataset.tag = m.tag;
    item.innerHTML = `
      <div class="item-header" onclick="toggle(${i})">
        <div class="item-icon">${m.icon}</div>
        <div class="item-info">
          <div class="item-title">${m.titel}</div>
          <div class="item-meta">
            <span class="tag-pill" style="background:${TAG_COLORS[m.tag]}22;color:${TAG_COLORS[m.tag]}">${m.tag}</span>
            <span class="time-pill">⏱ ${m.dauer}</span>
          </div>
        </div>
        <div class="chevron">▼</div>
      </div>
      <div class="item-body">
        <div class="desc-label">Für Dozierende</div>
        <div class="desc-text">${m.beschreibung}</div>
        <button class="show-btn" onclick="openOverlay(${i})">▶ Anleitung für Teilnehmende anzeigen</button>
      </div>
    `;
    container.appendChild(item);
  });
  document.getElementById('count').textContent = `(${METHODEN.length} angezeigt)`;
}

function toggle(i) {
  document.querySelectorAll('.item')[i].classList.toggle('open');
}

// ── Overlay ───────────────────────────────────────────────
function openOverlay(i) {
  const m = METHODEN[i];
  document.getElementById('ov-title').textContent = m.titel;
  const body = document.getElementById('ov-body');
  body.innerHTML = '';
  m.anleitung.forEach((s, idx) => {
    const step = document.createElement('div');
    step.className = 'ov-step';
    step.innerHTML = `
      <div class="ov-num">${idx + 1}</div>
      <div>
        <div style="font-size:14px;font-weight:800;color:var(--dg);margin-bottom:8px;text-transform:uppercase;letter-spacing:.06em">${s.schritt}</div>
        <div class="ov-step-text">${s.text}</div>
      </div>`;
    body.appendChild(step);
  });
  if (m.hinweis) {
    const hint = document.createElement('div');
    hint.className = 'ov-hint';
    hint.innerHTML = `<strong>Hinweis:</strong> ${m.hinweis}`;
    body.appendChild(hint);
  }
  document.getElementById('overlay').classList.add('open');
}

function closeOverlay() {
  document.getElementById('overlay').classList.remove('open');
}

document.addEventListener('keydown', e => { if (e.key === 'Escape') closeOverlay(); });

buildTags();
buildAccordion();
</script>

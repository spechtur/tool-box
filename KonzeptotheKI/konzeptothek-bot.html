    .header-title-block { flex: 1; }

    #chat-container::-webkit-scrollbar { width: 3px; }
    #chat-container::-webkit-scrollbar-thumb { background: var(--phgr-gelb); border-radius: 2px; }
    .message { display: flex; flex-direction: column; max-width: 82%; animation: msgIn 0.25s ease both; }
    @keyframes msgIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .message.bot  { align-self: flex-start; }
    .message.user { align-self: flex-end; }
    .msg-label { font-family: monospace; font-size: 0.62em; letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 5px; color: var(--text-dim); }
    .message.user .msg-label { text-align: right; }
    .msg-bubble { padding: 13px 17px; line-height: 1.7; font-size: 0.93em; }
    .message.bot .msg-bubble { background: var(--surface2); border-left: 3px solid var(--phgr-gelb); color: var(--text); }
    .message.user .msg-bubble { background: var(--phgr-gelb); color: #111; font-family: Georgia, serif; }
    .typing-wrap { align-self: flex-start; animation: msgIn 0.25s ease both; }
    .typing-dots { display: flex; gap: 5px; padding: 13px 17px; background: var(--surface2); border-left: 3px solid var(--phgr-gelb); }
    .dot { width: 7px; height: 7px; background: var(--phgr-gelb); border-radius: 50%; opacity: 0.4; animation: dotBounce 1.3s infinite; }
    .dot:nth-child(2) { animation-delay: 0.18s; }
    .dot:nth-child(3) { animation-delay: 0.36s; }
    @keyframes dotBounce { 0%,60%,100% { transform: translateY(0); opacity: 0.4; } 30% { transform: translateY(-7px); opacity: 1; } }
    #input-wrap { background: var(--surface); border-top: 1px solid var(--border); padding: 14px 20px; display: flex; gap: 10px; align-items: flex-end; flex-shrink: 0; }
    #input-col { flex: 1; display: flex; flex-direction: column; gap: 5px; }
    #user-input { width: 100%; background: var(--surface2); border: 1px solid var(--border); color: var(--text); padding: 11px 15px; font-family: Georgia, serif; font-size: 0.92em; resize: none; min-height: 46px; max-height: 130px; line-height: 1.55; transition: border-color 0.2s; outline: none; }
    #user-input:focus { border-color: var(--phgr-gelb); }
    #user-input::placeholder { color: var(--text-dim); font-style: italic; }
    .input-hint { font-family: monospace; font-size: 0.6em; color: var(--text-dim); letter-spacing: 0.04em; }
    #send-btn { background: var(--phgr-gelb); color: #111; border: none; width: 46px; height: 46px; font-size: 1.25em; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: opacity 0.15s, transform 0.1s; }
    #send-btn:hover:not(:disabled) { opacity: 0.85; transform: scale(1.04); }
    #send-btn:disabled { opacity: 0.25; cursor: not-allowed; transform: none; }
    .error-bubble { background: #2a1515; border-left: 3px solid var(--phgr-rot); color: #e8a0a0; padding: 12px 16px; font-size: 0.85em; font-family: monospace; line-height: 1.5; }

const SYSTEM_PROMPT = `Du bist der Konzeptothek-Bot des Masterstudiengangs SEK I & II der Pädagogischen Hochschule Graubünden (PHGR).

DEINE IDENTITÄT:
Du bist kein digitaler Bibliothekar. Du bist ein konzeptueller Provokateur – manchmal unbequem, gelegentlich mit einem Augenzwinkern, immer präzise. Du erzeugst produktive Reibung zwischen Konzepten, die zum Positionieren zwingt.

DEINE KERNAUFGABE:
1. Erkunde die theoretische Landschaft: Womit hat die Person gearbeitet? In welchem Handlungsfeld bewegt sie sich?
2. Identifiziere Muster und Lücken: Welcher Theoriehabitat? Was fehlt auffällig?
3. Erzeuge eine gezielte Kollision: Zwei Konzepte, die sich genau am blinden Fleck reiben.
4. Stelle EINE Frage – oder mach eine Aussage, die keine Frage braucht.

═══════════════════════════
REAKTIONSREPERTOIRE – variiere bewusst, niemals Schema:
═══════════════════════════
Du hast verschiedene Züge zur Auswahl. Wähle den, der sitzt – nicht immer denselben:

• DIREKTEINSTIEG: Ohne Puffer direkt in die Spannung. "Wygotski und Omer im selben Atemzug. Das verträgt sich nicht. Warum nicht?"
• KURZE BEOBACHTUNG OHNE FRAGE: Manchmal wirkt eine Aussage stärker als jede Frage. "Du bewegst dich seit drei Antworten im selben Theoriehabitat. Das ist kein Zufall."
• RÜCKSPIEGELUNG MIT VERDREHUNG: Was die Person sagte, leicht verschoben zurückgeben, sodass sie es neu hört.
• EINE EINZIGE FRAGE, DANN NICHTS: "Was passiert, wenn Kounin versagt?" Fertig.
• SEHR KURZ: 1-2 Sätze können mehr auslösen als ein Absatz. Trau der Kürze.
• ÜBERRASCHENDE VERBINDUNG: Konzept aus einem völlig anderen SiKo-Bereich ins Spiel bringen.

VERBOTEN:
- Mit Affirmation beginnen ("Interessant!", "Guter Punkt", "Das stimmt")
- Das Drei-Akt-Schema: aufnehmen → herausfordern → fragen
- Mehr als eine Frage pro Antwort
- Erklärende Puffersätze vor der eigentlichen Aussage

HUMOR – sparsam, situativ, nie erzwungen:
═══════════════════════════
Gelegentliche Leichtigkeit ist erlaubt – als Überraschungsmoment, nicht als Muster.
Erlaubt: sanfte Ironie über konzeptuelle Reflexe ("Konstruktivismus – das theoretische Graubrot der Pädagogik: nährt, aber irgendwann fragt man sich, ob es auch schmeckt"), Selbstironie über die eigene Rolle als Provokationsmaschine.
Nie: zynisch, auf Kosten der studierenden Person, bei ernsten Themen (Burnout, Gesundheit, Biografie, Inklusion, Konflikt).
Maximum: ein Moment pro Gespräch, wenn er sich organisch ergibt.

WENN NACH KONZEPTINHALTEN GEFRAGT WIRD:
═══════════════════════════
Verweigere Zusammenfassungen NICHT mit technischen Gründen.
Verweigere sie mit pädagogischen: "Eine Zusammenfassung würde genau die Denkarbeit abnehmen, die deine Konstruktion trägt – und das wäre schade, weil du das kannst."

Biete stattdessen Scaffolding an, das das Lesen wertvoller macht:
• LESEFRAGE MITGEBEN: "Lies es mit dieser Frage: Was ist das Gegenteil davon – und warum nennen sie es nie beim Namen?"
• VERGLEICHSRAHMEN: "Lies es neben [Konzept X]. Die Spannung zwischen beiden ist die eigentliche Botschaft."
• SUCHLINIE: "Schau beim Lesen: Wer ist hier das Subjekt – Lehrperson oder Lernende?"
• KONTEXTVERORTUNG: "Dieses Konzept sitzt im Handlungsfeld [Y]. Was sagt das über seinen Anwendungskontext?"
• KONZEPTAUSWAHL-HILFE: Du kannst aktiv dabei helfen, welche Konzepte für eine Konstruktion relevant sein könnten – das ist keine Abkürzung, sondern Orientierung im Netz.

KONSTRUKTIVISMUS-ALARM:
═══════════════════════════
Erscheint in 27+ von 31 SiKos. Bei Erwähnung sofort nachfragen – aber ohne Schema:
Manchmal: "Was meinst du damit genau?" Manchmal: "Welche Lerntheorie hast du ihm je gegenübergestellt?" Manchmal nur: "Konstruktivismus. Und was nicht?"

ÜBER HANDLUNGSFELDER:
═══════════════════════════
Seit dem Umbau des Studiengangs sind 21 der 31 SiKos in Jahr A und Jahr B zu Handlungsfeldern gebündelt. 1. und 2. Studienjahr sind immer im gleichen Jahr (A oder B). Konstruktionen entstehen neu auf Handlungsfeld-Ebene (2-3 SiKos zusammen), nicht mehr auf Einzel-SiKo-Ebene. Das 3. Studienjahr (10 SiKos) bleibt unverändert.

Jahr A: Jugendliche begleiten 1 (E.05/B.05/B.03) | Lernen anregen Formen (L.05/L.04/L.07) | Lernerfolge sichtbar machen A (B.01/B.06) | Diversity 2 (L.09/L.08) | Reflexion A (I.02)
Jahr B: Gruppen begleiten 2 (E.01/E.02) | Lernen anregen Aufgaben (L.02/L.03/L.01) | Lernerfolge sichtbar machen B (B.02/B.04) | Diversity 1 (E.03/E.04) | Reflexion B (I.01)
Jahr 3: E.06 | E.07 | E.08 | E.09 | E.10 | I.03 | I.04 | I.05 | L.06 | L.10

Für den Bot bedeutet das: Wenn jemand ein Handlungsfeld nennt, denke in der konzeptuellen Schnittmenge aller beteiligten SiKos. Die interessantesten Kollisionen liegen oft INNERHALB eines Handlungsfelds – Konzepte aus verschiedenen SiKos, die dasselbe Phänomen unterschiedlich beleuchten oder widersprechen.

// ═══════════════════════════════════════════════════════════
//  UI-LOGIK
// ═══════════════════════════════════════════════════════════
const chat    = document.getElementById('chat-container');
const input   = document.getElementById('user-input');
const sendBtn = document.getElementById('send-btn');
let history   = [];
let busy      = false;

function append(role, html) {
  const wrap   = document.createElement('div');
  wrap.className = `message ${role}`;
  const label  = document.createElement('div');
  label.className = 'msg-label';
  label.textContent = role === 'bot' ? 'Konzeptothek' : 'Du';
  const bubble = document.createElement('div');
  bubble.className = 'msg-bubble';
  bubble.innerHTML  = html;
  wrap.appendChild(label);
  wrap.appendChild(bubble);
  chat.appendChild(wrap);
  chat.scrollTop = chat.scrollHeight;
}

function showTyping() {
  const w = document.createElement('div');
  w.className = 'typing-wrap'; w.id = 'typing';
  w.innerHTML = '<div class="msg-label">Konzeptothek</div><div class="typing-dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>';
  chat.appendChild(w);
  chat.scrollTop = chat.scrollHeight;
}

function rmTyping() { const t = document.getElementById('typing'); if (t) t.remove(); }

function esc(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');
}

async function callAPI(msgs, maxTokens) {
  const r = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: { 'Content-Type':'application/json','x-api-key':API_KEY,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true' },
    body: JSON.stringify({ model:MODEL, max_tokens:maxTokens||800, system:SYSTEM_PROMPT, messages:msgs })
  });
  if (!r.ok) throw new Error(`API ${r.status}: ${await r.text()}`);
  return (await r.json()).content[0].text;
}

async function send() {
  const txt = input.value.trim();
  if (!txt || busy) return;
  input.value = ''; input.style.height = 'auto';
  busy = true; sendBtn.disabled = true;
  append('user', esc(txt));
  history.push({ role:'user', content:txt });
  showTyping();
  try {
    const reply = await callAPI(history);
    rmTyping(); append('bot', esc(reply));
    history.push({ role:'assistant', content:reply });
  } catch(e) {
    rmTyping();
    const w = document.createElement('div'); w.className = 'message bot';
    w.innerHTML = `<div class="msg-label">System</div><div class="error-bubble">&#9888; ${esc(e.message)}<br><br>API-Key in der HTML-Datei prüfen (const API_KEY = ...).</div>`;
    chat.appendChild(w);
  }
  busy = false; sendBtn.disabled = false; input.focus();
}

input.addEventListener('input', function() { this.style.height='auto'; this.style.height=Math.min(this.scrollHeight,130)+'px'; });
input.addEventListener('keydown', e => { if (e.key==='Enter'&&!e.shiftKey) { e.preventDefault(); send(); } });
sendBtn.addEventListener('click', send);

// ── Init ──
(async () => {
  showTyping();
  try {
    const opening = await callAPI([{ role:'user', content:'[SYSTEM-INIT: Eröffne das Gespräch. Max. 3 Sätze + eine einzige Frage. Kein Kundenservice-Ton. Direkt, provokativ, einladend. Ziel: Die Person beschreibt ihre theoretische Landschaft.]' }], 300);
    rmTyping(); append('bot', esc(opening));
    history.push({ role:'assistant', content:opening });
  } catch(_) {
    rmTyping();
    const fb = 'Du bist in der Konzeptothek. 147 Konzepte, 31 SiKos – und die Verbindungen, auch die widersprüchlichen. Ich liefere keine Definitionen.\n\nMit welchen Theorien oder Konzepten bist du gerade unterwegs?';
    append('bot', esc(fb)); history.push({ role:'assistant', content:fb });
  }
  input.focus();
})();
</script>

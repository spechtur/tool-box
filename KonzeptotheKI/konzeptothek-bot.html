m). Zudem wird betont, dass schulische Probleme nicht nur aus individuellen Defiziten resultieren, sondern in der Interaktion zwischen Person und Umwelt entstehen. Literatur Hagmann-von Arx, P., Hengartner, O. & Lütolf, A. (2025). Begriffsbestimmung: Was sind Lernschwierigkeiten, Lernstörungen, Lernbehinderungen und Lernbeeinträchtigungen? Ein Wortsalat genüsslich zubereitet. Zürich: Interkantonale Hochschule für Heilpädagogik. weiterführende Links Link Link Link", "literature": "", "sikos": ["E.04", "B.06", "B.01", "L.08", "E.03", "B.05", "L.09", "L.01", "B.02"]}, {"name": "Lernstrategien", "description": "Die Schülerinnen und Schüler brauchen ein Grundrepertoire an allgemeinen Lernstrategien, die sich auf ein grosses Spektrum von Lernsituationen und Lernaufgaben anwenden lassen. Erstens gehören hierzu systematische Vorgehensweisen bei der Organisation des individuellen und kooperativen Lernens. Zweitens benötigen sie Strategien, mit deren Hilfe sich Wissen verstehen, aufnehmen, verarbeiten, speichern und auf die Lösung von Problemen übertragen lässt. Drittens müssen sie die Aufmerksamkeit und Konzentration steuern lernen. Viertens müssen sie wissen, wie man rationell liest und das Gelernte präsentiert. Fünftens sind sie auf ein wirksames Prüfungsmanagement angewiesen. Literatur Keller, G. (2015). Lerncoaching in der Schule. Praxishilfen für Lehrkräfte. Göttingen: Hogrefe. weiterführende Links Link Link Link", "literature": "", "sikos": ["L.03", "B.03", "B.06", "L.02", "E.02", "B.01", "L.08", "E.10", "B.05", "L.09"]}, {"name": "Lernzieltaxonomie nach Bloom", "description": "Die Lernziel-Taxonomie nach Bloom (1973; resp. Bloom et al., 1956) ist ein bekanntes und bewährtes Modell, um kognitive Leistungen zu klassifizieren. Mit den sechs Stufen nach Bloom lassen sich Lernleistungen auf unterschiedlichen Niveaus beschreiben. Die sechs Stufen kognitiver Komplexität bauen jeweils aufeinander auf und können durch spezifische Verben beschrieben werden. So ist die Lernzieltaxonomie nach Bloom auch eine nützliche Hilfestellung beim Formulieren von differenzierten Aufgabenstellungen. Literatur Bloom, B. S. (2001): Taxonomie von Lernzielen im kognitiven Bereich . Weinheim und Basel, Beltz Verlag, 5. Auflage weiterführende Links Lernziel-Taxonomien bei den TeachingTools der Universität Zürich Link Link", "literature": "", "sikos": ["L.03", "B.02", "L.07", "B.03", "B.04", "B.06", "L.02", "B.01", "L.08", "E.03", "E.10", "B.05", "L.01", "L.05", "L.09", "L.06"]}, {"name": "Linzer Konzept der Klassenführung nach Mayr", "description": "Der Linzer Fragebogen zu Klassenführung\" (LDK) ist ein Fragebogen zum \nFührungshandeln von Lehrkräften. Er ist aus Forschungen zur \nKlassenführung und aus praktischen Erfahrungen in der Lehrerbildung \nhervorgegangen. Der LDK ist für Lehramtsstudierende und Lehrer:innen \ngedacht, die sich Klarheit über ihr pädagogisches Handeln sowie dessen \nRahmenbedingungen und Auswirkungen verschaffen möchten, um ihr Handeln \nweiter zu entwickeln. Der LDK eignet sich auch als Forschungsinstrument.", "literature": "Lenske, G., & Mayr, J. (2015). Das Linzer Konzept der Klassenführung (LKK). Grundlagen, Prinzipien und Umsetzung in der Lehrerbildung. Jahrbuch für Allgemeine Didaktik , 71-84.", "sikos": ["E.01", "E.02"]}, {"name": "Logische Ebenen nach Dilts", "description": "Die Pyramide von Robert Dilts wird auch \"Modell der logischen Ebenen\" genannt und ist ein Erklärungsansatz für die positive Gestaltung von Veränderungen in sozialen Systemen und Organisationen. Demnach basieren Veränderungsdynamiken bei Menschen, Teams und ganzen Organisationen auf sechs aufeinander aufbauenden Ebenen. Literatur Eremit, B. & Weber, K.F. (2016). Individuelle Persönlichkeitsentwicklung: Growing by Transformation. Wiesbaden: Springer. weiterführende Links Beispielanwendung auf Digitale Transformation: https://digitaleneuordnung.de/blog/dilts-pyramide/ Link Link", "literature": "", "sikos": ["I.05", "I.02", "E.08", "E.09", "E.02", "I.01", "E.06", "E.10"]}, {"name": "LUKAS - ein Modell zur Entwicklung von kompetenzfördernden Aufgabensets", "description": "Aufgaben gelten in einem kompetenzorientierten Unterricht als Schlüsselelement, um Lernen zu gestalten und zu arrangieren. Vollständige Lernpfade ergeben sich durch die geschickte Verbindung von verschiedenen Lernaufgaben mit je unterschiedlichen Funktionen für das Lernen. Eine Gruppe von Lernaufgaben nennt man Aufgabenset. Literatur Auszug aus: Luthiger, H., Wilhelm, M., Wespi, C. und Wildhirt, S. (2018): Kompetenzförderung mit Aufgabensets. Theorie - Konzept - Praxis. Bern, hep verlag weiterführende Links Link Link Link", "literature": "", "sikos": ["L.03", "B.03", "L.02", "B.01", "L.01", "B.02"]}, {"name": "Migration", "description": "Der Beitrag führt in grundlegende Diskussionen über den schulpädagogischen Umgang mit Migration ein. Im ersten Teil wird ein Überblick über die herrschenden Diskurse im Umgang mit Migration gegeben: die Ausländerpädagogik, die Interkulturelle Pädagogik, neue Defizit-und Problemdiskurse und Dilemmata im Umgang mit ethno-natio-kultureller Vielfalt. Im zweiten Teil werden die Mechanismen der systematischen Schlechterstellung von Migrant_innen durch Differenzierung und Ent-Fremdung/othering behandelt und mit Blick auf die Ausgestaltung pädagogischer Professionalität im spannungsvollen Wechselspiel von Pädagogik und Politik, diskutiert. Den Abschluss bildet eine kurze Zusammenfassung und ein Überblick über einige Forschungsdesiderata. Literatur Hummerich, M. (2022). Migration. In M. Harring, C. Rohlfs, M. Gläser-Zikuda (Hrsg.), Handbuch Schulpädagogik (S. 596-608). Münster: Waxmann. weiterführende Links Migrationsgeschichte der Schweiz Link Link", "literature": "", "sikos": ["E.04", "E.08", "B.01", "I.01", "E.03", "E.06", "E.07"]}, {"name": "Motivation", "description": "Motivation, das ist ein grosses und bedeutsames Wort, untrennbar verknüpft mit Lernen. Nach der Intelligenz ist die Motivation eine der wichtigsten Variablen bei der Bestimmung schulischer Leistungen, behaupten Steinbayr und Spinath (2008) ihre Bedeutung bei allen anderen Unternehmungen kann kaum zu sehr betont werden. Literatur Lefrançoise, G. R. (2015). Psychologie des Lernens (5. Aufl.). Heidelberg: Springer. weiterführende Links Link Link Link", "literature": "", "sikos": ["L.03", "B.03", "B.04", "I.02", "B.06", "E.08", "I.03", "E.09", "E.02", "L.08", "E.10", "B.05", "L.01", "L.05", "L.09", "E.01"]}, {"name": "Multiprofessionelle Zusammenarbeit an inklusiven Schulen", "description": "Multiprofessionelle Zusammenarbeit zeigt sich als komplexer Forschungs- und Praxisgegenstand. Auf die Klärung der Begriffe multiprofessionelle, inter- und intraprofessionelle Kooperation folgt eine Darlegung empirischer Befunde und theoretischer Bezüge zur Kooperation von Lehr- und Fachpersonen. Anschliessend werden die gesellschaftlichen Erfordernisse und bildungspolitischen Entscheidungen skizziert, die zur multiprofessionellen Fachlichkeit an Schulen beigetragen haben und diese erfordern. Auf dieser Grundlage wird die Frage bearbeitet, wie multiprofessionelle Zusammenarbeit einen Mehrwert an inklusiven Schulen schafft. Literatur Pool Maag, S. (2022). Multiprofessionelle Zusammenarbeit an inklusiven Schulen: Nicht die Zuständigkeit, sondern das Ergebnis zählt. Schweizerische Zeitschrift für Heilpädagogik, 28(5–6), 15–21. https://doi.org/10.5281/zenodo.6542713", "literature": "", "sikos": ["E.10", "B.05", "I.05", "L.08"]}, {"name": "Natürliche Differenzierung", "description": "Die natürliche Differenzierung beschreibt eine ganzheitliche Erarbeitung von Themen, bei der sich Aufgaben unterschiedlichen Schwierigkeitsniveuas in natürlicher Weise ergeben. Alle Lernenenden erhalten ein gleiches Lernangebot, welches inhaltlich ganzheitlich und hinreichend komplex daherkommt. Unter diesen Rahmenbedingungen entscheiden die Lernenden z.B. die Tiefe der Bearbeitung selbst. Das soziale Lernen von- und miteinander spielt eine wichtige Rolle. Dies stellt diverse Anforderungen an die Lernangebote und die Lehrperson. Literatur Krauthausen, G. & Scherer, P. (2014) Natürliche Differenzierung. In: Natürliche Differenzierung im Mathematikunterricht. Seelze: Friedrich Verlag. weiterführende Links Link Link Link", "literature": "", "sikos": ["L.03", "L.02", "B.01", "L.08", "B.05"]}, {"name": "Neue Autorität nach Omer", "description": "Als Antwort auf Autoritätsprobleme in der heutigen Erziehung entwickelte Haim Omer gemeinsam mit Arist von Schlippe ein Konzept elterlicher Autorität durch Beziehung und ohne Gewalt. Er legt dar, dass es durch eine Autorität, die auf Distanz, Furcht und Bestrafung setze, zu einem Verlust an Bezogenheit komme. Als Alternative zeigt er eine Autorität durch Beziehung auf, die charakterisiert ist durch elterliche Präsenz, durch Selbstkontrolle, aber auch die Nutzung von Unterstützungssystemen. Wichtig sind ihm Transparenz des Verhaltens der Erziehungspersonen, eine Grenzsetzung durch Entschlossenheit ohne Gewalt sowie das Aufzeigen von Möglichkeiten der Versöhnung und der Wiedergutmachung.", "literature": "Omer, H. (2021). Neue Autorität. In: D. Rohr, H. Omer, M. Darts & B. Furman (Hrsg.), Gelingende Kommunikation mit Kindern und Jugendlichen (S.11 - 42). Heidelberg: Carl-Auer-Systeme Verlag", "sikos": ["I.05", "E.09", "E.02", "E.06", "E.10", "E.05", "E.01"]}, {"name": "Neue Beurteilungsformen nach Winter", "description": "Noten sind umstritten, unter anderem, weil sie nicht den objektiven Leistungsstand von Schüler:innen widerspiegeln, sondern nur die Rangfolge innerhalb der Klasse. Oft fehlen einheitliche Standards, und auch die soziale Herkunft wirkt sich auf die Schulnote aus. Deshalb haben viele Länder inzwischen alternative Beurteilungsformen eingeführt. Dieses Buch stellt neue Formen der Leistungsbeurteilung vor, die im englischsprachigen Raum unter dem Begriff »assessment for learning« bekannt geworden sind. Jenseits der klassischen Notenvergabe präsentiert der Autor verschiedene Modelle zur Überprüfung und Bewertung, die tiefer an den Fähigkeiten der Schüler:innen ansetzen und deren Lernen durch eine differenziertere Rückmeldung fördern. Dazu gehören beispielsweise Portfolios, Beurteilungsraster, Selbstbewertung, Textzeugnisse und Lernentwicklungsgespräche. Die Leistungsbeurteilung wird in einen didaktisch-methodischen Kontext gestellt, der gerade vor dem Hintergrund der Kompetenzdebatte an Bedeutung gewinnt. Literatur Winter, F. (2018). Lerndialog statt Noten. Neue Formen der Leistungsbeurteilung (2. Aufl.). Weinheim, Basel: Beltz. weiterführende Links Interview mit Felix Winter zur Leistungsbeurteilung 2h 3min mit Unterkapitel https://www.youtube.com/watch?v=uPyLWz-Gi04 Link", "literature": "", "sikos": ["B.03", "B.04", "B.06", "L.02", "I.04", "E.09", "B.01", "L.08", "I.01", "B.05", "L.09", "B.02"]}, {"name": "Neue Beurteilungskultur nach Winter", "description": "Die schulische Leistungsbewertung und die Lernkultur bedingen einander wechselseitig. Das, was geprüft und beurteilt wird, bestimmt in hohem Maße das, was gelernt wird. Darüber hinaus bestimmt aber auch die Art, wie geprüft und beurteilt wird, die Lernkultur. Alle Versuche, eine neue Lernkultur an Schulen zu etablieren, stossen daher an Grenzen, wenn nicht auch das System der Prüfung und Beurteilung der Schülerleistungen reformiert wird. Entwicklungsrichtungen für eine gründliche Reform dieses Bereichs schulischer Arbeit werden aufgezeigt und begründet. Die Leistungsbewertung wird als eine Gestaltungsaufgabe für die Schulen und alle daran Beteiligten beschrieben. Literatur Winter, F. (2016). Leistungsbewertung. Eine neue Lernkultur baucht einen anderen Umgang mit den Schülerleistungen (7. Aufl.). Baltmannsweiler: Schneider Verlag Hohengehren. weiterführende Links Interview mit Felix Winter zur Leistungsbeurteilung 2h 3min mit Unterkapitel https://www.youtube.com/watch?v=uPyLWz-Gi04 Link Link", "literature": "", "sikos": ["B.03", "B.04", "B.06", "L.02", "I.04", "L.08", "I.01", "B.05", "L.09", "B.02"]}, {"name": "No Blame Approach", "description": "Der NO BLAME APPROACH (Ansatz ohne Schuldzuweisung) hat enormen Bekanntheitsgrad erreicht und auf einfachen, unkomplizierten Wegen Einzug in die Schullandschaft gehalten. Der Ansatz, der wegen seiner sanktionsfreien Vorgehensweise sowohl Skepsis wie Zustimmung auszulösen vermag, ist heute eine häufig angewandte Methode für die Bewältigung von vielschichtigen und diffusen Mobbing-Problematiken in der Schule. Nicht zuletzt die Einfachheit der Vorgehensweise verblüfft viele Pädagogen und Pädagoginnen immer wieder. Literatur Blum, H. & Beck, D. (2019). No Blame Approach. Mobbing-Intervention in der Schule. Praxishandbuch (6. Aufl.). Köln: fairaend. weiterführende Links Video für Schülerinnen und Schüler, 10min https://www.youtube.com/watch?v=rOi0H_cJM3Y&t=2s Ratgeber für SEKI & SEK II: Caesar, V. & Mölders, L. (2018). Mobbing... die etwas andere Gewalt (3. Aufl.). Kerpen: Kohl-Verlag. www.no-blame-apprach.de Erklärvideos: Support group approach https://www.youtube.com/playlist?list=PLAVpnwnZWVJLOzTSSYvKlgPbwfmuZb3Kt", "literature": "", "sikos": ["E.04", "E.09", "E.02", "E.06", "E.05"]}, {"name": "Nähe und Distanz in pädagogischen Beziehungen", "description": "Seit Bekanntwerden der vielen Fälle sexueller Gewalt und emotionalen Missbrauchs in pädagogischen Institutionen steht die Pädagogik vor der Herausforderung, die Distanz- und Näheverhältnisse pädagogischer Beziehungen neu zu thematisieren. Das Buch befasst sich mit Begriffen, Strukturen und Kontexten pädagogischer Beziehungen und gibt Antworten darauf, wie viel \"Nähe\" beim Erziehen und Unterrichten nötig ist, damit Kinder auf dem Weg zum Erwachsenenwerden ausreichend Wissen und Können erwerben und soziale Zuwendung bzw. Unterstützung erfahren. Literatur Strobel-Eisele, G. & Roth, G. (Hrsg.). (2013). Grenzen beim Erziehen. Nähe und Distanz in pädagogischen Beziehungen. Stuttgart: W. Kohlhammer GmbH. weiterführende Links Leitfaden LCH: \"Integrität respektieren und schützen\" Link Link", "literature": "", "sikos": ["I.02", "E.09", "E.02", "E.06", "E.05", "E.01"]}, {"name": "Orientierungsraster Zusammenarbeit mit Eltern", "description": "Ein guter Kontakt zum Elternhaus (zu Eltern und andern Erziehungsberechtigten) ist heute ein unbestrittener Anspruch, dem die Schule gerecht werden muss Optimale Förderbedingungen für die Kinder und Jugendlichen lassen sich nur herstellen, wenn die Erziehungs- und Bildungsbemühungen von Eltern und Lehrpersonen koordiniert und aufeinander abgestimmt werden. Der Orientierungsraster «Zusammenarbeit von Schule und Eltern» versteht sich als Hilfestellung für die Entwicklungs- und Evaluationsarbeiten, die im Rahmen der Einzelschule vor Ort zu leisten sind. Er zeigt den Schulen auf, welches die wünschenswerten Ziele und leitenden Werte in den beschriebenen Entwicklungsfeldern sind Literatur Landwehr, N., Steiner, P. & Leuthard, T. (2022). Zusammenarbeit von Schule und Eltern. Orientierungsraster für die Schulentwicklung und Schulevaluation an der Solothurner Volksschule. Windisch: FHNW. weiterführende Links Link Link Link", "literature": "", "sikos": ["E.08", "E.10", "E.09", "E.07"]}, {"name": "Othering", "description": "Gesellschaftliche Dominanzverhältnisse fordern die Pädagogik heraus und konfrontieren sie mit der Gefahr ihrer Reproduktion. In theoretischen und empirischen Studien untersucht Christine Riegel Prozesse des Othering und deren Folgen für Bildungsprozesse: Inwiefern kommt es in Schule und Jugendarbeit zu Othering? In welcher Weise ist darin auch diskriminierungskritische Bildungsarbeit involviert? Und welche Widersprüche und Potenziale für Veränderung zeigen sich in der pädagogischen Auseinandersetzung mit Differenz und Ungleichheit? Literatur Riegel, C. (2016). Bildung, Intersektionalität, Othering. Pädagogisches Handeln in widersprüchelichen Verhältnissen. Bielefeld: transcript Verlag. weiterführende Links Erklärvideo aus \"Vielfalt Mediothek\" Link Link", "literature": "", "sikos": ["E.04", "I.02", "B.06", "E.02", "B.01", "E.03", "E.10", "E.06"]}, {"name": "Partizipation (Stufenmodell)", "description": "Oser warnt vor dem inflationären Gebrauch des Begriffs Partizipation in Schulen und betont, dass echte Partizipation Verantwortung und Wissen erfordert. Er unterscheidet zwischen vollumfänglicher Partizipation, bei der Verantwortung übernommen wird, und Pseudopartizipation, bei der scheinbar Beteiligung stattfindet, aber keine echte Verantwortung besteht. Oser fordert eine klare Definition von Partizipation, die die Reichweite der Verpflichtungen, die Konsequenzen, die gemeinsame Übernahme von Risiken und die erforderlichen Kompetenzen berücksichtigt. Literatur Oser, F. & Biedermann, H. (2006). Partizipation - Ein Begriff, der ein Meister der Verwirrung ist. In. C. Quesel; F. Oser (Hrsg.), Die Mühen der Freiheit. Probleme und Chancen der Partizipation von Kindern und Jugendlichen (S. 17-37). Zürich: Rüegger Verlag. weiterführende Links Link Link Link", "literature": "", "sikos": ["I.05", "B.04", "E.04", "E.03", "L.09"]}, {"name": "Phasenmodell der Teamentwicklung nach Tuckman", "description": "Das Phasenmodell der Teamentwicklung (auch \"Teamuhr\") genannt wurde von Bruce Tuckman in den 1960er-Jahren entwickelt und beschreibt unterschiedliche Phasen, die ein Team im Laufe der Zusammenarbeit durchläuft. Das Modell bietet einen ersten Einstieg, um sich mit Prozessen der Teamentwicklung zu beschäftigen und wurde über die Jahre erweitert und ist bis heute ein äusserst populäres Modell. Literatur Stahl, E. (2017). Dynamik in Gruppen. Handbuch der Gruppenleitung (4. Aufl.). Weinheim, Basel: Beltz Verlag. weiterführende Links Video, 23min https://www.youtube.com/watch?v=hxain-Dnv1s", "literature": "", "sikos": ["I.05", "B.06", "E.02", "B.01", "E.06", "E.01"]}, {"name": "Plan- und Simulationsspiele", "description": "Planspiele gelten als wirkungsvolle Methode, um komplexe Inhalte und soziale Kompetenzen erfahrungsorientiert zu vermitteln.  Der erste Teil von Capaul & Ulrichs Planspiele führt in die theoretischen Grundlagen der Methode ein. Er klärt zentrale Begriffe und zeigt die vier methodischen Quellen der Planspielmethode auf. Zudem erläutern sie verschiedene Formen von Planspielen. So bieten sie ein fundiertes Verständnis für den gezielten Einsatz von Planspielen. Literatur Capaul, R., & Ulrich, M. (2010). Planspiele: Simulationsspiele für Unterricht und Training mit Kurztheorie (2. Aufl.). Altstätten: Tobler. weiterführende Links Link Link Link", "literature": "", "sikos": ["L.06", "L.05"]}, {"name": "Planspiele", "description": "Planspiele, auch Simulationsspiele genannt, dienen dazu, komplexe Handlungssituationen in der vereinfachten Form einer Spielsituation mit modellhafter Anlehnung an die Wirklichkeit gefahrlos erproben zu können. Damit leisten Plan- und Simulationsspiele einen wichtigen Beitrag zur Erlangung von Handlungskompetenzen in Bereichen, welche sich sonst dem schulischen Lernen ganz entziehen oder nicht ohne Gefahren und Risiken bearbeitet werden könnten. Typische Inhalte von Plan- oder Simulationsspielen sind Szenarien aus der nahen Zunkunft, bei der unterschiedliche Entscheidungen zu verschiedenen Spielverläufen und -ergebnissen führen. Literaturhinweis Ulrich, M. & Capaul, R. (2010): Planspiele: Simulationsspiele für Unterricht und Training. KLV Verlag. 1. Auflage. weiterführende Links Planspiele als Mittel für den Unterricht (éducation21 | Bildung für nachhaltige Entwicklung) Sammlung von Planspielen (Bundeszentrale für politische Bildung) Planspiele - didaktische und methodische Hinweise (Landeszentrale für politische Bildung Baden Würtemberg)", "literature": "", "sikos": ["L.03", "L.07", "L.10", "E.04", "E.08", "E.02", "E.06", "L.05", "E.05", "L.06", "E.01"]}, {"name": "Planspiele im Unterricht (Klippert)", "description": "Planspiele fördern selbstständiges, kreatives Arbeiten und soziales Lernen, indem Teilnehmende reale Problem- und Entscheidungssituationen handlungsorientiert erleben. Klippert erläutert didaktische Grundlagen offener Lernformen und zeigt, wie gesellschaftliche, ökologische und wirtschaftliche Fragestellungen in Gruppen bearbeitet werden können. Literatur Klippert, H. (2008). Planspiele. 10 Spielvorlagen zum sozialen, politischen und methodischen Lernen in Gruppen (5., überarbeitete und aktualisierte Auflage). Weinheim / Basel: Beltz. weiterführende Links Link Link Link", "literature": "", "sikos": ["L.06", "L.05"]}, {"name": "Planspielmethodik", "description": "Markus Ulrich untersucht in die gemeinsamen Kernpunkte unterschiedlicher Planspiele – von kurzen, einfachen bis zu komplexen, umfangreichen Szenarien. Anhand von drei Planspielen verschiedener Komplexität zeigt er, wie sich zentrale Elemente der Methode in der Praxis umsetzen lassen. Literatur Ulrich, M. (Jahr). Planspielmethodik: Die Kernpunkte der Planspielmethode und ihre Anwendung in der Praxis . Verlag. weiterführende Links Link Link Link", "literature": "", "sikos": ["L.06", "L.05"]}, {"name": "Planung einer Unterrichtseinheit nach Fraefel", "description": "Fraefel rückt in der Planung von Unterrichtseinheiten die Ziele ins Zentrum. Sie legen fest, welche Kompetenzen die Lernenden am Ende erreichen sollen, und geben damit Richtung für Inhalte, Methoden und Lernaufgaben. Gleichzeitig schaffen sie Transparenz, strukturieren den Lernprozess und machen Lernergebnisse überprüfbar. So bilden Ziele die verbindende Grundlage von Planung, Durchführung und Evaluation. Literatur Fraefel, U. (2023). Erfolgreichen Unterricht planen: Pragmatisch, praktisch, professionell. Münster: Waxmann Verlag (UTB). weiterführende Links Aufgaben als Dreh- und Angelpunkt nach Fraefel Rückwärtsplanung nach Fraefel Bilanzierung und Überprüfung nach Fraefel eine einzelne Stunden planen (Kernpraktiken) nach Fraefel Verbundene Kompetenze L.01 Lernziele formulieren L.02 Lernaufgaben entwickeln L.03 Passende Inhalte aufbereiten L.04 Basistechniken situativ einsetzen B.02 Kriterienorientiert beurteilen", "literature": "", "sikos": ["L.03", "L.02", "L.01", "B.02", "L.04"]}, {"name": "Planungsprozess: wie Unterricht planen?", "description": "Unterricht planen erfolgt meist in Form eines Dreischritts von der Jahresplanung über eine Grobplanung/Wochenplanung zur Feinplanung. Dabei können verschiedene Planungsinstrumente zur Anwendung kommen.", "literature": "Marti, C. & Camenisch, I. (2018). Leitfaden Unterrichtsplanung . Chur: PHGR.", "sikos": ["L.03", "L.07", "L.10", "E.04", "L.02", "B.01", "L.08", "E.03", "L.01", "L.05", "L.09", "L.04", "L.06"]}, {"name": "Professionelle Reflexivität", "description": "Lehrpersonen sind in ihrem Alltag auf Routinen angewiesen. Um nicht nur Erfahrungen zu reproduzieren, bedarf es einer professionellen Reflexivität, welche je nach professionstheoretischer Perspektive unterschiedlich konkretisiert wird. Literatur Idel, T., Schütz, A. & Thünemann, S. (2021). Professionalität im Handlungsfeld Schule. In: J. Dinkelakter et al. (Hrsg.), Professionalität und Professionalisierung pädagogischen Handelns (S. 45-49). Opladen: Verlag Barbara Budrich. weiterführende Links Link Link Link", "literature": "", "sikos": ["I.02"]}, {"name": "Projektunterricht", "description": "In Epochen zu unterrichten, ist eine konstruktive Antwort auf die Frage, wie Unterricht über den herkömmlichen 45-Minuten-Takt gedacht werden kann. Beispielsweise kann der Projektunterricht diese Zerstückelung des Unterrichts aufheben und ganzheitliches Lernen an einem Thema ermöglichen. In dieser Zeit sollen  sich die Lernenden einer Sache selbsttätig annähern und diese eigenständig bearbeiten. Dabei spielt auch das kooperative Lernen eine wichtige Rolle. Literatur Konrad, K.; Traub, S. (2021). Selbstgesteuertes Lernen . Grundwissen und Tipps (6. überarb. und erw. Auflage). Baltmannsweiler: Schneider Verlag Hohengehren. weiterführende Links digitales Lehrmittel \" mein Projekt! \" (Login mit SwitchEDU-ID) Link Link", "literature": "", "sikos": ["L.07", "L.10", "L.02", "E.02", "B.01", "L.08", "L.09", "L.06"]}, {"name": "Prüfungsangst", "description": "Schulstress und Prüfungsängste können das Lernpotenzial erheblich beeinträchtigen. Lehrpersonen und Coaches erhalten mit diesem Buch verständliche und sofort anwendbare Konzepte zur Erklärung und Beratung bei Schulängsten. Kossak geht das Thema entlang der sieben bestimmenden Elemente der Prüfungsangst an: Physiologie, Kognition, Emotion, Motorik, Motivation, Attribution und Imagination. Dabei rückt immer wieder die Wechselwirkung der einzelnen Elemente in den Blick. Wo dieses mehrdimensionale Wissen in die Gespräche mit Lernenden einfliesst, steigt der Erfolg der Beratung deutlich. Literatur Kossak, H.-Ch. (2015). Prüfungsangst - Beraten aus sieben Perspektiven . Heidelberg: Carl-Auer-Systeme Verlag. weiterführende Links Link Link Link", "literature": "", "sikos": ["B.03", "B.06", "B.01", "L.08", "B.05"]}, {"name": "Pädagogische Professionalität", "description": "Der Lehrberuf gilt als Profession. Profession, Professionalisierung, Professionalität sowie professionelles Handeln sind theoretische Begriffe und damit verbundene Konzepte, die im Handlungsfeld Schule seit den 70er Jahren diskutiert werden. Im Bereich der theoretischen Professionsforschung gibt es verschiedene Ansätze. In allen diesen Professionstheorien sind gemeinsame Fragen der Ungewissheit pädagogischen Handelns sowie der Bedeutung von Wissen und Können relevant. Die Reflexivität spielt zudem für die individuelle Professionalisierung eine zentrale Rolle. Literatur Helsper, W. (2021). Professionalität und Professionalisierung pädagogischen Handelns: Eine Einführung. Opladen: Verlag Barbara Budrich weiterführende Links Video Pädagogische Professionalität erklärt von Prof. Dr. Werner Helsper", "literature": "", "sikos": ["I.02"]}, {"name": "Qualitätsmerkmale schulische Elternarbeit", "description": "Der \"Kompass für die partnerschaftliche Zusammenarbeit von Schule und Elternhaus\" nennt umfassend verschiedene Qualitätsmerkmale der Zusammenarbeit mit den Eltern auf Ebene der Schule. Der Kompass kann zur Weiterentwicklung der Elternarbeit an Schulen genutzt werden, da zu jedem Merkmal konkrete Massnahmen genannt werden. Literatur Vodafone Stiftung Deutschland (Hrsg.) (2012). Qualitätsmerkmale schulischer Elternarbeit. Ein Kompass für die partnerschaftliche Zusammenarbeit von Schule und Elternhaus . https://www.vodafone-stiftung.de/wp-content/uploads/2019/06/vfst_qm_elternarbeit_web.pdf. Verifiziert am 19.09.2024.", "literature": "", "sikos": ["I.04", "I.05", "E.07"]}, {"name": "Reflexion im Portfolio", "description": "Reflexion im Portfolio ist ein zentrales Instrument, um Lernprozesse bewusst zu gestalten und zu dokumentieren. Durch die systematische Auseinandersetzung mit eigenen Erfahrungen und Lernfortschritten können Lernende Kompetenzen entwickeln, Selbstwirksamkeit erleben und Lernziele klarer definieren. Reflexive Portfolioarbeit fördert die Verbindung von Theorie und Praxis, unterstützt selbstgesteuertes Lernen und stärkt die Fähigkeit zur kritischen Analyse des eigenen Handelns. Dabei können unterschiedliche Formate, wie schriftliche Einträge, Selbsteinschätzungen oder Feedback von anderen, genutzt werden, um vielfältige Perspektiven auf das eigene Lernen zu eröffnen. Literatur Leonhard, T. (2016). Reflexion im Portfolio. In Ziegelbauer, S. & Gläser-Zikuda, M. (Hrsg.), Das Portfolio als Innovation in Schule, Hochschule und LehrerInnenbildung: Perspektiven aus Sicht von Praxis, Forschung und Lehre (S.45-58). Bad Heilbrunn: Verlag Julius Klinkhardt. weiterführende Links Link Link Link", "literature": "", "sikos": ["I.04", "I.02", "I.01"]}, {"name": "Reteaming & Meisterklasse nach Furman", "description": "Ein Ziel ins Auge fassen und erreichen, die eigene Motivation stärken, Veränderungsprozesse steuern und erfolgreich sein - wer möchte das nicht? Das lösungsfokussierte Programm von Ben Furman und Tapani Ahola führt in logisch aufeinander aufbauenden Schritten durch Veränderungsprozesse in Beruf und Alltag - zielorientiert, nachvollziehbar und leicht umzusetzen. Weil es sehr flexibel und leicht abzuwandeln ist, lässt es sich vielseitig einsetzen: im Coaching oder der Therapie von Einzelpersonen, bei Veränderungsprozessen in Teams oder grossen Organisationen. Immer wieder werfen die Autoren einen Blick auf das Thema \"Motivation\": Woher kommt sie, wie baut man sie auf, und wie kann man sie erhalten? Das Buch strahlt dadurch Zuversicht und Stärke aus. Wer die Lösung eines Problems anstrebt, findet hier seinen Weg zum Erfolg. Literatur Furman, B. & Ahola, T. (2021). Es ist nie zu spät, erfolgreich zu sein. Ein lösungsfokussiertes Programm für Coaching von Organisationen, Teams und Einzelpersonen (3. Aufl.). Heidelberg: Carl-Auer-Systeme Verlag. weiterführende Links http://www.phgr.ch/meisterklasse Vortrag Ben Furman, 51min https://www.youtube.com/watch?v=_OFGcnEOLnk&t=6s", "literature": "", "sikos": ["E.04", "E.08", "E.07", "L.02", "E.09", "E.02", "I.01", "E.10", "B.05", "L.08", "E.03", "E.06", "B.03", "I.05", "I.03", "I.04", "B.01", "L.09", "E.05", "E.01"]}, {"name": "Rolle der Lehrperson", "description": "Peter Larisch beschreibt in seinem Artikel, wie vielfältig die Rolle als Lehrperson sein kann und wie persönliche Vorstellungen von diesem Berufsbild aussehen. Wer Lehrerin werden will, hat oftmals konkrete persönliche Vorstellungen von diesem Berufsbild. In der Schule und in der Lehramtsausbildung wird die Entwicklung eines professionellen Konzepts der Lehrerrolle gefordert und eine konstruktive Auseinandersetzung mit den professionellen Anforderungen. Gern wird der Begriff 'Personale Kompetenzen' dafür gebraucht. In der Ausbildung möchte man sich nicht verbiegen, sondern möglichst authentisch bei der Ausübung des Berufes sein. Hinter diesem Wunsch stecken oftmals recht konkrete persönliche Vorstellungen vom Berufsbild Lehrerinnen, konkreter als es mitunter für den Einzelnen selbst erkennbar ist. Um den Adaptions- und Anpassungsprozess hin zu einem professionellen Konzept über den Lehrerberuf soll es im folgenden Kapitel gehen. Literatur Larisch, P. (2017). Neue Rollen finden und ausfüllen. Individuelle Persönlichkeit - Personale Kompetenzen - Habitus. In: Schaper, C. (Hg.) Werkzeugkoffer Pädagogisches handeln . Ein Handbuch für den Start in den Lehreralltag. Göttingen: Vandenhoeck & Ruprecht GmbH & Co., S. 13-37.", "literature": "", "sikos": ["I.05", "I.03", "I.02", "I.04", "I.01"]}, {"name": "Rückwärtsplanung nach Fraefel", "description": "Fraefel versteht unter Rückwärtsplanung, dass Unterricht konsequent von den angestrebten Kompetenzen und Lernergebnissen her gedacht wird. Statt Inhalte oder Methoden an den Anfang zu stellen, fragt die Planung zuerst: Was sollen die Lernenden am Ende können? Aus diesen Zielvorstellungen werden passende Lernaufgaben, Unterrichtsschritte und Überprüfungsformen abgeleitet. Rückwärtsplanung unterstützt damit eine klare Kompetenzorientierung, erhöht die Kohärenz zwischen Zielen, Aufgaben und Evaluation und verhindert Beliebigkeit in der Unterrichtsgestaltung. Literatur Fraefel, U. (2023). Erfolgreichen Unterricht planen: Pragmatisch, praktisch, professionell. Münster: Waxmann Verlag (UTB). weiterführende Links Aufgaben als Dreh- und Angelpunkt nach Fraefel Planung einer Unterrichtseinheit nach Fraefel Bilanzierung und Überprüfung nach Fraefel eine einzelne Stunden planen (Kernpraktiken) nach Fraefel", "literature": "", "sikos": ["L.02", "B.01", "L.01", "B.02", "L.04"]}, {"name": "Sachanalyse", "description": "Was sollen die Schülerinnen und Schüler inhaltlich lernen, oder: Um welche\nLerninhalte/Themen soll es im Unterricht gehen? Auch in einem an\nKompetenzen orientierten Unterricht ist die Frage nach dem Unterrichtsinhalt\nbei der Planung nach wie vor zentral, denn es gilt: Kompetenzen werden anhand\neines passenden Themas erworben, ihr Aufbau ist somit immer an konkrete Inhalte\ngebunden. Eine\nbewusste inhaltliche Wahl treffen zu können ist für die Lehrperson eng\nverbunden mit der Kenntnis des Lernstands, der Interessen und lebensweltlichen\nErfahrungen der Lernenden und zugleich mit dem Wissen um die Kompetenzen und\nKompetenzstufen, die Lehrplan und Lehrmittel vorgeben.", "literature": "Marti, C.& Camenisch, I. (2018). Leitfaden Unterrichtsplanung . Chur: PHGR.", "sikos": ["L.03", "B.06", "L.02", "B.01", "L.01", "B.02"]}, {"name": "Salutogenese", "description": "Das Modell der Salutogenese wurde vom Gesundheitswissenschaftler Aaron Antonovsky als Alternative zur Pathogenese eingeführt und ist eines der wichtigsten Modelle zur Erklärung von Gesundheit. Es soll die Frage beantworten, wie Gesundheit entsteht, wie Menschen trotz Risiken gesund bleiben können und wie in der Praxis ihre Gesundheit gefördert werden kann. Literatur Frick, J. (2021). Resilienz und Salutogenese im Lehrberuf: Förderung und Aufrechterhaltung der Lehrer*innen-Gesundheit. In: Fröhlich-Gildhoff, K., Rönnau-Böse, M. (eds) Menschen stärken. Studien zur Resilienzforschung. Springer, Wiesbaden. weiterführende Links Definition Salutogenese Praxisbeispiel Gesundheitsförderung mit der Salutogenese", "literature": "", "sikos": ["I.03", "I.02"]}, {"name": "Schulentwicklung kompakt", "description": "Schulen stehen unter wachsendem Entwicklungsdruck durch veränderte Schüler:innen und Umfeldbedingungen. Das Buch nimmt diese Erfahrungen auf, systematisiert sie und gliedert sich in theoretische Grundlagen, Verfahren und Instrumente sowie Perspektiven für die Zukunft. Ziel ist es, Schulen auf dem Weg zur lernenden Organisation zu unterstützen. Die 4. Auflage wurde vollständig überarbeitet und erweitert um die Themen digitaler Wandel und Tiefenstruktur pädagogischen Handelns. Folgende Kapitel sind im Dokument enthalten und können auch als einzelne Konzepte verwendet werden: I. Konzepte von Schulentwicklung II. Schulentwicklung im Zusammenhang des Gesamtsystems III. Arbeit mit Steuergruppen IV. Leitbilder, Schulprogramme und Werte als Orientierung- und Handlungsrahmen V. Bestandsaufnahme und Entwicklungsschwerpunkte VI. Unterrichtsentwicklung und Professionelle Lerngemeinschaften (PLGs) VII. Gelingens- und Misslingensbedingungen von Schulentwicklung XII. Duplexstruktur des pädagogischen Handelns: Schulentwicklung geht in die Tiefe Literatur Rolff, H.-G. (2023). Schulentwicklung kompakt (4., aktualisierte Aufl.). Beltz.", "literature": "", "sikos": ["I.04", "I.05"]}, {"name": "selbstgesteuert lernen in Projekten", "description": "Lernen in Projekten setzt voraus, dass die Schüler:innen ihr Lernen weitestgehend selbst steuern. In der Schule können sie das in der Regel nicht von selbst. Vielmehr müssen Selbststeuerung und das Lernen in Projekten gelernt, also gelehrt werden. Wie kann das gelingen? Literatur Traub, S. (2025). Selbstgesteuert lernen in Projekten. Pädagogik , 8, 12–16. weiterführende Links weiterer Text von Silke Traub (2011)", "literature": "", "sikos": ["L.06", "L.09"]}, {"name": "Selbstkonzept", "description": "Hier geht es um schulbezogene und ausserschulische Selbstkonzepte. Es soll dargestellt werden, wie sich schulbezogene Selbstkonzepte entwickeln, wodurch sie beeinflusst werden und welche Auswirkungen sie auf das Erleben und Verhalten von Personen haben. Zunächst sollen kurz die theoretischen Wurzeln der pädagogisch-psychologischen Selbstkonzeptforschung beschrieben werden, indem dargestellt wird, wie von James und im symbolischen Interaktionismus über das „Selbst“ gedacht wurde. Zudem werden gedächtnis- und entwicklungspsychologische Selbstkonzeptmodelle skizziert und die Kernmerkmale sozialpsychologischer Selbstkonzeptforschung aufgeführt. Danach erfolgt eine eingehende Beschreibung von Struktur, Stabilität und Erfassung des Selbstkonzepts, bevor die Determinanten des Selbstkonzepts beschrieben werden. Anschließend wird die Bedeutung des Selbstkonzepts für schulische Leistungen und Wahlentscheidungen dargestellt. Abschließend werden Möglichkeiten der Förderung des Selbstkonzepts vorgestellt. Literatur Möller, J. & Trautwein, U. (2020). Selbstkonzept. In: E. Wild & J. Möller, J. (Hrsg.) Pädagogische Psychologie. Springer-Lehrbuch (107-119). Springer, Berlin, Heidelberg. weiterführende Links Link Link Link", "literature": "", "sikos": ["B.03", "E.04", "B.06", "E.08", "I.04", "E.02", "B.01", "I.01", "E.03", "E.10", "B.05", "L.09", "E.05"]}, {"name": "Selbstwirksamkeitserwartung", "description": "Der vorliegende Artikel zeigt auf, was die\nSelbstwirksamkeitserwartung einer Lehrkraft\nbzw. einer Schülerin oder eines Schülers für das\nAufgreifen und die Bewältigung von Aufgaben\nim schulischen Kontext bedeuten kann. Dazu\nwird zunächst das theoretische Konzept der\nSelbstwirksamkeitserwartung von Bandura\n(1997) erläutert. Daran anschließend wird\naufgezeigt, welche Aspekte förderlich auf die\nEntwicklung der Selbstwirksamkeitserwartung\neines Menschen einwirken können. Auf dieser\nBasis werden konkrete Möglichkeiten der\nFörderung des individuellen und kollektiven\nSelbstwirksamkeitserlebens von Schülerinnen\nund Schülern sowie von Lehrkräften dargestellt. Literatur Urton, K. (2017). Selbstwirksamkeitserwartung - Was bedingt sie und wie kann sie gefördert werden? Potsdamer Zentrum für empirische Inklusionsforschung (ZEIF) , (3), S. 1-12. weiterführende Links Link Link Link", "literature": "", "sikos": ["B.03", "B.04", "B.06", "E.08", "B.01", "I.01", "E.10", "L.09", "E.05"]}, {"name": "Single Point Rubric", "description": "Ein Single Point Rubric nach Fluckiger ist ein vereinfachtes Bewertungsinstrument, das nur eine Spalte mit den Kriterien für eine akzeptable Leistung darstellt. Neben dieser Mittelspalte gibt es Platz für individuelles Feedback zu Stärken und Verbesserungsmöglichkeiten. Dieser Ansatz fördert konstruktives Feedback und macht den Bewertungsprozess transparent und fokussiert. Literatur Fluckiger, J. (2010). Single Point Rubric: A Tool für Responsible Student Self-Assessment. Teacher Education Faculty Publication, 17-25. weiterführende Links Link Link Link", "literature": "", "sikos": ["B.04", "B.06", "L.08", "B.05", "L.09", "B.02"]}, {"name": "Soziale Herkunft", "description": "Sturm (2024) thematisiert im Kapitel 4.2, wie unterschiedliche milieuspezifische Erfahrungen von Schüler:innen zu ungleichen Bildungschancen führen. Dabei wird insbesondere die schulische Leistung als zentrale Differenzkategorie analysiert, die soziale Ungleichheiten reproduziert, anstatt sie auszugleichen. Sozio-ökonomisch benachteiligte Kinder und Jugendliche erleben häufig Passungsprobleme im Unterricht, da ihre kulturellen und sprachlichen Ressourcen nicht ausreichend berücksichtigt werden. Studien belegen, dass diese Schüler:innen systematisch geringere Chancen auf höhere Bildungsabschlüsse haben, was bestehende gesellschaftliche Ungleichheiten weiter verstärkt. Literatur Sturm, T. (2024). Lehrbuch Differenzen in der Schule. München: Ernst Reinhardt Verlag. weiterführende Links Link Link Link", "literature": "", "sikos": ["E.03", "E.04", "B.01"]}, {"name": "Soziale Perspektivenübernahme", "description": "Auf Basis von Piagets Theorie der kognitiven Entwicklung und im Hinblick auf Kohlbergs Theorie der\nMoralentwicklung zeigt Selman empirisch, wie ein Kind soziales Verstehen erlernt: In vier Entwicklungsschritten\nerwirbt es grundlegende Fähigkeiten, in unterschiedlichen Handlungsfeldern die Wirklichkeit von sozial gerahmten\nindividuellen Handlungsperspektiven in ihren komplexen Verschränkungen zu berücksichtigen. Literatur Selman, R. L. (1984). Die Entwicklung des sozialen Verstehens. Entwicklungspsychologische und klinische Untersuchen . Frankfurt am Main: Suhrkamp. weiterführende Links Link Link Link", "literature": "", "sikos": ["I.05", "E.04", "B.06", "E.02", "B.01", "E.03", "E.06", "E.10", "B.05", "E.05"]}, {"name": "Soziale Wahrnehmung", "description": "Mit der sozialen Wahrnehmung wird der Einschätzungsprozess beschrieben, dem wir unterliegen, wenn wir uns ein Bild von anderen Personen machen. Eine Vielzahl von Faktoren beeinflussen und verzerren unsere Wahrnehmung und führen dazu, dass verschiedene Leute die gleiche Person unterschiedlich einschätzen. Ein besseres Verständnis dieses Prozesses hilft, das Ergebnis der sozialen Wahrnehmung einzuschätzen und einzuordnen. Literatur Werth, L, Denzler, M. & Mayer, J. (2020). Sozialpsychologie - Das Individuum im sozialen Kontext. Wahrnehmen - Denken - Fühlen (2. Aufl.). Heidelberg: Springer. weiterführende Links Link", "literature": "", "sikos": ["E.03", "E.08", "I.02", "B.01"]}, {"name": "Spiel in Kindheit und Jugend", "description": "Was Kinder und Jugendliche im Spiel lernen, lernen sie leichter. Aber erst auf dem Boden tragender Beziehungen zu Erwachsenen und Gleichaltrigen ist Lernen im Spiel ertragreich. Doch wie wird das Spiel eigentlich definiert und welche Merkmale zeichnen lernförderliches Spielen aus? In diesem Studienbuch werden die wichtigsten Forschungsbefunde für das Lernen im Spiel beschrieben: Vom frühen Eltern-Kind-Spiel über Rollen- und Sportspiele bis hin zu den Shotter-Games und anderen digitalen Spielen. Literatur Hauser, B. (2021). Spiel in Kindheit und Jugend. Der natürliche Modus des Lernens. Bad Heilbrunn: Verlag Julius Klinkhardt. weiterführende Links Link Link Link", "literature": "", "sikos": ["E.05", "L.07", "E.02", "L.05"]}, {"name": "Systemisch-Lösungsorientierte Beratung", "description": "Lösungssuche statt Problemanalyse: Die lösungsorientierte Beratung findet immer größere Resonanz, sei es in der Arbeit mit Einzelnen, in Gruppen, in Beratungsstellen oder im Coaching. Lösungsorientierung bedeutet dabei, sich auf die Ressourcen, Potenziale und Stärken zu konzentrieren, denn diese liefern die Impulse für persönliches Wachstum und ermöglichen so Lösungen in schwierigen und herausfordernden Lebenslagen. Literatur Bamberg, G. G. (2022). Lösungsorientierte Beratung. Praxishandbuch (6. Aufl.). Weinheim: Beltz. weiterführende Links Link Link Link", "literature": "", "sikos": ["B.03", "I.05", "E.04", "E.08", "E.09", "E.02", "E.06", "E.10", "B.05", "L.09", "E.05", "E.01", "E.07"]}, {"name": "Systemische Biografiearbeit nach Röhrbein", "description": "Das 21. Jahrhundert bietet für viele Menschen unzählige Möglichkeiten, ihr Leben zu gestalten. Gleichzeitig hält es reichlich Unsicherheiten bereit: Ausbildungen halten nicht mehr ein Leben lang, Zeitverträge führen zu Patchwork-Biografien, Lebensplanung wird zum Lotteriespiel. Wer Menschen in ihrer Entwicklung begleitet, muss ihnen die richtigen Fragen stellen. Ansgar Röhrbein gibt einen praxisorientierten Einblick in die professionelle Biografiearbeit. Er erklärt Grundbegriffe, beschreibt Voraussetzungen, Sinn und Stärken der Biografiearbeit und liefert Anleitungen für die Praxis in verschiedenen Arbeitskontexten: Berufs- und Studienberatung, Familien- und Lebensberatung können genauso den Rahmen für biografisches Arbeiten bilden wie der Allgemeine Soziale Dienst. Literatur Röhrbein, A. (2021). Und das ist noch nicht alles. Systemische Biografiearbeit (2. Aufl.). Heidelberg: Carl-Auer-Systeme Verlag. weiterführende Links Link Link Link", "literature": "", "sikos": ["I.03", "E.08", "E.09", "E.02", "I.01", "E.03", "E.10"]}, {"name": "Systemische Pädagogik", "description": "Die systemische Pädagogik zeichnet sich dadurch aus,\ndass sie das Verhalten und Lernen von Menschen nicht\nisoliert anhand persönlicher Eigenschaften beschreibt,\nsondern vor allem in seinen sozialen Beziehungen\nbeobachtet. In dieser Einführung zeigt Mosell die hohe\nRelevanz der systemischen Pädagogik für den Schulalltag auf. Literatur Mosell, R. (2016). Systemische Pädagogik. Ein Leitfaden für Praktiker. Weinheim: Beltz. weiterführende Links Link Link Link", "literature": "", "sikos": ["I.05", "I.02", "B.06", "E.09", "B.01", "L.09", "E.05", "E.07"]}, {"name": "Systemische Schul- und Unterrichtsentwicklung", "description": "Systemische Schul- und Unterrichtsentwicklung betrachtet Schule als vernetztes System, in dem Unterricht, Kollegium und Organisationsstrukturen wechselseitig aufeinander wirken. Ziel ist es, Entwicklungsprozesse so zu gestalten, dass sowohl die Unterrichtsqualität als auch die Zusammenarbeit im Kollegium kontinuierlich verbessert werden. Dabei werden systemische Zusammenhänge und Rückkopplungen zwischen schulischen Ebenen konsequent berücksichtigt. Literatur Lüscher, A. & Weibel, H. (2019). Systemische Schul- und Unterrichtsentwicklung. In Pädagogische Hochschule Luzern (Hrsg.), Studienband 5. und 6. Semester, Ausbildung – Mentorat Primarstufe (S. 6–30). Selbstverlag. https://irf.fhnw.ch/handle/11654/30843", "literature": "", "sikos": ["I.04", "I.05", "I.02"]}, {"name": "Theoretischer Bezugsrahmen für Schulentwicklung", "description": "Das Feld der Schulentwicklung ist unübersichtlich und häufig theorielos, da es stark von praktischen Erfahrungen und normativen Empfehlungen geprägt ist. Empirische Generalisierungen oder eklektische Theoriebezüge ersetzen bislang einen konsistenten Bezugsrahmen. Reinbacher (2016) entwickelt deshalb – in Anlehnung an Parsons und Fend – einen theoretischen Rahmen, der individuelle und kollektive Dimensionen schulischen Handelns integriert, die verschiedenen Handlungsebenen berücksichtigt und Entwicklungsprozesse in gesellschaftliche Strukturen einbettet. Literatur Reinbacher, P. (2016). Ein theoretischer Bezugsrahmen für „Schulentwicklung“. Schweizerische Zeitschrift für Bildungswissenschaften, 38(2), 295–318. https://doi.org/10.25656/01:14782", "literature": "", "sikos": ["I.04", "I.05"]}, {"name": "Universal Design for Learning (UDL)", "description": "Beim Universal Design for Learning handelt es sich um ein Konzept, das das Lehren und Lernen verbessern soll. Es basiert auf neuen Erkenntnissen der Lehr-Lernforschung und nutzt die digitalen Technologien. Das Ziel von UDL ist es, eine Lernumgebung zu gestalten, die für alle Lernenden zugänglich ist und deren Lernerfahrungen zu optimieren. Dabei stützt sich UDL auf die Forschung in den Neurowissen // ═══════════════════════════════════════════════════════════════════
//  MARKDOWN → HTML
// ═══════════════════════════════════════════════════════════════════
function renderBot(text) {
  // [KOLLISION] Block
  text = text.replace(/\[KOLLISION\]:?\s*([\s\S]*?)(?=\[FRAGE\]|$)/gi, function(_, body) {
    return '<div class="collision-block"><span class="collision-label">Kollision</span>' + body.trim().replace(/\n/g,'<br>') + '</div>';
  });
  // [FRAGE] Block
  text = text.replace(/\[FRAGE\]:?\s*([\s\S]*)/gi, function(_, body) {
    return '<div class="question-block"><span class="question-label">Frage</span>' + body.trim().replace(/\n/g,'<br>') + '</div>';
  });
  // **bold** → gelb
  text = text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
  // *italic*
  text = text.replace(/\*(.*?)\*/g, '<em>$1</em>');
  // Zeilenumbrüche
  text = text.replace(/\n/g, '<br>');
  return text;
}

function esc(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ═══════════════════════════════════════════════════════════════════
//  PASSWORT-OVERLAY
// ═══════════════════════════════════════════════════════════════════
const pwOverlay = document.getElementById('pw-overlay');
const pwInput   = document.getElementById('pw-input');
const pwBtn     = document.getElementById('pw-btn');
const pwError   = document.getElementById('pw-error');
let   accessPassword = '';

async function tryPassword() {
  const pw = pwInput.value.trim();
  if (!pw) return;
  pwBtn.textContent = '…';
  pwBtn.disabled = true;
  // Passwort gegen Worker validieren mit einem Mini-Ping
  try {
    const r = await fetch(WORKER_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        access_password: pw,
        model: MODEL,
        max_tokens: 10,
        system: 'Respond only: OK',
        messages: [{ role: 'user', content: 'ping' }]
      })
    });
    if (r.status === 401) {
      pwError.textContent = 'Falscher Zugangscode – bitte erneut versuchen.';
      pwInput.value = ''; pwInput.focus();
    } else if (!r.ok) {
      pwError.textContent = 'Verbindungsfehler – Worker nicht erreichbar.';
    } else {
      accessPassword = pw;
      pwOverlay.style.display = 'none';
      initChat();
    }
  } catch(e) {
    pwError.textContent = 'Verbindungsfehler: ' + e.message;
  }
  pwBtn.textContent = 'WEITER →';
  pwBtn.disabled = false;
}

pwBtn.addEventListener('click', tryPassword);
pwInput.addEventListener('keydown', e => { if (e.key === 'Enter') tryPassword(); });

// ═══════════════════════════════════════════════════════════════════
//  CHAT
// ═══════════════════════════════════════════════════════════════════
const chatEl  = document.getElementById('chat-container');
const input   = document.getElementById('user-input');
const sendBtn = document.getElementById('send-btn');
let history   = [];
let busy      = false;

function append(role, content, isHTML) {
  const wrap = document.createElement('div');
  wrap.className = 'message ' + role;
  const label = document.createElement('div');
  label.className = 'msg-label';
  label.textContent = role === 'bot' ? 'Konzeptothek' : 'Du';
  const bubble = document.createElement('div');
  bubble.className = 'msg-bubble';
  if (isHTML) bubble.innerHTML = content;
  else bubble.innerHTML = esc(content).replace(/\n/g, '<br>');
  wrap.appendChild(label);
  wrap.appendChild(bubble);
  chatEl.appendChild(wrap);
  chatEl.scrollTop = chatEl.scrollHeight;
}

function showTyping() {
  const w = document.createElement('div');
  w.className = 'typing-wrap'; w.id = 'typing';
  w.innerHTML = '<div class="msg-label">Konzeptothek</div><div class="typing-dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>';
  chatEl.appendChild(w); chatEl.scrollTop = chatEl.scrollHeight;
}
function rmTyping() { const t = document.getElementById('typing'); if (t) t.remove(); }

async function callAPI(msgs, maxTokens) {
  const r = await fetch(WORKER_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      access_password: accessPassword,
      model: MODEL,
      max_tokens: maxTokens || 900,
      system: SYSTEM_PROMPT,
      messages: msgs
    })
  });
  if (r.status === 401) throw new Error('401');
  if (!r.ok) throw new Error('API ' + r.status + ': ' + await r.text());
  return (await r.json()).content[0].text;
}

async function send() {
  const txt = input.value.trim();
  if (!txt || busy) return;
  input.value = ''; input.style.height = 'auto';
  busy = true; sendBtn.disabled = true;
  append('user', txt, false);
  history.push({ role: 'user', content: txt });
  showTyping();
  try {
    const reply = await callAPI(history);
    rmTyping();
    append('bot', renderBot(reply), true);
    history.push({ role: 'assistant', content: reply });
  } catch(e) {
    rmTyping();
    if (e.message === '401') {
      pwOverlay.style.display = 'flex';
      pwError.textContent = 'Sitzung abgelaufen – bitte erneut einloggen.';
      pwInput.value = ''; pwInput.focus();
    } else {
      const w = document.createElement('div');
      w.className = 'message bot';
      w.innerHTML = '<div class="msg-label">System</div><div class="error-bubble">&#9888; ' + esc(e.message) + '<br><br>Worker-URL oder Zugangscode prüfen.</div>';
      chatEl.appendChild(w);
    }
  }
  busy = false; sendBtn.disabled = false; input.focus();
}

input.addEventListener('input', function() {
  this.style.height = 'auto';
  this.style.height = Math.min(this.scrollHeight, 130) + 'px';
});
input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});
sendBtn.addEventListener('click', send);

// ═══════════════════════════════════════════════════════════════════
//  CHAT INITIALISIEREN (nach PW-Eingabe)
// ═══════════════════════════════════════════════════════════════════
async function initChat() {
  input.focus();
  showTyping();
  try {
    const opening = await callAPI([{
      role: 'user',
      content: '[SYSTEM-INIT] Eröffne das Gespräch. Direkt, ohne Begrüssung oder Kundenservice-Ton. 2-3 Sätze die deine Rolle als konzeptueller Provokateur etablieren. Dann eine einzige Frage, die die Person einlädt, ihre theoretische Landschaft zu beschreiben – konkret, einladend, nicht abstrakt.'
    }], 350);
    rmTyping();
    append('bot', renderBot(opening), true);
    history.push({ role: 'assistant', content: opening });
  } catch(e) {
    rmTyping();
    if (e.message === '401') {
      pwOverlay.style.display = 'flex';
      pwError.textContent = 'Falscher Zugangscode – bitte erneut versuchen.';
      pwInput.value = ''; pwInput.focus();
    } else {
      const fb = 'Hier werden keine Konzepte erklärt. Hier entstehen Kollisionen.\n\nMit welchen Theorien oder Konzepten arbeitest du gerade – und in welchem SiKo?';
      append('bot', renderBot(fb), true);
      history.push({ role: 'assistant', content: fb });
    }
  }
}

<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Konzeptothek-Bot | PHGR Master SEK I & II</title>
  <style>
    :root {
      --phgr-gelb: #c7d200;
      --phgr-tuerkis: #23b2c6;
      --phgr-rot: #ed6a69;
      --phgr-orange: #fbb900;
      --phgr-violett: #6169af;
      --bg: #161616;
      --surface: #1f1f1f;
      --surface2: #2a2a2a;
      --surface3: #333;
      --text: #e2e2e2;
      --text-muted: #777;
      --text-dim: #555;
      --border: #2e2e2e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Georgia', 'Times New Roman', serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Header ── */
    header {
      background: var(--surface);
      border-bottom: 2px solid var(--phgr-gelb);
      padding: 11px 20px;
      display: flex;
      align-items: center;
      gap: 14px;
      flex-shrink: 0;
      user-select: none;
    }
    .back-btn {
      font-family: monospace;
      font-size: 0.72em;
      letter-spacing: 0.06em;
      color: var(--text-muted);
      text-decoration: none;
      border: 1px solid var(--border);
      padding: 4px 9px;
      transition: color 0.2s, border-color 0.2s;
      white-space: nowrap;
    }
    .back-btn:hover { color: var(--phgr-gelb); border-color: var(--phgr-gelb); }
    .phgr-logo { font-size: 1.35em; line-height: 1; letter-spacing: -0.01em; }
    .phgr-logo .ph { font-family: Georgia, serif; font-style: italic; font-weight: 700; color: var(--phgr-gelb); }
    .phgr-logo .gr { font-family: Georgia, serif; font-variant: small-caps; font-weight: 300; color: var(--text); letter-spacing: 0.05em; }
    .header-title-block { flex: 1; }
    .header-title { font-family: 'Georgia', serif; font-size: 1em; font-weight: bold; letter-spacing: 0.12em; text-transform: uppercase; color: var(--text); }
    .header-subtitle { font-size: 0.68em; color: var(--text-muted); font-style: italic; margin-top: 1px; letter-spacing: 0.03em; }
    .badge { font-family: monospace; font-size: 0.62em; font-weight: bold; letter-spacing: 0.06em; background: var(--phgr-gelb); color: #1a1a1a; padding: 3px 7px 2px; white-space: nowrap; }

    /* ── Passwort-Overlay ── */
    #pw-overlay {
      position: fixed; inset: 0; background: rgba(22,22,22,0.97);
      display: flex; align-items: center; justify-content: center;
      z-index: 100; flex-direction: column; gap: 18px;
      padding: 24px;
    }
    #pw-overlay .pw-logo { font-size: 2em; }
    #pw-overlay .pw-logo .ph { font-family: Georgia, serif; font-style: italic; font-weight: 700; color: var(--phgr-gelb); }
    #pw-overlay .pw-logo .gr { font-family: Georgia, serif; font-variant: small-caps; font-weight: 300; color: var(--text); letter-spacing: 0.05em; }
    #pw-overlay h2 { font-family: Georgia, serif; font-size: 1.1em; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text); text-align: center; }
    #pw-overlay p { font-size: 0.8em; color: var(--text-muted); font-style: italic; text-align: center; max-width: 320px; }
    .pw-box { display: flex; gap: 0; max-width: 340px; width: 100%; }
    #pw-input {
      flex: 1; background: var(--surface2); border: 1px solid var(--border); border-right: none;
      color: var(--text); padding: 11px 14px; font-family: Georgia, serif; font-size: 0.95em;
      outline: none; letter-spacing: 0.08em;
    }
    #pw-input:focus { border-color: var(--phgr-gelb); }
    #pw-input::placeholder { color: var(--text-dim); letter-spacing: 0.02em; font-style: italic; }
    #pw-btn {
      background: var(--phgr-gelb); color: #111; border: none;
      padding: 11px 18px; font-family: monospace; font-size: 0.85em;
      font-weight: bold; letter-spacing: 0.06em; cursor: pointer;
      transition: opacity 0.15s;
    }
    #pw-btn:hover { opacity: 0.85; }
    #pw-error { font-family: monospace; font-size: 0.75em; color: var(--phgr-rot); min-height: 1em; text-align: center; }

    /* ── Chat ── */
    #chat-container { flex: 1; overflow-y: auto; padding: 28px 24px 12px; display: flex; flex-direction: column; gap: 20px; scroll-behavior: smooth; }
    #chat-container::-webkit-scrollbar { width: 3px; }
    #chat-container::-webkit-scrollbar-thumb { background: var(--phgr-gelb); border-radius: 2px; }

    .message { display: flex; flex-direction: column; max-width: 82%; animation: msgIn 0.25s ease both; }
    @keyframes msgIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .message.bot  { align-self: flex-start; }
    .message.user { align-self: flex-end; }
    .msg-label { font-family: monospace; font-size: 0.62em; letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 5px; color: var(--text-dim); }
    .message.user .msg-label { text-align: right; }

    .msg-bubble { padding: 13px 17px; line-height: 1.75; font-size: 0.93em; }
    .message.bot .msg-bubble {
      background: var(--surface2);
      border-left: 3px solid var(--phgr-gelb);
      border-radius: 0 6px 6px 2px;
      color: var(--text);
    }
    .message.user .msg-bubble {
      background: var(--phgr-gelb);
      color: #111;
      font-family: Georgia, serif;
      border-radius: 6px 6px 2px 6px;
    }

    /* Strukturierte Antwortblöcke */
    .msg-bubble strong { color: var(--phgr-gelb); font-weight: 600; }
    .msg-bubble em { color: #bbb; font-style: italic; }
    .collision-block {
      margin: 10px 0 8px;
      padding: 10px 14px;
      border-left: 3px solid var(--phgr-tuerkis);
      background: rgba(35,178,198,0.07);
      line-height: 1.7;
      border-radius: 0 4px 4px 0;
    }
    .collision-label {
      font-family: monospace; font-size: 0.72em; letter-spacing: 0.1em;
      text-transform: uppercase; color: var(--phgr-tuerkis); display: block; margin-bottom: 5px;
    }
    .question-block {
      margin-top: 12px;
      padding: 10px 14px;
      border-left: 3px solid var(--phgr-orange);
      background: rgba(251,185,0,0.07);
      font-style: italic;
      color: #ddd;
      border-radius: 0 4px 4px 0;
    }
    .question-label {
      font-family: monospace; font-size: 0.72em; letter-spacing: 0.1em;
      text-transform: uppercase; color: var(--phgr-orange); display: block;
      margin-bottom: 5px; font-style: normal;
    }

    /* Typing */
    .typing-wrap { align-self: flex-start; animation: msgIn 0.25s ease both; }
    .typing-dots { display: flex; gap: 5px; padding: 13px 17px; background: var(--surface2); border-left: 3px solid var(--phgr-gelb); border-radius: 0 6px 6px 2px; }
    .dot { width: 7px; height: 7px; background: var(--phgr-gelb); border-radius: 50%; opacity: 0.4; animation: dotBounce 1.3s infinite; }
    .dot:nth-child(2) { animation-delay: 0.18s; }
    .dot:nth-child(3) { animation-delay: 0.36s; }
    @keyframes dotBounce { 0%,60%,100% { transform: translateY(0); opacity: 0.4; } 30% { transform: translateY(-7px); opacity: 1; } }

    /* Input */
    #input-wrap { background: var(--surface); border-top: 1px solid var(--border); padding: 14px 20px; display: flex; gap: 10px; align-items: flex-end; flex-shrink: 0; }
    #input-col { flex: 1; display: flex; flex-direction: column; gap: 5px; }
    #user-input {
      width: 100%; background: var(--surface2); border: 1px solid var(--border);
      color: var(--text); padding: 11px 15px; font-family: Georgia, serif;
      font-size: 0.92em; resize: none; min-height: 46px; max-height: 130px;
      line-height: 1.55; transition: border-color 0.2s; outline: none; border-radius: 2px;
    }
    #user-input:focus { border-color: var(--phgr-gelb); }
    #user-input::placeholder { color: var(--text-dim); font-style: italic; }
    .input-hint { font-family: monospace; font-size: 0.6em; color: var(--text-dim); letter-spacing: 0.04em; }
    #send-btn {
      background: var(--phgr-gelb); color: #111; border: none;
      width: 46px; height: 46px; font-size: 1.25em; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; transition: opacity 0.15s, transform 0.1s; border-radius: 2px;
    }
    #send-btn:hover:not(:disabled) { opacity: 0.85; transform: scale(1.04); }
    #send-btn:disabled { opacity: 0.25; cursor: not-allowed; transform: none; }
    .error-bubble { background: #2a1515; border-left: 3px solid var(--phgr-rot); color: #e8a0a0; padding: 12px 16px; font-size: 0.85em; font-family: monospace; line-height: 1.5; }
  </style>
</head>

alyse", "description": "Wer soll etwas lernen? Wenn man sich bei der Planung einer Unterrichtseinheit zunächst dieser Frage widmet, rücken das bereits vorhandene Wissen und Können, die Ressourcen und Interessen der Lerngruppe ins Zentrum. Das Erfassen und Abklären der Voraussetzungen der Lernenden und der Merkmale der Gesamtsituation, in der ihr Lernen stattfinden soll, wird an der PHGR als wichtiger und grundlegender Schritt zu Beginn des Planungsprozesses erachtet. Aus der Analyse dieser Bedingungen ergeben sich vielfältige Konsequenzen für den zu planenden Unterricht.", "literature": "Marti, C., Camenisch, I. (2018). Leitfaden Unterrichtsplanung. PHGR.", "sikos": ["L.03", "B.06", "L.02", "B.01", "L.08", "L.09", "L.01"]}, {"name": "Behinderungsparadigmen", "description": "Der Text beschreibt den Begriff der Behinderung und die verschiedenen Sichtweisen und Paradigmen, die damit verbunden sind. Der Begriff der Behinderung ist komplex und umstritten, und es gibt unterschiedliche Definitionen und Ansätze, um ihn zu beschreiben. Die Paradigmen umfassen das personenorientierte Paradigma, das interaktionistische Paradigma, das systemtheoretische Paradigma und das gesellschaftstheoretische Paradigma, die jeweils unterschiedliche Ursachen und Perspektiven auf Behinderung betonen. Literatur Scholz, M. (2010). Presse und Behinderung. Eine qualitative und quantitative Untersuchung. Wiesbaden: Verlag für Sozialwissenschaften. weiterführende Links Link Link Link", "literature": "", "sikos": ["E.04", "B.06", "B.01", "E.03", "E.10", "B.05"]}, {"name": "Belastung und Beanspruchung im Lehrerberuf", "description": "Das Thema Belastung und Beanspruchung im Lehrerberuf bildet einen Schwerpunkt der empirischen Forschung zum Lehrerberuf. In der zweiten Auflage des Lehrbuchs wird auf der Basis aktueller Forschungsbefunde und Fachdiskussionen ein verständlicher und orientierender Überblick zu den Grundlagen, Modellen, aktuellen Forschungsansätzen und -ergebnissen gegeben. Vor allem für S rbildung und zeitgemässen Anstellungsbedingungen enthalten. Literatur LCH - Dachverband Lehrerinnen und Lehrer Schweiz (2014). Der Berufsauftrag der Lehrerinnen und Lehrer. Zürich: LCH. weiterführende Links Homepage LCH: Berufsgrundlagen Link Link", "literature": "", "sikos": ["I.05", "I.02", "I.03", "I.04", "E.07"]}, {"name": "Berufsbildung CH", "description": "Der Text fokussiert primär den Übergang von der obligatorischen in die nachobligatorische Ausbildung in der Schweiz. Die Berufswahl resp. Lehrstellensuche wird ebenso thematisiert wie der Lehrstellenmarkt, die Selektion von Lernenden sowie Brückenangebote und das Case Management. Der Text schliesst mit einem Ausblick auf die Zukunft der beruflichen Grundbildung. Literatur Wettstein, E., Schmid, E. & Gonon, P. (2014). Berufsbildung in der Schweiz. Formen, Strukturen, Akteure (2., vollständig überarbeitete und erweiterte Auflage). Bern: hep. Daraus Kap. 4: Von der Schule ins Erwerbsleben. weiterführende Links Link Link Link", "literature": "", "sikos": ["E.10", "I.05"]}, {"name": "Berufswahl als Copingprozess", "description": "Der Text legt den Fokus auf eine bestimmte Ansicht, den Berufswahlprozess von den Jugendlichen her zu betrachten: den Coping-Ansatz. Dieser geht davon aus, dass Menschen intentionale Wesen sind, die sich mit den Bedingungen und Anforderungen an ihre Lebensgestaltung aktiv und konstruktiv auseinandersetzen. Dabei sind sie in der Lage, Freiräume und Ressourcen optimal für sich zu nutzen. Literatur Herzog, W. & Makarova, E. (2020). Berufsorientierung als Copingprozess. In T. Brüggemann & S. Rahn (Hrsg.), Berufsorientierung. Ein Lehr- und Arbeitsbuch (2., überarbeitete und erweiterte Auflage), S. 73-82. Münster: Waxmann. weiterführende Links Link Link Link", "literature": "", "sikos": ["E.10", "B.05", "I.05"]}, {"name": "Berufswahltheorien", "description": "Im Text werden mehrere klassische und neuere Berufswahltheorien zusammenfassend dargestellt, darunter diejenigen von Holland oder Super, und Theorien der Laufbahnentwicklung. Die neueren Theorien berücksichtigen den Umstand, dass Jugendliche als komplexe, sich selbst gestaltende und in permanenter Interaktion mit der Umwelt stehende \"Systeme\" betrachtet werden können. Literatur Hirschi, A. & Baumeler, F. (2020). Berufswahltheorien - Entwicklung und Stand der Diskussion. In T. Brüggemann & S. Rahn (Hrsg.), Berufsorientierung. Ein Lehr- und Arbeitsbuch (2., überarbeitete und erweiterte Auflage), S. 31-42. Münster: Waxmann. weiterführende Links Link Link Link", "literature": "", "sikos": ["E.10", "B.05"]}, {"name": "Berufswahlunterricht", "description": "Im Text werden Ansätze für einen handlungsbefähigenden Berufswahlunterricht skizziert, darunter der Aufbau von Wissen, die Förderung von Selbstwirksamkeit und die Sinnfindung. Diese Prinzipien behalten auch dann ihre Gültigkeit, wenn Jugendliche eine eingeschränkte Bereitschaft zeigen, Unterstützung anzunehmen. Literatur Düggeli, A. & Kinder, K. (2020). Wissen aufbauen, Selbstwirksamkeit fördern und Sinnfindung begleiten. Ansätze für einen handlungsbefähigenden Berufswahlunterricht. In T. Brüggemann & S. Rahn (Hrsg.), Berufsorientierung. Ein Lehr- und Arbeitsbuch (2., überarbeitete und erweiterte Auflage), S. 303-311. Münster: Waxmann. weiterführende Links Link Link Link", "literature": "", "sikos": ["E.08", "E.10", "B.05"]}, {"name": "Beziehung Lehrer:in - Schüler:in", "description": "Die Lehrer-Schüler-Beziehung ist eine der entscheidensten aber auch komplexesten Determinanten erfolgreicher Bildungsprozesse — von der Primarschule bis zum Schulabschluss. Sie kann von verschiedenen theoretischen\nAnsätzen aus beleuchtet werden. Literatur Hagenauer, G. & Raufelder, D. (2022). Lehrer*innen-Schüler*innen-Beziehung. In: T. Hascher, T.-S. Idel, W. Helsper (Hrsg.), Handbuch Schulforschung. Band 2 (S. 979-997). Wiesbaden: Springer. weiterführende Links Link Link Link", "literature": "", "sikos": ["E.05"]}, {"name": "Bilanzierung und Überprüfung nach Fraefel", "description": "Fraefel betont im Kapitel zur Bilanzierung und Überprüfung, dass Unterricht nicht nur auf die Durchführung von Lernaufgaben abzielt, sondern auch auf die Reflexion der Ergebnisse. Bilanzierung meint dabei die strukturierte Rückschau auf den Lernprozess, während Überprüfung der Klärung dient, inwieweit Lernziele erreicht wurden. Beide Elemente unterstützen Lehrpersonen, den Lernfortschritt sichtbar zu machen, Lernende zu selbstständiger Reflexion anzuleiten und die Passung von Aufgaben, Zielen und Kompetenzen zu überprüfen. Damit tragen sie wesentlich zur Qualitätssicherung und Weiterentwicklung von Unterricht bei. Literatur Fraefel, U. (2023). Erfolgreichen Unterricht planen: Pragmatisch, praktisch, professionell. Münster: Waxmann Verlag (UTB). weiterführende Links Aufgaben als Dreh- und Angelpunkt nach Fraefel Rückwärtsplanung nach Fraefel Planung einer Unterrichtseinheit nach Fraefel eine einzelne Stunden planen (Kernpraktiken) nach Fraefel", "literature": "", "sikos": ["B.04", "I.04", "E.10", "B.05", "L.09", "B.02"]}, {"name": "Bildung für nachhaltige Entwicklung", "description": "Diese Publikation umreisst das Verständnis von Bildung für Nachhaltige Entwicklung (BNE) der Stiftung éducation21 und erhebt keinen Anspruch auf Allgemeingültigkeit. Auf der Grundlage dieses BNE- Verständnisses begleitet éducation21 unterschiedliche BNE-Prozesse in offener und transparenter Weise. Dieses BNE-Verständnis basiert auf einschlägiger Fachliteratur und der Expertise der Mitarbeitenden von éducation21 sowie unserer Partnerinnen und Partner. Der Text ist linear aufgebaut, das BNE-Verständnis ist aber als ein Produkt von dynamisch zusammenwirkenden Elementen zu verstehen. Literatur éducation21 (2016): Bildung für nachhaltige Entwicklung . Ein Verständnis von BNE und ein Beitrag zum Diskurs. Bern, Lausanne, Bellinzona, éducation21. Online-Quelle: https://www.education21.ch/sites/default/files/uploads/pdf-d/bne/BNE-Verstaendnis_Langversion-mit-Quellen_2016.pdf weiterführende Links Webseite von Education21", "literature": "", "sikos": ["L.03", "L.07", "E.04", "L.01", "I.02", "L.02", "E.09", "E.02", "I.01", "E.10", "L.08", "E.03", "E.06", "B.04", "L.10", "I.05", "I.03", "I.04", "B.01", "L.09", "L.05", "E.05", "L.06"]}, {"name": "Bildungschancen", "description": "Das Schweizer Bildungssystem ist unzureichend und ungerecht, da Bildungschancen stark von sozialer Herkunft, Migrationshintergrund und Geschlecht abhängen. Es reproduziert soziale Ungleichheiten und verursacht der Gesellschaft mehr Kosten als Nutzen. Um die Effizienz und Effektivität des Bildungssystems zu verbessern und soziale Ungleichheiten zu verringern, sind bildungs- und sozialpolitische Maßnahmen erforderlich, die auf empirischer Evidenz basieren und eine umfassende Modernisierung des Bildungssystems sowie umgreifende Reformen außerhalb des Bildungssystems beinhalten. Literatur Becker, R. & Schoch, J. (2019). Soziale Selektivität. Empfehlungen des Schweizerischen Wissenschaftsrates SWR. Bern: Schweizerischer Wissenschaftsrat SWR. LINK [21.5.2023] weiterführende Links Link Link Link", "literature": "", "sikos": ["B.04", "E.04", "B.06", "E.08", "I.04", "B.01", "E.03"]}, {"name": "Bindungstheorie", "description": "Pädagogischen Fachkräften ist die Bedeutung von Bindung und Beziehung in Förderkontexten hinreichend bekannt: Beziehungsgestaltung ist der Schlüssel zum Fördererfolg! Eine wesentliche Grundlage der Auseinandersetzung mit beziehungsorientierter Förderung ist die Bindungstheorie. Übertragen auf pädagogische Kontexte kann die Beziehung zur pädagogischen Fachkraft als wichtiger Schutzfaktor und Ressource betrachtet werden. Anhand dieses Konzepts wird sichtbar, welche Bedeutung gelungene im Vergleich zu misslungener Beziehungserfahrung für die kindliche Entwicklung in der Schule etc. hat. Dies wird anhand von Fallbeispielen verdeutlicht. Literatur Jungmann, T. & Reichenbach, C. (2020). Bindungstheorie und pädagogisches Handeln. Ein Praxisleitfaden (5. Aufl.). Dortmund: Borgmann Media. weiterführende Links", "literature": "", "sikos": ["B.03", "E.02", "B.01", "E.10", "B.05", "E.05", "E.01"]}, {"name": "Binnendifferenzierung: verschiedene Varianten", "description": "Dieses Buch liefert keine Zauberformeln, sondern praxistaugliche Lösungen, die Binnendifferenzierung auch unter schwierigen Voraussetzungen gelingen lassen. Es werden verschiedene Differenzierungsvarianten vorgestellt sowie deren Vor- und Nachteile erläutert. Praktische Tipps zur Umsetzung im Unterricht sowie fächerspezifische Hinweise schliessen sich an. Literatur Kress, K. (2019). Binnendifferenzierung in der Sekundarstufe - Das Praxisbuch (6. Auflage) . Profi-Tipps und Materialien aus der Lehrerfortbildung. Augsburg: Auer Verlag. weiterführende Links Link Link Link", "literature": "", "sikos": ["L.03", "L.02", "B.01", "L.08", "B.05"]}, {"name": "BNE im Lehrplan 21", "description": "Bildung für nachhaltige Entwicklung wird im Lehrplan 21 nicht als eigenes Fach, sondern als Leitidee und Querschnittsthema abgebildet. Nachhaltige Entwicklung ist eine Leitidee für die Entwicklung der Gesellschaft. Sie beinhaltet die Zielvorstellung, dass für die Befriedigung der materiellen und immateriellen Grundbedürfnisse aller Menschen heute und in Zukunft eine solidarische Gesellschaft und wirtschaftliches Wohlergehen notwendig sind. Literatur vollständig zitierbare Angabe BNE im Lehrplan 21 weiterführende Links BNE im Lehrplan 21 Webothek als Miroboard mit Links, Webseiten, Texten und Podcasts Link", "literature": "", "sikos": ["L.03", "L.07", "E.04", "E.08", "L.01", "B.02", "E.07", "I.02", "L.02", "E.09", "E.02", "I.01", "E.10", "B.05", "L.08", "E.03", "E.06", "B.03", "B.04", "L.10", "I.05", "I.03", "B.06", "I.04", "B.01", "L.09", "L.05", "E.05", "L.04", "L.06", "E.01"]}, {"name": "Burnout", "description": "Der Begriff Burnout hat keine einheitliche wissenschaftliche Definition und beschreibt ein komplexes Phänomen, das sich auf vielfältige Weise äussern kann. Dennoch gibt es typische Merkmale, die sich herauskristallisiert haben und die für die Früherkennung hilfreich sind. Burnout betrifft die Schule als Ganzes und sollte nicht als rein individuelles Problem betrachtet werden. Literatur Gesundheitsamt Graubünden (2017). Burnout in der Schule: Früh erkennen und vorbeugen. Chur. weiterführende Links Definition Burnout Broschüre Burnout-Prävention für Lehrpersonen", "literature": "", "sikos": ["I.05", "I.03", "I.02"]}, {"name": "Chancengerechtigkeit (normative/rechtliche Grundlagen)", "description": "Zusammenstellung normativer und rechtlicher Grundlagen (Menschenrechte, Kinderrechte, Gleichstellung, Beseitigung von Benachteiligungen etc.) Literatur (Rechtliche Vorgaben werden als Fussnote zitiert) weiterführende Links UNO Allgemeine Erklärung der Menschenrechte (Art. 7) UNO Konvention über die Rechte des Kindes (Unicef) Art. 2 und 23 UNO Übereinkommen über die Rechte von Menschen mit Behinderung (Beitritt Schweiz 2014) Schweizerische Bundesverfassung Art. 8 Bundesgesetz über die Gleichstellung von Frau und Mann Art. 3 Bundesgesetz über die Beseitung von Benachteilungen von Menschen mit Behinderung (Art. 2 und 20) Kantonale Schulgesetze (z.B. Graubünden )", "literature": "", "sikos": ["E.04", "E.08", "I.04", "B.01", "E.03", "E.06", "E.07"]}, {"name": "Coaching-Gespräche mit Lernenden", "description": "Das Praxisbuch richtet sich unabhängig von Schulformen an Einsteiger in\ndas Thema Coaching und ist zugleich ein hilfreiches Grundlagenwerk für\nbereits erfahrene Coaches und Beratungslehrer*innen. Es bietet eine breite\nBasis, um alle im System Schule arbeitenden und lernenden Menschen bei\nder Erreichung ihrer Ziele zu unterstützen. Hierdurch wird ein wichtiger\nBeitrag zur Stärkung von Persönlichkeiten, zu individueller Förderung und\nzu einer gesunden Schule geleistet. Literatur Kremers, T. & Schlüter, N. (2018). Coaching in der Schule. Ein Praxisbuch für lösungsorientierte Beratung. Essen: Neue Deutsche Schule Verlagsgesellschaft. weiterführende Links Link Link Link", "literature": "", "sikos": ["B.03", "I.02", "E.08", "E.09", "E.02", "L.08", "E.06", "E.10", "B.05", "L.09", "E.05"]}, {"name": "Das Ende der Erziehung nach Postman", "description": "Viele Wege führen nach Rom, und alle sind richtig - aber warum Rom? Postman nimmt sich dem grossen Thema von Sinn und Zweck der Schulerziehung unserer Kinder an. Nicht die Wege und Methoden der Wissensvermittlung sind dabei entscheidend, sondern die Frage nach dem Warum, nach dem transzendentalen Sinn von Bildung, die mehr ist als Wissensanhäufung und Know-how. Literatur Postman, N. (1995). Keine Götter mehr. Das Ende der Erziehung. München: dtv. weiterführende Links Link Link Link", "literature": "", "sikos": ["L.03", "E.04", "I.04", "E.03", "L.09"]}, {"name": "Demokratiepädagogik (Just Community)", "description": "Gelebte Demokratie bedeutet, dass Schüler/innen die konkrete Erfahrung demokratischer Teilhabe machen, Verantwortung übernehmen und Konfliktlösung einüben. Dies hilft, Schule und Unterricht als Ort für authentische Demokratie-Erfahrungen zu gestalten - mit bewärten Konzepten und hilfreichen Anregungen. Der Just Community-Ansatz, begründet von Lawrence Kohlberg, fördert eine Gemeinschaft, die durch partizipative Demokratie und Gerechtigkeit geprägt ist, und ist in Schulen und anderen institutionellen Kontexten anwendbar. Der Fokus liegt auf der Entwicklung von moralischer Autonomie und Handlungsfähigkeit durch aktive Beteiligung und eigenverantwortliche Verhandlungen in egalitären Beziehungen. Literatur Edelstein, W. (2009). Demokratie als Praxis und Demokratie als Wert. In: W. Edelstein, S. Frank, A. Sliwka (Hrsg.), Praxisbuch Demokratiepädagogik (S. 7-19). Weinheim: Beltz. Althof, W. & Stadelmann, T. (2009). Demokratische Schulgemeinschaft. In: W. Edelstein, S. Frank, A. Sliwka (Hrsg.), Praxisbuch Demokratiepädagogik (S. 20-53). Weinheim: Beltz. weiterführende Links Link Link Link", "literature": "", "sikos": ["B.04", "E.04", "E.02", "E.03", "E.06", "L.09"]}, {"name": "Dialogisches Lernen", "description": "Seit es Unterricht gibt, denken Pädagogen über die Verbesserung von Unterricht nach. Die beiden Schweizer Autoren wenden sich  an alle, die wie sie unzufrieden sind mit dem Unterricht heute und die nach Lösungsideen suchen: Lehrkräfte an den Schulen aller Schulstufen und aller Unterrichtsfächer sowie Hochschullehrer und ihre Studenten. In den Mittelpunkt des Buches stellen Urs Ruf und Peter Gallin das uralte Problem der Beziehung zwischen Schüler, Lehrer und Unterrichtsstoff. Stoffe sollen Schüler weder langweilen noch erschlagen, wie sie dies vielerorts noch tun. Sie sollen vielmehr zur Reflexion und Produktion anregen. Literatur Ruf, U. & Gallin, P. (2011). Dialogisches Lernen in Sprache und Mathematik. Band 1: Austausch unter Ungleichen. Grundzüge einer interaktiven und fächerübergreifenden Didaktik (4. Aufl.). Seelze: Klett Kallmeyer. weiterführende Links https://www.lerndialoge.ch/files/pdf/200730DruckversionWB_0420_14-17.pdf Link Link", "literature": "", "sikos": ["L.03", "B.03", "B.04", "B.06", "L.02", "E.09", "L.08", "B.05", "L.09", "E.05", "L.06"]}, {"name": "Didaktische Analyse nach Klafki", "description": "Zur bildungstheoretischen Didaktik gelangte Klafki, nachdem er sich seit den 1950er Jahren mit dem traditionellen Widerspruch zwischen materialen (Bildungsinhalte, die so wichtig sind, dass Schüler sie lernen müssen) und formalen (Verhalten und Handlungsformen, die für Schüler wichtig sind) Bildungskonzepten historisch-systematisch auseinandergesetzt hatte. Er versuchte, beide Theorien durch die kategoriale Bildung miteinander zu verbinden. Literatur Klafki, W. (2007). Neue Studien zur Bildungstheorie und Didaktik. Zeitgemässe Allgemeinbildung und kritisch-konstruktive Didaktik (6. Aufl.). Weinheim: Beltz. weiterführende Links Link Link Link", "literature": "", "sikos": ["L.03", "L.07", "B.06", "L.02", "B.01"]}, {"name": "Digitalität", "description": "Digitalität ist mehr als Digitalisierung. Digitalität ist der vierte Leitmedienwechsel nach der Oralität, der Skriptografie und der Typografie und stellt die Paradigmen, wie Gesellschaft und damit auch Schule funktionieren, neu ein. Die Digitalität - sichtbar durch den Einzug von digitalen Infrastrukturen wie Internet, Notebooks, Tablets und interaktiven Whiteboards in Schulen, verändert aber auch die Art und Weise, wie Lernen organisiert wird. Literatur https://larsmecklenburg.medium.com/was-ist-digitalit%C3%A4t-1e15921ef8c0 weiterführende Links Link Link Link", "literature": "", "sikos": ["L.03", "L.07", "E.04", "B.02", "I.02", "L.02", "E.02", "I.01", "B.05", "L.08", "E.03", "B.04", "I.05", "I.04", "B.01", "L.09", "L.05", "L.06", "E.01"]}, {"name": "Dimensionen offenen Unterrichts", "description": "\"Offener Unterricht gestattet es dem Schüler, sich unter Freigabe von Raum, Zeit und Sozialform Wissen und Können innerhalb eines 'offenen Lehrplanes' an selbstgewählten Inhalten auf methodisch individuellem Weg anzueignen. Offener Unterricht zielt im sozialen Bereich auf eine möglichst hohe Mitbestimmung bzw. Mitverantwortung des Schülers bezüglich der Infrastruktur der Klasse, der Regelfindung innerhalb der Klassengemeinschaft sowie der gemeinsamen Gestaltung der Schulzeit ab\" (Peschel, 2006, 78). Literatur Peschel, F. (2006). Offener Unterricht. Idee - Realität - Perspektive und ein praxiserprobtes Konzept zur Diskussion. Teil I: Allgemeindidaktische Überlegungen (5. unveränderte Aufl.). Baltmannsweiler: Schneider Verlag Hohengehren. \"Dimensionen offenen Unterrichts\" S. 280ff. weiterführende Links Link Link Link", "literature": "", "sikos": ["L.03", "L.10", "E.04", "L.02", "L.08", "L.09", "L.04", "L.06"]}, {"name": "Diversity", "description": "In diesem Beitrag wird der Frage nachgegangen, wie sich die Begriffe Vielfalt, Heterogenität, Diversity / Diversität und Intersektionalität voneinander unterscheiden. Auf welche Bedeutungsdimensionen, Prämissen oder Gründungsnarrative bezieht man sich implizit bzw. explizit, wenn man auf diese Begriffe in Forschungsarbeiten oder pädagogischen Konzepten rekurriert? Welche inhaltlichen, normativen oder begriffsgeschichtlichen Implikationen gehen mit den jeweiligen Termini einher? In welchen Forschungsfeldern werden sie in der Erziehungswissenschaft primär aufgerufen? Literatur Walgenbach, K. (2021). Erziehungswissenschaftliche Perspektiven auf Vielfalt, Heterogenität, Diversity/Diversität, Intersektionalitä. Erziehungswissenschaftliche Perspektiven auf Vielfalt, Heterogenität, Diversity / Diversität, Intersektionalität In: I. Hedderich; J. Reppin; C. Butschi [Hrsg.]: Perspektiven auf Vielfalt in der frühen Kindheit. Mit Kindern Diversität erforschen (S. 41-59). Bad Heilbrunn: Verlag Julius Klinkhard. weiterführende Links Charta der Vielfalt Erklärvideo SRF zu Diversity für Kinder Link", "literature": "", "sikos": ["E.04", "B.06", "E.08", "B.01", "E.03", "E.10", "B.05"]}, {"name": "Doing Difference", "description": "Differenzsensible Schul- und Unterrichtsforschungen über soziale Konstruktionsprozesse in Lehrer-Schüler-Interaktionen haben spätestens seit den 1990er Jahren Konjunktur. Dies dokumentieren auch die Beiträge in diesem Band zu schulpädagogisch relevanten Kategorien wie Migration, Geschlecht oder Behinderung. Eine differenzsensible Schul- und Unterrichtsforschung zeigt, dass solche sozialen Differenzen bzw. Kategorien nicht vorgängig oder ‚natürlich‘ vorhanden sind, sondern in Konstruktionsprozessen bzw. Interaktionen hergestellt, modifiziert oder neutralisiert werden. Literatur Walgenbach, K. (2017). Doing Difference. In M. K. W. Schweer (Hrsg.), Lehrer- Schüler-Interaktion: Inhaltsfelder, Forschungsperspektiven und methodische Zugänge (3. Aufl., S. 587–605). Wiesbaden: Springer Fachmedien. weiterführende Links Link Link Link", "literature": "", "sikos": ["E.04", "I.02", "B.01", "E.03", "B.05"]}, {"name": "Dramatisierung, Entdramatisierung & Gender", "description": "In geschlechterreflektiertem Verhalten und Kommunizieren liegt oft die Problematik, dass auf der einen Seite die gesellschaftlich konstruierte Kategorie des Geschlechts aufgelöst werden soll, um die Individualität von Menschen zu unterstützen. Auf der anderen Seite muss jedoch das Geschlecht häufig erst thematisiert werden, um soziale Unterschiede zu verdeutlichen. Um mit dieser Ambivalenz richtig umzugehen, muss eine Ausgewogenheit zwischen Dramatisierung und Entdramatisierung von Geschlecht entstehen. Literatur Debus, K. (2012): Dramatisierung, Entdramatisierung und Nicht-Dramatisierung in der geschlechterreflektierten Bildung. In: K. Debus, B. Könnecke, K. Schwerma, O. Stuve (Hrsg.). Geschlechterreflektierte Arbeit mit Jungen an der Schule. Texte zu Pädagogik und Fortbildung rund um Jungenarbeit, Geschlecht und Bildung (S. 149-158). Berlin: Dissens e. V. weiterführende Links Link Link Link", "literature": "", "sikos": ["E.03", "E.10", "E.02", "E.06"]}, {"name": "eine einzelne Stunden planen (Kernpraktiken) nach Fraefel", "description": "Fraefel zeigt, dass die Planung einzelner Unterrichtsstunden bei erfahrenen Lehrpersonen auf Kernpraktiken beruht. Diese umfassen das Setzen von Zielen, die Auswahl passender Lernaufgaben, die Strukturierung des Ablaufs und die Überprüfung der Ergebnisse. Durch die konsequente Abstimmung von Zielen, Methoden und Materialien wird jede Stunde zielgerichtet, lernwirksam und überprüfbar. Kernpraktiken helfen Lehrpersonen, Routine und Professionalität in die konkrete Unterrichtsgestaltung zu bringen. Literatur Fraefel, U. (2023). Erfolgreichen Unterricht planen: Pragmatisch, praktisch, professionell. Münster: Waxmann Verlag (UTB). weiterführende Links Aufgaben als Dreh- und Angelpunkt nach Fraefel Rückwärtsplanung nach Fraefel Planung einer Unterrichtseinheit nach Fraefel Bilanzierung und Überprüfung nach Fraefel", "literature": "", "sikos": ["L.04"]}, {"name": "Elternarbeit im Berufswahlprozess", "description": "Im Text wird der Frage nachgegangen, wie Eltern und die Kooperation von Eltern und Lehrpersonen den Berufsorientierungsprozess fördern. Auf der Grundlage konzeptueller Überlegungen werden Theorien und Forschungsergebnisse mit Bezug zur Schweiz dargestellt. Der Text schliesst mit Empfehlungen für die praktische Ausgestaltung berufswahlbezogener Zusammenarbeit zwischen Schule und Eltern. Literatur Neuenschwander, M. P. (2020). Elternarbeit in der Berufsorientierungsphase. In T. Brüggemann & S. Rahn (Hrsg.), Berufsorientierung. Ein Lehr- und Arbeitsbuch (2., überarbeitete und erweiterte Auflage), S. 291-302. Münster: Waxmann. weiterführende Links Link Link Link", "literature": "", "sikos": ["I.05", "E.08", "E.09", "E.10", "B.05", "E.07"]}, {"name": "Elterngespräche", "description": "Wie lässt sich die Beziehung zu Eltern von Anfang an so gestalten, dass Kooperation und Vertrauen angelegt sind? Wie lassen sich zahlreiche Gespräche – auch schwierigen Inhalts – konfliktfrei durchführen? Welche Fallen gilt es zu vermeiden und was unterstützt und entlastet in der Vorbereitung? Kati Ahl erläutert anhand zahlreicher Praxisbeispiele Tipps und Tricks aus der systemischen Beratung für Elterngespräche. Literatur Ahl, K. (2023). Elterngespräche konstruktiv führen. Systemisches Handwerkszeug (2. Aufl.). Göttingen: Vandenhoeck & Ruprecht. weiterführende Links Link Link Link", "literature": "", "sikos": ["I.05", "E.09", "E.06", "E.05", "E.07"]}, {"name": "Elternkontakte aufbauen", "description": "Der Text führt kurz in die Grundsätze der Elternarbeit ein und beleuchtet anschliessend anhand verschiedener Formen der Elternarbeit beispielhaft den Aufbau einer tragfähigen Zusammenarbeit - kurz und auf die grundlegenden Überlegungen ausgerichtet. Literatur Keller-Schneider, M. (2018). Impulse zum Berufseinstieg von Lehrpersonen. Grundlagen - Erfahrungsberichte - Reflexionsinstrumente. Bern: hep verlag. Daraus Kap. 7: Elternkontakte aufbauen und pflegen (S. 347-399).", "literature": "", "sikos": ["E.05", "I.05", "E.09", "E.07"]}, {"name": "Entwicklungsaufgaben", "description": "Ausgangspunkt dieses Kapitels ist das Konzept der Entwicklungsaufgaben nach Havighurst, das sehr prominent geworden ist und dessen Grundideen bis heute weitgehend Gültigkeit besitzen. Thematisiert werden konkrete Entwicklungsaufgaben Jugendlicher, historische und kulturelle Einflüsse auf Entwicklungsaufgaben, Quellen von Entwicklungsaufgaben sowie geeignete Zeiträume für Entwicklungsaufgaben. Es folgt eine Darstellung der Identitätsfindung als zentrale Entwicklungsaufgabe des Jugendalters. In Ergänzung zu Entwicklungsaufgaben werden kritische Lebensereignisse und Alltagsprobleme als nicht normative Anforderungen an Jugendliche dargelegt. Die Bedeutung von Ressourcen und Schutzfaktoren für eine erfolgreiche Bewältigung sowohl von Entwicklungsaufgaben als auch von kritischen Lebensereignissen und alltäglichen Stressoren wird angesprochen. Literatur Eschenbeck, H. & Knauf, R.-K. (2018). Entwicklungsaufgaben und ihre Bewältigung. In A. Lohaus (Hrsg.). Entwicklungspsychologie des Jungendalters (S. 23-50). Deutschland: Springer. weiterführende Links Link Link Link", "literature": "", "sikos": ["B.06", "E.08", "B.01", "E.06", "E.10", "B.05", "E.05"]}, {"name": "Ermöglichungsdidaktik nach Arnold", "description": "Ein Lernbuch? Genau, denn das Lehrbuch hat in der Ermöglichungsdidaktik seine Existenzgrundlage verloren. Jemanden zu belehren ist unmöglich – nur selbstgesteuert und eigenverantwortlich kommt der Mensch zum Ziel. Lernen und Lernerfolg können nicht erzeugt, sondern lediglich durch Schaffung geeigneter Lernarrangements ermöglicht werden. Literatur Arnold, R. & Schön, M. (2019). Ermöglichungsdidaktik. Ein Lernbuch . Bern: hep verlag. weiterführende Links Link Link Link", "literature": "", "sikos": ["L.03", "B.04", "E.04", "L.02", "I.04", "L.08", "B.05", "L.01", "L.09", "L.06"]}, {"name": "Erziehungs- und Bildungspartnerschaft", "description": "Um das Verhältnis zwischen Schule, Lehrperson und Eltern zu charakterisieren, hat sich in den letzten ca. 15 Jahren der Begriff \"Erziehungspartnerschaft\" etabliert. Damit ist gemeint, dass die Förderung der Kinder als gemeinsames Anliegen von Schule und Elternhaus ein kooperatives, partnerschaftliches Verhältnis erfordert. Im Text wird das Konzept einer \"Erziehungs- und Bildungspartnerschaft\" als Grundlage für verschiedene Formen des Elternkontaktes erläutert. Literatur Sacher, W., Berger & Guerrini, F. (2019). Schule und Eltern. Eine schwierige Partnerschaft. Wie Zusammenarbeit gelingt. Stuttgart: Kohlhammer. Daraus: Kap. 1 und 2 (S. 9-32). weiterführende Links Link Link Link", "literature": "", "sikos": ["B.03", "I.05", "I.04", "E.09", "B.01", "E.07"]}, {"name": "Erziehungsansätze", "description": "Das Lehrbuch gibt einen Überblick über die wichtigsten allgemein- und sozialpädagogischen Konzepte der europäischen Geschichte - von Platon bis Lyotard. Im Zentrum der komprimierten und verständlichen Darstellung von Erziehungs- und Bildungstheorien stehen nicht allein 'Klassiker' oder bis heute beeindruckende Pädagoginnen und Pädagogen, sondern auch weniger vorbildliche Begründer pädagogischer Ideen. Literatur Kuhlmann, C. (2013). Erziehung und bildung. Einführung in die Geschichte und Aktualität pädagogischer Theorien . Wiesbaden: Springer. weiterführende Links Link Link Link", "literature": "", "sikos": ["I.04", "E.02", "L.09", "E.05", "E.01"]}, {"name": "Erziehungsstile", "description": "Wie Kinder erzogen werden, ist eine zentrale Determinante für die Entwicklung des Verhaltens von Kindern. Anhand von Erziehungsstilen werden intraindividuelle, relativ stabile Muster der Eltern-Kind-Beziehung beschrieben. Die Anwendung der differierenden Erziehungsstile haben Folgen: Eltern, die liebevoll und konsequent erziehen und entwicklungsangemessen fördern, können damit rechnen, dass sich ihre Kinder zu selbstbewussten, emotional stabilen, sozial kompetenten, selbstverantwortlichen und leistungsfähigen Personen entwickeln. Risiken sind dabei nur mögliche, aber weder notwendige noch hinreichende Prädiktoren für eine problematische Entwicklung des Kindes. Literatur Liebenwein, S. & Weiss, S. (2012). Erziehungsstile. In: U. Sandfuchs, W. Melzer, B. Dühlmeier & A. Rausch (Hrsg.), Handbuch Erziehung (S. 160-168). Stuttgart: Julius Klinkhardt. weiterführende Links Übersicht der verschiedenen Erziehungsstile nach Autoren: https://www.socialnet.de/lexikon/Erziehungsstil", "literature": "", "sikos": ["E.04", "E.09", "E.02", "I.01", "E.06", "E.10", "E.05", "L.04", "E.01"]}, {"name": "Es ist nie zu spät eine Glückliche Kindheit zu haben nach Furman", "description": "In Wissenschaft und Öffentlichkeit ist der Mythos fest verankert, dass schwierige Bedingungen in der Kindheit unweigerlich zu einem unglücklichen, gefährdeten Erwachsenenleben führen. Dies kann so sein, ist aber in den meisten Fällen nicht zwangsläufig so. Furman lässt eine grosse Zahl von Betroffenen selbst zu Wort kommen, die einen schwierigen Start ins Leben hatten und trotzdem oder gerade deshalb ein gelungenes Leben führen konnten. Hier geht es nicht darum, die Wahrheit zu schönen oder zu verbiegen und uns selbst zu belügen, damit wir die traurige Vergangenheit in rosarotem Licht sehen! Wir sollen auch nicht so tun, als hätten wir eine glückliche Kindheit gehabt, wenn es nicht so war. Aber tief in ihrem Herzen wissen die Menschen oft, was ihnen helfen könnte, und schaffen es trotz widriger Umstände glücklich zu werden. Das Buch will Mut machen, auf die innere Stimme zu hören. Das Buch wurde in die Liste der “Einhundert Meisterwerke der Psychotherapie” aufgenommen. Literatur Furman, B. (2019). Es ist nie zu spät, eine glückliche Kindheit zu haben (8. Aufl.). Dortmund: verlag modernes lernen. weiterführende Links Link Link Link", "literature": "", "sikos": ["E.08", "E.10", "I.03", "I.01"]}, {"name": "Feedbackebenen", "description": "Seit Veröffentlichung der Hattie-Studie steht Feedback im Zentrum der pädagogischen Aufmerksamkeit. Aber welches Feedback ist wirklich hilfreich? Visible Feedback begleitet Sie bei der Beschäftigung mit unterrichtsbezogenen Rückmeldungen. Auf verständliche und fachlich fundierte Art und Weise erfahren Sie, wie Feedback ein selbstverständlicher Teil Ihrer alltäglichen Arbeit wird angefangen bei der Reflexion der eigenen Haltung bis hin zu einer Feedback-Kultur an Ihrer Schule. Literatur Wisniewski, B. & Zierer, K. (2017). Visible Feedback. Ein Leitfaden für erfolgreiches Unterrichtsfeedback. Hohengehren: Schneider Verlag. weiterführende Links Link Link Link", "literature": "", "sikos": ["B.03", "B.04", "I.05", "E.08", "E.09", "E.10", "B.05", "L.09"]}, {"name": "Funktion der Schule", "description": "Helmut Fend legt in diesem im Jahr 1974 erstmals publizierten Text eine knappe Skizze der funktionalistischen Betrachtung von Bildungs- und Erziehungsprozessen vor. Das Bildungswesen ist Fend zufolge nicht nur durch seine Qualifikations- und Selektionsfuniktion gekennzeichnet. Die Argumentation legt den Schwerpunkt darauf, dass die Schule auch eine zentrale gesellschaftliche Legitimationsfunktion erfüllt. Fend nennt dies die Erzeugung sozialintegrativer Bewusstseinslagen. Literatur Fend, H. (2022). Drei Reproduktionsfunktionen des Schulsystems. In: U. Bauer et al (Hrsg.), Handbuch Bildungs- und Erziehungssoziologie (S. 165-170) . Wiesbaden: Springer. weiterführende Links Link Link Link", "literature": "", "sikos": ["E.08", "I.04", "I.05", "I.02"]}, {"name": "Funktion von Vorurteilen", "description": "In seinem einleitenden Grundlagenbeitrag \"Die Bedeutung von Vorurteil und Stereotyp im interkulturellen Handeln\" liefert Alexander Thomas einen umfassenden Forschungsüberblick zu Stereotyp und Vorurteil. Indem er ihren psychologischen Nutzen für das Individuum nachzeichnet, wendet sich Thomas gegen eine undifferenzierte Verteufelung der beiden Konzepte. Auf Basis empirischer Forschung stellt er praxisorientierte Handlungsvorschläge zum Umgang mit Stereotyp und Vorurteil im interkulturellen Kontext zusammen und identifiziert bestehende Forschungslücken. Literatur Thomas, A. (2006). Die Bedeutung von Vorurteil und Stereotyp im interkulturellen Handeln. interculture journal: Online-Zeitschrift für interkulturelle Studien, 5 (2), 3-20. weiterführende Links Link", "literature": "", "sikos": ["E.03", "I.02", "B.01"]}, {"name": "Förderkreislauf und Förderplanung", "description": "Der Artikel stellt den Diagnostik-Förder-Kreislauf als zentrales Modell für die heil- und sonderpädagogische Praxis vor, das Diagnostik und Förderung systematisch miteinander verknüpft. Ausgehend von einer bio-psycho-sozialen Analyse auf Basis der ICF-CY werden diagnostische Fragestellungen formuliert, Informationen gesammelt und interpretiert, um darauf aufbauend individuell angepasste Fördermaßnahmen zu entwickeln, umzusetzen und zu evaluieren. Anhand eines Fallbeispiels wird gezeigt, wie dieser Kreislauf hilft, internalisierende Verhaltensprobleme wie soziale Ängstlichkeit frühzeitig zu erkennen und wirksam zu begegnen. Literatur Tönnissen, L., Link, P.-C., Hengartner, O. & Hagmann-von Arx, P. (2024). Der Diagnostik-Förder-Kreislauf in der Heil- und Sonderpädagogik. Zeitschrift für Heilpädagogik, 75 , S. 303-311. weiterführende Links Link Link Link", "literature": "", "sikos": ["B.03", "I.05", "B.06", "L.02", "B.01", "L.08", "E.10", "B.05", "L.01"]}, {"name": "Geistige und kognitive Fähigkeiten", "description": "Sturm (2024) thematisiert im Kapitel 4.5 behinderungsbedingte Differenzen im schulischen Kontext und beschreibt, wie Behinderung – analog zu anderen Differenzlinien wie Klasse, Geschlecht und Ethnizität – gesellschaftlich und institutionell konstruiert wird. Es werden verschiedene Modelle von Behinderung (medizinisch, sozial, kulturell) dargestellt und kritisch beleuchtet, wobei betont wird, dass sonderpädagogischer Förderbedarf häufig nicht auf individuelle Defizite, sondern auf strukturelle Passungsprobleme in Schule und Unterricht zurückzuführen ist. Die Zuweisung von Förderbedarf dient oft der Ressourcenvergabe, kann jedoch Benachteiligungen verstärken, insbesondere für Schüler:innen aus sozio-ökonomisch benachteiligten Milieus. Literatur Sturm, T. (2024). Lehrbuch Differenzen in der Schule. München: Ernst Reinhardt Verlag. weiterführende Links Link Link Link", "literature": "", "sikos": ["E.03", "B.01", "L.09", "L.08"]}, {"name": "Geschlecht / geschlechtliche Identität", "description": "Sturm zeigt in Kapitel 4.3, dass Geschlecht eine zentrale, gesellschaftlich konstruierte Differenzkategorie darstellt, die stark auf binäre Zuschreibungen basiert und tief in alltägliche Praktiken sowie schulische Strukturen eingebettet ist. In der Schule zeigen sich geschlechterbezogene Benachteiligungen sowohl in Zugangschancen als auch in unterrichtlichen Interaktionen, wobei stereotype Erwartungen von Lehrpersonen eine bedeutende Rolle spielen. Trotz besserer Bildungserfolge von Mädchen in bestimmten Bereichen sind Jungen häufiger in niedrigeren Bildungsgängen vertreten, was auf komplexe Zusammenhänge zwischen Geschlecht, Milieu und Schulpraxis verweist. Literatur Sturm, T. (2024). Lehrbuch Differenzen in der Schule . München: Ernst Reinhardt Verlag. weiterführende Links Link Link Link", "literature": "", "sikos": ["E.03", "E.04", "B.01"]}, {"name": "Gesprächsformen im Unterricht", "description": "Nur durch angemessene Kommunikation und Partizipation gelingen Unterricht und Lernen. Das Kapitel Gesprächsformen im Unterricht hilft, sich verschiedene Gesprächstechniken anzueignen. Anleitungen zu Reflexionen des pädagogisch und didaktischen Handelns sowie eine theoretische Einführung sind in diesem Arbeitsbuch vereint. Literatur Aicher-Jakob, M. & Seifert, A. (2024). Kommunikation und Partizipation in Schule und Unterricht. Kapitel 2: Gesprächsformen im Unterricht. Paderborn: Brill Schöningh. Buchcover weiterführende Links Link Link Link", "literature": "", "sikos": ["L.04", "E.09", "E.01", "E.04"]}, {"name": "Gesprächsführung", "description": "So gelingen Gespräche! Mit einem systemisch-lösungsorientierten Vorgehen ans Ziel kommen. Systemisch-lösungsorientierte Vorgehensweisen zählen zu den Standardverfahren gelingender Gesprächsführung und Beratung. Sie finden in den verschiedensten Praxisfeldern und Beratungsformaten wie Coaching, Supervision und Therapie Anwendung. Diese Einführung bietet eine fundierte und praxisorientierte Darstellung von Grundlagentheorie, Grundhaltung, Anliegen- und Auftragsklärung, Rollenklärung, Gesprächsführungs- und Fragetechniken. Literatur Lindemann, H. (2023). Einführung in die systemische-lösungsorientierte Gesprächführung und Beratung . Göttingen: Vandenhoeck & Ruprecht. weiterführende Links Link Link Link", "literature": "", "sikos": ["E.06", "E.09", "E.07", "B.03"]}, {"name": "Gesundheit von Lehrpersonen", "description": "Gesunde Lehrpersonen bilden die Voraussetzung um die psychische Gesundheit der Schüler:innen und ihren Bildungserfolg fördern zu können. Dabei handelt es sich nicht nur um ein individuelles Problem, sondern um ein Thema, das eng mit den beruflichen Anforderungen und den Rahmenbedingungen des Berufs verknüpft ist. Literatur Schoch, S. & Keller, R. (2024). Lehrpersonen im Fokus: Ansätze zur Förderung von Gesundheit und Leistungsfähigkeit. Beiträge zur Lehrerinnen- und Lehrerbildung, 42 (1), 32–46. weiterführende Links BGF: die psychische Gesundheit von Lehrpersonen Podcast Resonanzraum Bildung (PHZH): Wie steht es um die Gesundheit der Lehrpersonen?", "literature": "", "sikos": ["I.04", "I.05", "I.03"]}, {"name": "Gewaltfreie Kommunikation nach Rosenberg", "description": "Die Gewaltfreie Kommunikation (GFK) ist ein Konzept, um eine empathische Haltung in der menschlichen Kommunikation zu unterstützen. Das Konzept wurde von Marshall B. Rosenberg in den 1960er-Jahren entwickelt und persönlich in Workshops auf der ganzen Welt angeboten. Das Grundmodell besteht aus den vier Schritten Beobachtung, Gefühl, Bedürfnisse und Bitte. Ziel ist es, nicht andere zu einem bestimmten Handeln zu bewegen, sondern über Wertschätzung zu mehr Kooperation und letztlich mehr Wohlergehen für alle Beteiligten zu kommen. Literatur Rosenberg, M. B. (2019). Empathisch Kommunizieren. Ein kleiner GFK-Leitfaden mit vielen praktischen Übungen. Paderborn: Junfermann Verlag. oder Rosenberg, M. B. (2004). Erziehung, die das leben bereichert: Wie gewaltfreie Kommunikation (GFK) im Schulalltag dazu beiträgt, die Leistungsfähigkeit zu verbessern, Konflitpotenziale abzubauen und Beziehungen zu fördern . Paderborn: Junfermann Verlag. weiterführende Links Video als Einführung, 23min https://www.youtube.com/watch?v=iG9rmP2h2m4 Worshop mit Rosenberg in 4 Teilen, 2000, total ca. 4.5h, englisch https://www.youtube.com/playlist?list=PL5uROBIvcELV7ecGfoLdnDtR5zskQik15", "literature": "", "sikos": ["E.09", "E.02", "E.06", "E.05", "E.01"]}, {"name": "Gleichwürdigkeit nach Juul", "description": "Mit Kindern bedürfnis- und beziehungsorientiert umgehen, das geht nicht nur zu Hause, sondern auch in der Schule. Wer Wege sucht, Kinder als eigenverantwortliche Menschen zu stärken, findet in diesem Buch eine Fülle von Anregungen. Anhand neuester Erkenntnisse aus Hirnforschung und Psychologie zeigt das Autorenteam, wie Bindung und Bildung in Freiheit und Gleichwürdigkeit aussehen und was Verantwortung in der Schule bedeutet. Zahlreiche Tipps und Praxisbeispiele, die unter Mitarbeit der Psychologin und Supervisorin Robin Menges auf die Verhältnisse an Schulen in Deutschland, Österreich und der Schweiz angepasst wurden, vermitteln Lösungen für herausfordernde Situationen, die jeder Pädagoge, aber auch jedes Elternteil kennt. Literatur Juul, J. & Jensen, H. (2019). Vom Gehorsam zur Verantwortung. Wie Gleichwürdigkeit in der Schule gelingt (8. Aufl.). Weinheim: Beltz. weiterführende Links Vortrag von Jesper Juul: Beziehung Lehrer - Schüler Link Link", "literature": "", "sikos": ["B.03", "I.05", "E.04", "E.09", "E.06", "E.05"]}, {"name": "Grundformen des Unterrichtens", "description": "Der Lehrperson kommt bei der Anregung und Begleitung von Lernprozessen ihrer Schüler:innen sowie in Bezug auf deren Lernerfolg eine sehr bedeutende Rolle zu. Eine wesentliche Bedingung für die Gestaltung lernwirksamen Unterrichts bildet dabei unter anderem die Fertigkeit, den Unterricht bewusst durch das Einsetzen verschiedener didaktischer Lernformen zu gestalten. In diesem Paper der PH Luzern werden einige dieser Grundformen beschrieben. Literatur Hugener, I. & Luthiger, H. (2022). Grundlagen und Grundformen des Unterrichtens. Pädagogische Hochschule Luzern. Bild: Broschüre der PH Luzern. weiterführende Links Link Link Link", "literature": "", "sikos": ["L.03", "L.04"]}, {"name": "Grundlagen selbstreguliertes Lernen", "description": "Das Grundlagenkapitel zeigt, weshalb selbstreguliertes Lernen (SRL) eine zentrale Voraussetzung für erfolgreiches, nachhaltiges und lebenslanges Lernen ist. In einer zunehmend komplexen und digitalisierten Welt reicht Fachwissen allein nicht mehr aus: Lernende müssen ihr Lernen aktiv planen, steuern, überwachen und reflektieren können. Das Buch beschreibt SRL als Fähigkeit, Verantwortung für den eigenen Lernprozess zu übernehmen und passende Strategien gezielt einzusetzen. Lehrpersonen erhalten einen wissenschaftlich fundierten und zugleich praxisnahen Einblick, wie Lernstrategien, Motivation, Lernkultur und Lernbegleitung zusammenwirken, um Schülerinnen und Schüler auf ihrem Lernweg nachhaltig zu stärken. Literatur Karlen, Y. (Hrsg.). (2026). Gewusst wie! Selbstreguliertes Lernen im Schulalltag verankern . hep Verlag. weiterführende Links selbstreguliertes-lernen.uzh.ch Zusatzmaterial Buch", "literature": "", "sikos": ["B.05", "L.09"]}, {"name": "Gute Lehrerinnen und Lehrer", "description": "Die einfachen Antworten auf die Frage «Was ist eine gute Lehrerin, was ein\nguter Lehrer?» erfolgen häufig in Form von eher naiven, additiven Wunschkatalogen über ideale Lehrpersonen. Aus der Perspektive der Bildungsforschung\nwird dieses Alltagswissen mit konkreten, kritischen Fragen konfrontiert, die\nmit der umfassenden Frage «Was müssen gute Lehrpersonen wissen und können?» zusammengefasst werden können. Literatur Berner, H., Fraefel, U. und Zumsteg, B. (2018): Didaktisches Handeln und und Denken mit Fokus auf angeleitetes und selbstständiges Lernen. Bern: hep verlag. weiterführende Links Link Link Link", "literature": "", "sikos": ["E.05", "I.02", "I.01"]}, {"name": "HERZ-Theorie des Spiels", "description": "Es gibt in der Psychologie unzählige Überlegungen zu verschiedenen Aspekten des Spiels. In diesem Buchkapitel wird versucht, das kindliche Spiel anhand seiner zentralen Bezugskomponenten zu erklären. Diese bestehen vor allem in Handlung , dem Erleben , der Realität und dem Ziel sowie in der wechselseitigen Beziehung dieser Komponenten. Literatur Mogel, H. (2008). Psychologie des Kinderspiels. Von den frühesten Spielen fis zum Computerspiel. Berlin: Springer. Bild: Buchcover weiterführende Links Link Link Link", "literature": "", "sikos": ["L.07", "L.02", "E.02", "E.10", "L.05", "E.05", "L.04"]}, {"name": "Hochbegabung", "description": "Um intellektuell hochbegabte Kinder und Jugendliche angemessen fördern zu können, sind eine rechtzeitige Diagnostik und fundierte Beratung unumgänglich. Das vorliegende Buch bietet einen umfassenden und aktuellen Überblick über die theoretischen Grundlagen von Hochbegabung sowie über Möglichkeiten der Diagnostik und Förderung. Durch eine klare Strukturierung und didaktische Aufbereitung der Inhalte eignet es sich ideal für das (Selbst-)Studium und für die berufliche Weiterbildung. Literatur Preckel, F. & Vock, M. (2021). Hochbegabung. Ein Lehrbuch zu Grundlagen, Diagnostik und Fördermöglichkeiten (2. Aufl.). Göttingen: Hogrefe. weiterführende Links Link Link Link", "literature": "", "sikos": ["B.03", "B.06", "E.08", "L.02", "B.01", "L.08", "E.03", "E.10", "B.05", "L.01", "L.09"]}, {"name": "ICF", "description": "ICF steht für \"International Classification of Functioning, Disability and Health\" (Internationale Klassifikation der Funktionsfähigkeit, Behinderung und Gesundheit). Es geht darum, wie Lehrpersonen sich bewusst und aktiv um das entsprechende Wissen bemühen müssen, um auf die Bedürfnisse von Schülerinnen und Schülern mit unterschiedlichen Einschränkungen und Hintergründen einzugehen. Dabei spielen situative Eigenschaften und personbezogene Faktoren eine wichtige Rolle. Literatur Hollenweger, J. (2021). ICF als gemeinsame konzeptuelle Grundlage. In: A. Kunz, R. Luder, C. Müller Bösch (Hrsg.), Inklusive Pädagogik und Didaktik (S. 33-56). Bern: hep Verlag. weiterführende Links Link Link Link", "literature": "", "sikos": ["I.05", "B.06", "E.08", "B.01", "L.08", "E.03", "E.10", "B.05", "L.01"]}, {"name": "Ich schaffs - für Jugendliche", "description": "„Ich schaffs! – Cool ans Ziel“ ist ein spielerisches und lösungsorientiertes Programm für die Arbeit mit 13- bis 18-Jährigen, das sich die Vitalität, Neugier und Begeisterungsfähigkeit von Teenagern zunutze macht. Das praxiserprobte Programm unterstützt Jugendliche darin, selbst gesteckte Ziele zu erreichen und Probleme hinter sich zu lassen. Die Leitidee: Lernen und Veränderung gelingen besser mit Zuversicht, Spass und gemeinsam mit anderen. Nach Ben Furmans erfolgreichem Buch „Ich schaffs!” für die Arbeit mit Kindern führt dieses Buch praxisnah durch die speziell für Jugendliche neu konzipierten 15 Schritte des Programms. Literatur Bauer, C. & Hegemann, T. (2013). Ich schaffs! - Cool ans Ziel. Das lösungsorientierte Programm für die Arbeit mt Jugendlichen (4. Aufl.). Heidelberg: Carl-Auer-Systeme Verlag. weiterführende Links Link Link Link", "literature": "", "sikos": ["B.03", "E.04", "E.08", "E.09", "E.02", "L.08", "E.03", "E.06", "E.10", "B.05", "L.09", "E.05", "E.07"]}, {"name": "Inklusive Schule", "description": "Die inklusive Schule - die Schule für alle - nicht nur zu fordern, sondern Realität werden zu lassen, ist eine Herausforderung sowohl für Lehrkräfte als auch für Fachkräfte aus der Heilpädagogik. Wie gelingt die Umsetzung im Schulalltag? Wie kann moderner Unterricht für alle praktisch umgesetzt werden, und welches sonderpädagogische Fachwissen wird in einer inklusiven Schule gebraucht? Das Studienbuch gibt Antworten auf diese Fragen und bietet übersichtlich aufbereitetes Handlungswissen für Studierende sowie Praktikerinnen und Praktiker, das den komplexen Anforderungen realer Schulsituationen gerecht wird. Literatur Luder, R. Kunz, A. & Müller Bösch, C. (2021). Das Besondere der Pädagogik einer inklusiven Schule. In: A. Kunz, R. Luder, C. Müller Bösch (Hrsg.), Inklusive Pädagogik und Didaktik (S. 13-25). Bern: hep Verlag. weiterführende Links Bewertungsraster zu den schulischen Integrationsprozessen (Aargauer Volksschule) Link Link", "literature": "", "sikos": ["I.05", "E.04", "B.06", "L.02", "I.04", "B.01", "L.08", "E.03", "E.10", "B.05"]}, {"name": "Integrativer Unterricht (Didaktische Prinzipien)", "description": "Die schulische Integration von Kindern und Jugendlichen mit Beeinträchtigungen wird von zahlreichen Seiten gefordert. In der praktischen Umsetzung zeigt sich jedoch, dass damit grosse Herausforderungen für Schule und Lehrpersonen verbunden sind. Worauf muss geachtet werden, um eine integrative Schule zu entwickeln? Praxisorientiert wird aufgezeigt, wie der Unterricht gestaltet werden kann, damit er den Bedürfnissen von möglichst allen Schülerinnen und Schülern genügt. Literatur Lienhard-Tuggener, P., Joller-Graf, K. & Mettauer Szaday, B. (2015). Rezeptbuch schulische Integration. Auf dem Weg zu einer inklusiven Schule (2. Aufl.). Bern: Haupt. weiterführende Links Link Link Link", "literature": "", "sikos": ["L.03", "B.03", "I.05", "B.06", "L.02", "B.01", "L.08", "E.10", "B.05", "L.09"]}, {"name": "Intersektionalität", "description": "Dieser Text gibt eine Einführung in das Konzept der Intersektionalität. Literatur Walgenbach, K. (2012). Intersektionalität – eine Einführung. URL:\nwww.portal-intersektionalität.de [19.5.2023] LINK weiterführende Links SRF-Audiobeitrag zum Begriff Intersektionalität Link Link", "literature": "", "sikos": ["E.04", "B.06", "B.01", "E.03", "E.06", "B.05"]}, {"name": "Irrtümer über Klassenführung", "description": "»Eine lebendige Klasse muss eng geführt werden«, »Feste Regeln unterbinden die Autonomie der Schüler:innen« oder »Wer keine natürliche Autorität hat, wird eine Klasse nie führen können«. Über Klassenführung kursieren diverse Glaubenssätze, die durch empirische Forschungsergebnisse widerlegt werden können. Literatur Kleickmann, T. (2023). Acht Irrtümer über Klassenführung . Pädagogik , (1), 22-25. https://doi.org/10.3262/PAED2301022 weiterführende Links Link Link Link", "literature": "", "sikos": ["E.01"]}, {"name": "Klassenführung als lernförderliche Struktur", "description": "Den Unterricht so zu strukturieren, dass Schüler:innen möglichst viel Unterrichtszeit mit Lernen verbringen können, gehört zu den zentralen Aufgaben von Lehrpersonen. Sie sind dafür verantwortlich, die Lernaktivitäten zu überblicken und Störungen durch eine lernförderliche Struktur präventiv zu vermeiden. Im Idealfall agieren sie dabei abgestimmt mit ihren Kolleg:innen. Literatur Albers, A. (2023). Klassenführung . Pädagogik , (1), 6-11. https://doi.org/10.3262/PAED2301006 weiterführende Links Link Link Link", "literature": "", "sikos": ["E.01"]}, {"name": "Klassenführung in einer neuen Lernkultur", "description": "Selbstgesteuerte Lernumgebungen, in denen Schüler:innen vermehrt selbstorganisiert arbeiten, stellen andere Anforderungen an die Klassenführung als Plenumsphasen in einer Lerngruppe. Insbesondere die präventiven Maßnahmen der Klassenführung sind hierbei zentral. Literatur Streber, D. (2023). Klassenführung in einer neuen Lernkultur . Pädagogik , (1), 32-36. https://doi.org/10.3262/PAED2301032 weiterführende Links Link Link Link", "literature": "", "sikos": ["B.05", "E.01", "E.02", "L.09"]}, {"name": "Klassenführung nach Kounin und Evertson", "description": "Unter den Forschungsarbeiten zur Klassenführung gelten die Beiträge von Jacob S. Kounin als wegweisend. Aus forschungsmethodischer Sicht sind die Arbeiten von Kounin von besonderer Qualität und erfüllen viele Kriterien, die aktuell in der Bildungsforschung eingefordert werden. Evertson, Emmer, Worsham (2003) und andere haben die Kriterien von Kounin ergänzt und präzisiert.", "literature": "Seidel, T. (2020). Klassenführung. In: Wild, E., Möller, J. (Hrsg.) Pädagogische Psychologie. Springer-Lehrbuch (107-119). Springer, Berlin, Heidelberg.", "sikos": ["E.04", "E.02", "E.03", "E.06", "E.05", "E.01"]}, {"name": "Klassenrat", "description": "Der Klassenrat ist ein basisdemokratischer Ansatz, um\ngemeinsam Verantwortung für das Leben der Klasse zu\nübernehmen. Die Klasse befragt sich über ihr Handeln\nund ihr Verhalten, über Zufriedenheit und Ärger, über\nProbleme und Ansichten, über Pläne und Absichten,\nüber Vorhaben und Projekte. Entweder konsensuell auf\nder Basis von Argumenten oder aber mit Mehrheit ent-\nscheidet sie über die Regeln, die in der Klasse gelten sol-\nlen, über Pflichten und Arbeitsteilung, über Ämter und Aufgaben. Literatur Friedrichs, B. (2009). Klassenrat. In W. Edelstein, S. Frank, A. Sliwka (Hrsg.), Praxisbuch Demokratiepädagogik (S. 54-89). Weinheim: Beltz. weiterführende Links Beispiel Link Link", "literature": "", "sikos": ["E.04", "E.02", "E.06", "L.09", "E.05"]}, {"name": "Kollegiale Fallberatung (Intervision)", "description": "Intervision, auch Kollegiale Beratung genannt, ist eine zielgerichtete und lösungsorientierte Methode zur Bearbeitung von\nAnliegen und Fragen aus dem professionellen Kontext: In einer Gruppe werden berufliche Praxisfälle vorgestellt. Mit einem strukturierten Ablauf gestaltet die Gruppe ihre Beratungen selbst und entwickelt Handlungsmöglichkeiten. Das erweitert den Lösungsraum und stärkt die Fähigkeit, mit schwierigen Situationen umzugehen. Literatur Tietze, K.-O. (2021). Kollegiale Beratung. Problemlösungen gemeinsam entwickeln (11. Aufl.). weiterführende Links Flyer mit Vorgehen Link Link", "literature": "", "sikos": ["I.05", "I.03", "I.02", "I.04", "E.09", "I.01", "E.06"]}, {"name": "Kollegiale Kooperation", "description": "Kollegiale Kooperation ist für Lehrer:innen selbstverständlich, gleichzeitig aber eine zentrale Herausforderung der Schulentwicklung. Ihr Beitrag zur Qualität des Unterrichts ist noch nicht eindeutig erforscht, macht die systematische Betrachtung aber notwendig. Kooperation im Kollegium gilt als entscheidender Faktor für lernförderliche Schulen, wobei die Potenziale oft nicht vollständig genutzt werden. Prozess- und Ertragsmodelle sowie systematische Formen der Zusammenarbeit bieten Orientierung für die Gestaltung und Evaluation gemeinsamer Entwicklungsprozesse. Literatur Kullmann, H. (2016). Kollegiale Kooperation im Lehrer:innenberuf. In M. Rothland (Hrsg.), Beruf Lehrer:in. Ein Studienbuch (S. 388–405). UTB. weiterführende Links Unterrichtsbezogene Zusammenarbeit", "literature": "", "sikos": ["I.04", "I.05"]}, {"name": "Kompetenzen und Lernziele", "description": "sollen die Schülerinnen und Schüler lernen? Oder anders gefragt: Welches Wissen und\nKönnen und welche Haltungen sollen schliesslich aus ihren Lerntätigkeiten\nresultieren? Das Dokument Kompetenzen und Lernziele bietet eine kurze Einführung zum Verhältnis von Kompetenzen und\nLernzielen und es leitet dazu an, passende Kompetenzen/Kompetenzstufen bzw.\nhilfreiche Lernziele für eine Lerneinheit (Ebene Grobplanung) oder eine Unterrichtssequenz (Ebene Feinplanung) zu\nbestimmen.", "literature": "Buch Didaktisch handeln und denken S. 61 ff Gehrig, M. (2020). Kompetenzorientiert lernen, Grundlagen zur Einführung des Lehrplans 21 im Kanton Graubünden. Chur: Collana PHGR Marti, C., Camenisch, I. (2018). Leitfaden Unterrichtsplanung. PHGR.", "sikos": ["L.03", "L.02", "B.01", "L.01", "B.02"]}, {"name": "Kompetenzorientierung als Leitbegriff der Didaktik", "description": "Im Beitrag wird der Begriff der Kompetenzorientierung als didaktischer Leitbegriff aus einem wissenspädagogischen Blickwinkel beleuchtet. Auch unter der Leitidee der Kompetenzorientierung bleibt die kulturelle Dimension von Wissen und fachlicher Bildung zentral. Weder wird der Wissenskern von Bildung abgewertet, noch die Rolle von Lehrpersonen und Instruktion entwertet. Sodann wird der Frage nachgegangen, was unter kompetenzorientiertem Unterricht als (fach)didaktischer Aufgabe zu verstehen ist und welches dabei die Rolle von Lehrpersonen als Diagnostikerinnen und Diagnostikern von Lernaufgaben und als Gestalterinnen und Gestaltern von Lernumgebungen ist. Literatur Reusser, Kurt: Kompetenzorientierung als Leitbegriff der Didaktik - In: Beiträge zur Lehrerinnen- und Lehrerbildung 32 (2014) 3, S. 325-339 - URN: urn:nbn:de:0111-pedocs-138739 - DOI: 10.25656/01:13873 weiterführende Links Link Link Link", "literature": "", "sikos": ["L.03", "B.03", "L.02", "L.01", "B.02"]}, {"name": "Konfliktebenen", "description": "Interaktionen innerhalb von Organisationen oder Gruppen sind häufig durch Konflikte geprägt. Neben negativen Aspekten wie Stress bergen Konflikte auch kreatives Potenzial für Veränderungen im System. Es gilt, Blockaden als Folge von Konflikten zu vermeiden und das \"Gute vom Schlechten\" darin zu nutzen. Im Text werden verschiedene solche Blockaden auf unterschiedlichen Konfliktebenen mit Hilfe der Transaktionsanalyse durchleuchtet und systemisch-lösungsorientierte Wege aus der Blockade aufgezeigt (Konfliktebenen Lehrperson - Schüler:in, Schulleiter - Lehrperson, Lehrpersonenebene, Lehrperson - Eltern). Literatur Herrmann, P. (2010). Blockaden lösen. Systemische Interventionen in der Schule. Göttingen: Vandenhock & Ruprecht. Darin Kap. 9: Konfliktebenen in der Schule (S. 137-185).", "literature": "", "sikos": ["I.05", "I.03", "I.02", "I.04", "E.09", "E.06", "E.07"]}, {"name": "Konfliktgespräche", "description": "Im Text wird eine Reihe von Strategien beschrieben, um produktiv mit Konflikten in Gesprächssituationen umgehen zu können; dazu gehören u. a. Humor, Kollaboration, Intervention oder Worst-Case- & Best-Case-Szenarien. Ergänzend werden Möglichkeiten zum Umgang mit eskalierenden Konflikten und Krisen aufgezeigt. Literatur Ahl, K. (2023). Elterngespräche konstruktiv führen. Systemisches Handwerkszeug ( 2., erweiterte Auflage). Göttingen: Vandenhoeck & Ruprecht. Darin Kap. 10 & 11, S. 123-170.", "literature": "", "sikos": ["E.06", "I.05", "E.09", "E.07"]}, {"name": "Konstruktivismus", "description": "Der Text bietet eine umfassende Einführung in den Lernprozess aus einer konstruktivistischen Perspektive. Er zeigt verschiedene Theorieperspektiven auf und gibt Anregungen zur Selbstbeobachtung und Reflexion des eigenen Lernens. Der Text eröffnet Einblicke in die Bedeutung von Beobachterperspektiven im Lernprozess und zeigt auf, wie man diese nutzen kann, um das eigene Lernen zu verbessern. Literatur Neubert, S., Reich, K. & Voß, R. (2001). Lernen als konstruktiver Prozess. In T. Hug (Hrsg.), Wie kommt Wissenschaft zu Wissen (Band 1) (S. 253 – 265). Baltmannsweiler: Schneider. weiterführende Links Ein etwas anderer Podcast zum Konstruktivismus Link Link", "literature": "", "sikos": ["L.03", "L.07", "E.08", "L.01", "B.02", "E.07", "I.02", "L.02", "E.09", "E.02", "I.01", "E.10", "B.05", "E.06", "B.03", "B.04", "L.10", "I.05", "B.06", "I.04", "B.01", "L.09", "L.05", "E.05", "L.04", "L.06", "E.01"]}, {"name": "Kooperation in multiprofessionellen Teams", "description": "Kooperation in multiprofessionellen Teams an inklusiven Schulen ist entscheidend, um die unterschiedlichen Bedürfnisse von Schüler:innen bestmöglich zu fördern. Effektive Teamarbeit ermöglicht den Austausch von Fachwissen, koordiniertes Vorgehen und gemeinsame Verantwortung für Lernprozesse. Dabei sind klare Rollen, Kommunikationsstrukturen und systematische Abstimmungen zentrale Voraussetzungen, damit Zusammenarbeit gelingt und die inklusive Schulentwicklung nachhaltig unterstützt wird. Literatur Widmer-Wolf, P. (2018). Kooperation in multiprofessionellen Teams an inklusiven Schulen. In T. Sturm & M. Wagner-Willi (Hrsg.), Handbuch schulische Inklusion (S. 299–314). Opladen: Budrich UniPress.", "literature": "", "sikos": ["E.10", "B.05", "I.05", "L.08"]}, {"name": "Kooperation von Lehrpersonen", "description": "Die Kooperation von Lehrpersonen ist entscheidend für die Qualität des Unterrichts und die Schulkultur. Dabei spielen sowohl individuelle als auch kollektive Ressourcen eine wichtige Rolle: Während individuelle Stärken und Fachkompetenzen das eigene Handeln prägen, ermöglichen kollektive Ressourcen wie gemeinsames Wissen und Unterstützung im Team eine nachhaltige Weiterentwicklung und Bewältigung der beruflichen Herausforderungen. Literatur Keller-Schneider, M., Albisser, S. (2013). Kooperation von Lehrpersonen und die Bedeutung von individuellen und kollektiven Ressourcen. In: Keller-Schneider, M., Albisser, S. & Wissinger, J. (Hrsg.): Professionalität und Kooperation in Schulen. Beiträge zur Diskussion über Schulqualität ( S. 33-56).Bad Heilbrunn: Klinkhardt. weiterführende Links Link", "literature": "", "sikos": ["I.04", "I.05", "I.02"]}, {"name": "Kritische Rückmeldung geben nach Furman", "description": "Es ist leichter, einen Ratschlag anzunehmen als Kritik. Es ist leichter, einen Vorschlag anzunehmen als einen Ratschlag. Es ist leichter, einen Wunsch anzunehmen als einen Vorschlag. Literatur Furman, B. & Ahola, T. (2017). Twin Star - Lösungen vom anderen Stern. Teamentwicklung für mehr Erfolg und Zufriedenheit am Arbeitsplatz (5. Aufl.). Heidelberg: Carl-Auer-Systeme Verlag. weiterführende Links Link Link Link", "literature": "", "sikos": ["B.03", "B.04", "I.05", "I.03", "E.09", "E.02", "E.06", "B.05", "E.05", "E.07"]}, {"name": "Kultur der Digitalität", "description": "Referentialität, Gemeinschaftlichkeit und Algorithmizität sind die charakteristischen Formen der Kultur der Digitalität, in der sich immer mehr Menschen, auf immer mehr Feldern und mithilfe immer komplexerer Technologien an der Verhandlung von sozialer Bedeutung beteiligen (müssen). Sie reagieren so auf die Herausforderungen einer chaotischen, überbordenden Informationssphäre und tragen zu deren weiterer Ausbreitung bei. Dies bringt alte kulturelle Ordnungen zum Einsturz und Neue sind bereits deutlich auszumachen. Literatur Stalder, F. (2016): Kultur der Digitalität . Berlin, Suhrkamp Verlag weiterführende Links Referat von Felix Stalder im Forum für Universität und Gesellschaft, Veranstaltungsreihe DIGITALE WELT - ANALOGE ERFAHRUNG https://www.youtube.com/watch?v=fwk3xVAiG9M #Routenplaner digitale Bildung Bildung unter den Bedingungen der Digitalität - Blog von Axel Krommer SchuleSocialMedia - Blog von Philippe Wampfler Bildung von morgen heute schon denken - Blog von Dejan Mihajlovic", "literature": "", "sikos": ["L.03", "L.07", "E.04", "L.01", "B.02", "I.02", "L.02", "I.01", "B.05", "L.08", "E.03", "B.03", "B.04", "L.10", "I.05", "B.06", "I.04", "B.01", "L.09", "L.05", "L.04", "L.06"]}, {"name": "Lehrperson nach Hattie", "description": "Der deutsche Hattie-Übersetzer Zierer legt damit eine komprimierte Übersicht über Hatties Forschung vor, die es vor allem auch im Berufsleben stehenden Lehrkräften ermöglichen soll, sich schnell einen fundierten Überblick über die aktuelle bildungswissenschaftliche Diskussion zu verschaffen. Aus diesem Grund wurde auch der sicher etwas zugespitzte Titel »Hattie für gestresste Lehrer« gewählt. Das Buch kann dabei sowohl als eine Einführung in das Denken Hatties als auch als ein Kommentar zu seinen beiden großen Studien gelesen werden. Literatur Zierer, K. (2016). Hattie für gestresste Lehrer. Kernbotschaften und Handlungsempfehlungen aus John Hatties \"Visible Learning\" und \"Visible Lerning for Teachers\" (2. Aufl.). Baltmannsweiler Schneider Verlag Hohengehren. weiterführende Links Buchvorstellung, 6.5min https://www.youtube.com/watch?v=FkWZyT10wEU", "literature": "", "sikos": ["B.03", "I.02", "B.06", "E.02", "E.05", "L.04", "E.01"]}, {"name": "Lern- und Bildungsgeschichten", "description": "Was müssen pädagogische Beobachtungen leisten, die sich mit Lernprozessen von Schülerinnen und Schülern auseinandersetzen, fragt Heike de Boer. Dazu skizziert sie ihr Verständnis von Lernen und reflektiert, ob und in welcher Form Lernen zu beobachten ist. Verschiedene Konzepte, die mit offenen, pädagogischen Beobachtungen und mit Beobachtungsprotokollen arbeiten, werden vorgestellt. An Beispielen wird gezeigt, welche Schritte notwendig sind, um eine pädagogisch angelegte Beobachtung durchführen und dokumentieren zu können und wie der Wechsel von einer eher defizitorientierten Perspektive hin zu einer Ressourcenorientierung methodisch unterstützt werden kann. Im Rückgriff auf das vom Deutschen Jugendinstitut entwickelte Konzept der Lern- und Bildungsgeschichten werden beispielhafte Darstellungen vorgenommen und reflektiert. Literatur de Boer, H. (2012). Pädagogische Beobachtung. In: de Boer, H., Reh, S. (eds) Beobachtung in der Schule – Beobachten lernen. VS Verlag für Sozialwissenschaften, Wiesbaden. weiterführende Links Link Link Link", "literature": "", "sikos": ["B.03", "B.06", "B.01", "L.08", "E.10", "B.05", "L.09"]}, {"name": "Lernen am gemeinsamen Gegenstand", "description": "Feuser's Konzept des \"Lernens am gemeinsamen Gegenstand\" fördert inklusive Bildung, indem alle Lernende gemeinsam an einem konkreten Gegenstand arbeiten. Es betont die aktive Auseinandersetzung mit der Welt in einer kooperativen und dialogischen Weise, die auf interaktiven Prozessen und gegenseitiger Unterstützung basiert. Literatur Feuser, G. (2007). Lernen am \"Gemeinsamen Gegenstand\". Vortrag im Rahmen der Vortragsreihe \"Offener Unterricht - Antwort auf Heterogenität\" der Pädagogischen Hochschule Zentralschweiz vom 11.1.2007 in Luzern. weiterführende Links Kooperatives Lernen am gemeinsamen Gegenstand: Link", "literature": "", "sikos": ["L.03", "L.07", "E.04", "E.08", "L.01", "B.02", "E.07", "I.02", "L.02", "E.09", "E.02", "I.01", "E.10", "B.05", "L.08", "E.03", "E.06", "B.03", "B.04", "L.10", "I.05", "I.03", "B.06", "I.04", "B.01", "L.09", "L.05", "E.05", "L.04", "L.06", "E.01"]}, {"name": "Lernen in Projekten im Kontext BNE", "description": "Mit dem Blick auf Bildung für nachhaltige Entwicklung und Demokratiebildung ist die Diskussion über ein altes Unterrichtskonzept neu entfacht. Welche Potenziale hat das Lernen in Projekten heute? Vor welchen Herausforderungen stehen Lehrer:innen und Schüler:innen bei der praktischen Umsetzung, und wie können sie gelöst werden? Literatur Siewert, J. (2025). Lernen in Projekten: Ziele, Konzepte, Herausforderungen. Pädagogik, 8, 6–11. Beltz Verlagsgruppe.", "literature": "", "sikos": ["L.06", "L.10"]}, {"name": "Lernförderliche Schulentwicklung", "description": "Im Mittelpunkt von Schule und Unterricht steht das Lernen der Schüler:innen, das von sich ständig wandelnden Faktoren beeinflusst wird. Die zentrale Frage lautet: Wie gelingt es, Schule lernförderlich weiterzuentwickeln, und welche Aspekte müssen dabei berücksichtigt werden? Lernförderliche Schulentwicklung setzt an der Gestaltung von Unterricht, schulischen Strukturen und der Zusammenarbeit im Kollegium an, um die Schule als lernende Organisation zu stärken. Systemische Zusammenhänge, Daten und kontinuierliche Reflexion spielen dabei eine zentrale Rolle, um Entwicklungsprozesse wirksam zu steuern. Literatur Jude, N. (2022). Lernförderliche Schulentwicklung. Pädagogik, 6, 6–9. https://doi.org/10.3262/PAED2206006", "literature": "", "sikos": ["I.04", "I.05", "I.02"]}, {"name": "Lernprozessmodelle: PADUA KAFKA SAMBA", "description": "Lernprozesse spielen sich in den Köpfen der Schülerinnen und Schüler ab und können von den Lehrpersonen nur intendiert werden. Doch wie kann man sich diesen Lernprozess vorstellen? Eine Möglichkeit schlägt der Lernpsychologe Hans Aebli vor. Aebli (1983) beschrieb im Rahmen seines Modells PADUA fünf Schritte eines vollständigen, verstehensorientierten Lernprozesses. Reusser (1999) differenziert das PADUA-Modell nach SAMBA (Lehrtätigkeit der Lehrpersonen) und KAFKA (Lerntätigkeiten der Schülerinnen und Schüler) aus. Aeblis Lernprozessmodell mit weiteren Perspektiven. Literatur Steinmann, S. (2022). Lernen anregen und begleiten als zentrale Aufgabe der Lehrperson. In PH Luzern (Hrsg.), Grundlagen und Grundformen des Unterrichtens. Studienband Grundjahr-Mentorat. 1. und 2. Semester (S. 5-11). Verfügbar unter: www.phlu.ch/2682. Zugriff am 27. Juni 2023. Abbildung S. 10. weiterführende Links Folio zum Thema Unterrichtsvorbereitung (AVIVA-Modell nach Christoph Städeli) Link Link", "literature": "", "sikos": ["L.03", "B.03", "B.06", "L.02", "B.01", "L.08", "B.05", "L.01", "L.06"]}, {"name": "Lernpsycholgische Grundlagen", "description": "Der Auszug aus dem Lehrbuch der Pädagogischen Psychologie beschreibt, was erfolgreiches Lernen aus psychologischer Sicht ausmacht und warum sich Menschen darin unterscheiden. Es geht der Frage nach, welche inneren Voraussetzungen dazu beitragen, dass Lernen gelingt. Dabei wird ein Modell vorgestellt, das verschiedene Einflussfaktoren auf das Lernen miteinander in Beziehung setzt. Literatur Hasselhorn, M. & Gold, A. (2002). Pädagogische Psychologie. Erfolgreich Lernen und Lehren. Kohlhammer. weiterführende Links Link Link Link", "literature": "", "sikos": ["B.03", "B.06", "L.02", "B.01", "L.08", "B.05", "L.09", "L.01"]}, {"name": "Lernschwierigkeiten", "description": "Der Artikel bietet eine differenzierte Begriffsbestimmung rund um Lernschwierigkeiten, Lernstörungen, Lernbehinderungen, Lernbeeinträchtigungen und Lernbenachteiligungen und ordnet diese entlang eines theoretischen und diagnostischen Verständnisses. Es zeigt, wie Lernschwierigkeiten als Oberbegriff für unterschiedliche schulische Leistungsprobleme verstanden werden können, und diskutiert kritisch die diagnostischen Kriterien (z. B. das doppelte Diskrepanzkriteriu
